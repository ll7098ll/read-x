연·비교·인과) 및 접속어를 85% 이상 정확히, [행동] 판별하고 문장 간 지시·인과 관계를 연결할 수 있다.","mager_writing":"[조건] 중심문장만 제시된 미완성 설명 문단과 세부 정보 조각들이 주어졌을 때, [준거] 알맞은 접속어(‘예를 들어, 따라서’ 등)와 지시어를 사용하여 중심문장을 뒷받침하는 세부 문장 3개 이상을 주어-서술어 호응에 맞게, [행동] 연결하여 완결된 문단으로 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V1-2 ➔ G4-EXP-V1-2 ➔ G5-EXP-V1-2","horizontal_link":"[공통기초 결합] A1(상하위·단어관계), A3(문장골격 주·목·서), A4(지시어·접속어), A5(명시적 인과) | ➔ [쓰기 W3·W4 전이] 텍스트 내 관계(비유/인과/경험-감상/중심-뒷받침/주장-근거) 원리를 내 문단 연결 및 문장 구성에 적용"},{"code":"G4-EXP-V1-3","grade":"4학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-3 구조 확인 (갈래별 미시·거시 텍스트 구조 도해)","sub_skill_name":"구조 확인 (설명 방법 및 거시적 텍스트 구조 도해)","curriculum_basis":"`[4국02-02]`(글의 처음-가운데-끝 구조와 문단 짜임을 고려하며 읽기), `CCSS RI.4.5`(텍스트나 텍스트 일부분의 전반적인 구조[연대기, 비교, 원인/결과, 문제/해결] 설명하기), Meyer(1985) 텍스트 구조 이론 기초.","dc_step1":"3~4문단 설명문에서 ‘처음(설명 대상 소개)-가운데(핵심 설명)-끝(정리)’의 3단 경계를 찾고, 가운데 부분의 구조 표지(‘~와 마찬가지로/반면에[비교·대조], ~하기 때문에/그 결과[인과], 먼저~다음으로[과정]’)를 포착한다.","dc_step2":"포착한 구조 표지를 바탕으로 가운데 문단들의 텍스트 구조(열거, 순서/과정, 비교·대조, 원인·결과)를 판별한다.","dc_step3":"판별한 구조에 맞는 도해 틀(비교·대조 벤다이어그램/비교표, 인과 화살표 틀, 과정 순서도)에 본문 정보를 시각화한다.","mager_reading":"[조건] 3~4문단으로 구성된 설명문이 주어졌을 때, [준거] 글 전체를 ‘처음-가운데-끝’ 3단 구조로 정확히 나누고, 가운데 부분의 담화표지를 단서로 문단 구조(열거, 순서, 비교·대조, 인과 중 해당 구조)를 100% 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 비교·대조 또는 원인·결과 구조로 쓰인 3~4문단 설명문과 빈 도해조직자(벤다이어그램·비교표·인과도)가 주어졌을 때, [준거] 글의 구조에 맞는 도해 틀을 골라 공통점·차이점(비교 기준 명시) 또는 원인·결과를 누락 없이, [행동] 구조화하여 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V1-3 ➔ G4-EXP-V1-3 ➔ G5-EXP-V1-3","horizontal_link":"[공통기초 결합] A4(담화 전환 표지), A5(선후·인과·구조), A6(문단 짜임) | ➔ [쓰기 W3 직결] 읽기에서 완성한 \'갈래별 구조 도해조직자\'를 내 글의 \'개요 설계 틀(Graphic Organizer)\'로 1:1 미러링"},{"code":"G4-EXP-V1-4","grade":"4학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-4 요약 및 주제 확인 (핵심 골격 간추리기·주제·제목)","sub_skill_name":"요약 및 주제 확인 (중심 내용 간추리기 & 제목 붙이기)","curriculum_basis":"`[4국02-02]`(글의 구조를 고려하여 내용을 간추린다), `CCSS RI.4.2`(텍스트의 중심 생각을 결정하고 핵심 세부사항을 바탕으로 텍스트를 요약하기), Kintsch & van Dijk 거시규칙(삭제·일반화) 기초.","dc_step1":"3~4문단 설명문에서 반복되는 말이나 사소한 예시·수식어를 지우고(삭제 규칙), 여러 하위 사례(예: 개미, 벌, 나비)를 상위 낱말(예: 곤충)로 바꾼다(일반화 규칙).","dc_step2":"처음-가운데-끝 각 부분의 중심 문장을 찾고, 가운데 부분의 문단 구조(열거/비교/인과/순서)에 맞게 중심 내용들을 연결한다.","dc_step3":"글 전체의 중심 내용을 3~4문장으로 간추리고 설명 대상과 중심 내용이 드러나는 제목을 작성한다.","mager_reading":"[조건] 3~4문단 설명문과 여러 개의 요약문·제목 후보가 주어졌을 때, [준거] 삭제·일반화 규칙이 바르게 적용되어 처음-가운데-끝의 핵심 내용이 빠짐없이 들어간 요약문과 포괄적 제목을 정확히, [행동] 가려낼 수 있다.","mager_writing":"[조건] 3~4문단 분량의 설명문이 주어졌을 때, [준거] 세부 예시와 중복 표현을 삭제하고 하위 어휘를 상위어로 일반화하여 글 전체 내용을 3문장 내외로 요약하고 알맞은 제목을, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V1-4 ➔ G4-EXP-V1-4 ➔ G5-EXP-V1-4","horizontal_link":"[공통기초 결합] A3(수식어 삭제·문장골격 추출), A6(중심-세부 위계 및 삭제·선택·일반화·구성 요약) | ➔ [쓰기 W1·W4 전이] 요약한 중심 명제와 제목 짓기 원리를 내 글의 핵심 주제문(Topic Sentence) 및 제목 설정에 적용"},{"code":"G4-EXP-V2-1","grade":"4학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-1 어휘·비유·관용표현·형태소 문맥 추론","sub_skill_name":"학술 어휘·형태소 및 다의어 문맥 추론","curriculum_basis":"`[4국02-02]`, `[4국04-02]`(문맥 속 어휘의 의미 관계와 다의성 파악), `CCSS RI.4.4 & L.4.4a-b`(정의, 예시, 재진술 등 텍스트 문맥 단서와 그리스/라틴[한국어의 한자어] 어근·접사를 활용한 4학년 학술 어휘 의미 추론).","dc_step1":"3~4문단 설명문에서 교과 개념어(예: ‘증발’, ‘생태계’, ‘문화재’)가 등장할 때, 그 앞뒤에 있는 재진술(‘즉, 다시 말해’), 예시(‘예를 들어’), 대조(‘~와 달리’) 단서와 낱말의 낱글자·앞뒤 붙는 말(예: ‘재-활용’, ‘불-규칙’)을 찾는다.","dc_step2":"낱말의 짜임(합성어·파생어 기초)과 문맥 단서를 결합하여 개념어의 핵심 의미 자질을 도출한다.","dc_step3":"추론한 개념어의 의미를 문맥에 맞게 설명하고 유의어·반의어와 연결한다.","mager_reading":"[조건] 3~4문단 설명문에 낯선 교과 개념어와 다의어가 포함되어 있을 때, [준거] 앞뒤 문장의 재진술·예시·대조 단서와 기초 접사(‘풋-, 맨-, 재-, -꾼’ 등) 단서를 결합하여 어휘의 문맥적 의미를 85% 이상 정확히, [행동] 추론할 수 있다.","mager_writing":"[조건] 본문 속 개념어 2개가 주어졌을 때, [준거] 본문의 문맥 단서(어떤 문장/표현을 보고 알았는지)를 근거로 제시하며 각 개념어의 뜻을 자신의 말로, [행동] 정확하게 풀이하여 쓸 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V2-1 ➔ G4-EXP-V2-1 ➔ G5-EXP-V2-1","horizontal_link":"[공통기초 결합] A1(합성어·파생어 어근·접사 분석), A2(다의어·동형어·속담·관용표현 문맥 추론) | ➔ [쓰기 W2·W4 전이] 문맥으로 추론한 비유·다의어·관용표현·학술어를 내 글의 생생하고 설득력 있는 표현 재료로 활용"},{"code":"G4-EXP-V2-2","grade":"4학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-2 생략된 상황·인과·숨은 전제·거시지시어 추론","sub_skill_name":"문단 간 응집성(거시 지시어) 및 생략된 인과·과정 추론","curriculum_basis":"`[4국02-03]`(생략된 내용이나 암시된 내용을 추론하며 읽기), `CCSS RI.4.1 & RI.4.3`(텍스트의 세부사항과 예시를 근거로 텍스트에 암시된 인과·절차 추론하기), Kintsch 교량 추론(Bridging Inference) 이론.","dc_step1":"3~4문단 설명문에서 문단과 문단이 넘어갈 때 쓰인 응집 표현(‘이러한 문제는, 이 과정을 거치면, 그 결과’)에 표시한다.","dc_step2":"응집 표현이 가리키는 앞 문단의 구체적 사실 전체를 역추적하여 요약하고, 앞 문단의 원인이 뒷 문단의 결과로 이어지는 데 생략된 중간 고리를 배경지식으로 연결한다.","dc_step3":"생략된 중간 과정과 조건 변화 시 나타날 결과를 추론한다.","mager_reading":"[조건] 3~4문단의 과학·사회 설명문이 주어졌을 때, [준거] 문단 간 지시어(‘이러한 문제/이 과정’)가 압축하는 앞 문단 내용과 텍스트에 생략된 인과 고리를 85% 이상 정확히, [행동] 추론하여 판별할 수 있다.","mager_writing":"[조건] 인과·과정 중심의 3~4문단 설명문이 주어졌을 때, [준거] 문단 간 지시어가 가리키는 앞 문단의 내용을 풀어서 쓰고, [원인 ➔ (추론한 생략 과정) ➔ 결과]의 빈칸을 배경지식과 본문 단서를 결합해 2문장 이상으로, [행동] 서술할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V2-2 ➔ G4-EXP-V2-2 ➔ G5-EXP-V2-2","horizontal_link":"[공통기초 결합] A4(생략 성분 복원·거시 지시어 역추적), A5(생략된 매개 인과·숨은 전제 추론) | ➔ [쓰기 W3·W5 전이] 생략된 맥락·인과·전제 추론 원리를 통해 내 글의 논리적 비약이나 사건 빈틈을 메우며 조직·퇴고"},{"code":"G4-EXP-V2-3","grade":"4학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-3 인물 심리·화자 정서·시각자료·독자반응 추론","sub_skill_name":"텍스트와 시각 매체 자료 간 통합 추론","curriculum_basis":"`[4국02-04]`, `CCSS RI.4.7`(차트, 그래프, 다이어그램, 타임라인 등 시각적·양적 정보를 해석하고 그 정보가 텍스트 이해에 어떻게 기여하는지 설명하기).","dc_step1":"3~4문단 설명문에 제시된 꺾은선그래프·비교표에서 시간의 흐름에 따른 증가·감소 추세(기울기 변화)를 포착한다.","dc_step2":"그래프의 변화 추세를 본문에 제시된 원인·배경 설명과 교차 연결한다.","dc_step3":"본문과 그래프 추세를 바탕으로 앞으로의 변화 방향(미래 예측)이나 다른 사례에의 적용을 추론한다.","mager_reading":"[조건] 시계열 그래프(꺾은선그래프 등)나 도표가 포함된 3~4문단 설명문이 주어졌을 때, [준거] 도표의 변화 추세(증가·감소·유지)와 본문의 원인 설명을 결합하여 향후 변화 방향이나 암시된 의미를 85% 이상 정확히, [행동] 추론할 수 있다.","mager_writing":"[조건] 설명문과 시계열 그래프가 주어졌을 때, [준거] 그래프의 변화 추세와 본문의 원인을 근거로 들어 앞으로 어떻게 변할지 예측하는 내용을 2~3문장으로, [행동] 논리적으로 서술할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V2-3 ➔ G4-EXP-V2-3 ➔ G5-EXP-V2-3","horizontal_link":"[공통기초 결합] A2(감정·태도 어휘), A5(상황-반응 내적 인과 연결) | ➔ [쓰기 W1·W4 전이] 화자/인물 심리·시각자료·예상 독자 반응 추론을 바탕으로 독자 맞춤형 표현·시각자료·반론 대응 구사"},{"code":"G4-EXP-V2-4","grade":"4학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-4 작가(필자) 의도·관점·시점·맥락 추론","sub_skill_name":"필자의 집필 목적·예상 독자·관점 추론","curriculum_basis":"`[4국02-03]`, `CCSS RI.4.6 & RI.4.8`(동일 주제에 대한 서술 초점·시각 비교 및 필자의 의도 파악).","dc_step1":"3~4문단 설명문에서 사용된 낱말의 수준(쉬운 풀이 유무), 예시 소재(학교생활, 어린이 놀이 등), 마지막 문단의 정리 문장을 찾는다.","dc_step2":"사용된 어휘·예시 단서를 통해 글쓴이가 생각한 예상 독자(어린이 vs 어른)를 연결하고, 대상을 어떤 방향(예: 이로움 중심 vs 작동 원리 중심)에서 설명했는지 연결한다.","dc_step3":"글쓴이의 집필 목적, 예상 독자, 설명 초점을 통합적으로 추론한다.","mager_reading":"[조건] 3~4문단 설명문이 주어졌을 때, [준거] 본문의 어휘 난이도·예시 소재·마무리 문장을 단서로 글쓴이의 집필 목적과 예상 독자층을 85% 이상 정확히, [행동] 추론할 수 있다.","mager_writing":"[조건] 3~4문단 설명문이 주어졌을 때, [준거] 본문에 쓰인 어휘나 예시를 근거로1개 이상 제시하며 이 글의 예상 독자와 글쓴이의 집필 의도를 2문장으로, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V2-4 ➔ G4-EXP-V2-4 ➔ G5-EXP-V2-4","horizontal_link":"[공통기초 결합] A6(전체 주제 의식 도출), A2(어조·어감 분석) | ➔ [쓰기 W1 직결] 필자의 집필 의도·관점·맥락 추론을 역적용하여 내 글의 집필 목적·서술 시점·관점 수립"},{"code":"G4-EXP-V3-1","grade":"4학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-1 표현·서술 방식 및 근거·시각자료 적절성 평가","sub_skill_name":"설명 방법·표현 및 시각 자료의 적절성 평가","curriculum_basis":"`[4국02-04]`, `CCSS RI.4.5 & RI.4.7`(도표·그래프의 적합성 및 텍스트 조직 방식 평가), `PIRLS`(텍스트 구조 및 시각 요소 평가).","dc_step1":"3~4문단 설명문에 쓰인 설명 방식(비교, 순서 등)과 그래프의 종류(막대그래프 vs 꺾은선그래프) 및 제목·단위를 확인한다.","dc_step2":"설명하려는 내용의 특성(예: 시간별 변화 추세인데 막대나 표로만 제시했는지, 수량 크기 비교인데 꺾은선으로 잘못 그렸는지)과 선택된 그래프·표현이 잘 맞는지 대조한다.","dc_step3":"설명 표현과 도표 유형의 적절성을 평가하고 알맞은 도표 유형으로 대안을 제시한다.","mager_reading":"[조건] 3~4문단 설명문과 삽입된 도표·그래프가 주어졌을 때, [준거] (1) 본문 설명이 모호하지 않고 명확한지, (2) 데이터의 특성(크기 비교 vs 시간별 변화)에 비추어 그래프 종류와 단위 표시가 적절한지를 85% 이상 정확히, [행동] 평가할 수 있다.","mager_writing":"[조건] 부적절한 그래프나 모호한 표현이 포함된 3~4문단 설명문이 주어졌을 때, [준거] 그래프나 표현의 문제점 1가지를 지적하고 독자 이해를 높일 수 있는 수정 대안을 2문장으로, [행동] 서술할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V3-1 ➔ G4-EXP-V3-1 ➔ G5-EXP-V3-1","horizontal_link":"[공통기초 결합] A1·A2(어휘·비유·표현 효과 비교), A3(문장 명료성) | ➔ [쓰기 W4·W5 직결] 좋은 표현·시각자료·근거 적절성 평가 준거를 내 초고 집필 및 표현 퇴고 루브릭으로 적용"},{"code":"G4-EXP-V3-2","grade":"4학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-2 작품 공감·인물선택·내용 정확성·논리 타당성 평가","sub_skill_name":"정보의 정확성·객관성·출처 신뢰성 및 관점 공정성 평가","curriculum_basis":"`[4국02-04]`, `[4국05-01]`(인터넷 등 매체에서 정보를 찾을 때 출처 확인 기초), `CCSS RI.4.8`.","dc_step1":"3~4문단 설명문 및 도표에서 자료의 출처(누가, 어디서 발표했는지)와 조사 연도(언제 조사했는지)를 찾는다.","dc_step2":"출처가 믿을 만한 기관(예: 기상청, 국립생태원, 백과사전 vs 익명 댓글)인지, 그리고 너무 오래된 옛날 자료가 아닌지 연결하여 따져 본다.","dc_step3":"출처 유무와 조사 시점을 기준으로 설명 정보의 믿을 만한 정도(신뢰성)를 평가한다.","mager_reading":"[조건] 출처와 작성 연도가 다른 두 설명 자료(3~4문단)가 주어졌을 때, [준거] 출처의 명확성과 자료의 최신성을 기준으로 더 믿을 수 있는 설명 자료를 100% 정확히, [행동] 평가하여 선택할 수 있다.","mager_writing":"[조건] 출처가 불분명하거나 20년 전 통계표를 사용한 설명문이 주어졌을 때, [준거] 출처 신뢰성과 최신성 측면에서 문제점 2가지를 찾아 어떻게 보완해야 하는지 2문장으로, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V3-2 ➔ G4-EXP-V3-2 ➔ G5-EXP-V3-2","horizontal_link":"[공통기초 결합] A5(근거-주장 논리적 타당성·인과 오류 점검) | ➔ [쓰기 W2·W5 직결] 인물의 선택·정보 객관성·논리 타당성 평가 준거를 내 글의 내용 타당성·공정성 자기점검 기준으로 적용"},{"code":"G4-EXP-V3-3","grade":"4학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-3 내 삶 연결·내면화 및 다매체 비교·팩트체크","sub_skill_name":"다중 설명 자료 교차 검증 및 지식 재구성","curriculum_basis":"`[4국02-04]`, `[4국05-01]`, `CCSS RI.4.9`(동일 주제에 대해 다주제·다매체로 작성된 두 텍스트의 정보를 통합하여 주제에 대해 지식을 가지고 말하거나 쓰기).","dc_step1":"같은 주제를 다룬 책(인쇄 설명문)과 인터넷 백과사전·통계 도표 자료에서 각각의 핵심 사실과 수치를 찾는다.","dc_step2":"여러 자료의 사실·수치가 서로 일치하는지 확인하고, 만일 다른 점이 있다면 어느 자료가 더 최근의 정확한 자료인지 대조한다.","dc_step3":"검증된 정보들을 항목별로 묶어 하나의 체계적인 설명 내용으로 합친다.","mager_reading":"[조건] 동일 주제를 다룬 인쇄 설명문과 인터넷 정보·도표 자료가 주어졌을 때, [준거] 두 자료 간 정보 일치 여부와 정보량의 차이를 85% 이상 정확히, [행동] 교차 확인하여 판별할 수 있다.","mager_writing":"[조건] 동일 주제를 다룬 2종의 설명 자료가 주어졌을 때, [준거] 두 자료에서 일치하는 핵심 사실과 상호 보완되는 세부 정보를 통합하여 1편(3~4문단 구성 개요 또는 요약문)으로, [행동] 정리해 쓸 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V3-3 ➔ G4-EXP-V3-3 ➔ G5-EXP-V3-3","horizontal_link":"[공통기초 결합] A6(다중 텍스트 통합·재구성) | ➔ [쓰기 W1·W2 직결] 텍스트와 내 삶·다중 매체를 연결·검증한 성찰 결과를 내 글쓰기의 직접적 글감·주제로 채택"},{"code":"G4-EXP-W1","grade":"4학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W1 계획하기 (목적·독자·주제·갈래 설정)","sub_skill_name":"계획하기 (설명 목적·독자 분석·대상 및 주제 좁히기)","curriculum_basis":"`[4국03-02]`, `[4국03-03]`(읽을 사람과 글 쓸 목적을 고려하여 설명하는 글 계획하기), `CCSS W.4.2 & W.4.4`.","dc_step1":"설명할 대상을 정하고 예상 독자(누가 읽을지)가 그 대상에 대해 이미 아는 것과 모르는 것을 점검한다.","dc_step2":"너무 넓은 주제(예: ‘동물’)를 3~4문단으로 설명하기에 알맞은 범위(예: ‘사막여우와 북극여우의 생김새 비교’)로 줄인다.","dc_step3":"예상 독자, 설명 목적, 좁혀진 주제를 포함한 작문 계획서를 완성한다.","mager_reading":"[조건] 광범위한 주제와 구체적으로 좁혀진 주제 후보들이 주어졌을 때, [준거] 3~4문단 설명문으로 쓰기에 알맞게 범위가 좁혀진 주제와 독자 맞춤형 계획을 85% 이상 정확히, [행동] 선택할 수 있다.","mager_writing":"[조건] 넓은 범주의 화제(예: ‘전통문화’, ‘날씨’)와 작문 계획서가 주어졌을 때, [준거] 예상 독자의 수준과 설명 목적을 밝히고, 3~4문단으로 설명할 수 있도록 구체적으로 좁힌 주제를, [행동] 계획서에 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-W1 ➔ G4-EXP-W1 ➔ G5-EXP-W1","horizontal_link":"[공통기초 결합] A6(주제 설정) + 읽기 V1-4/V2-4(작가 의도·목적)·V3-3(삶 연결 글감) 전이 | ⬅ [읽기 V2-4·V3-3 수용] 필자 의도 추론과 내 삶 연결 성찰에서 도출한 글감·주제·독자를 글쓰기 계획으로 확정"},{"code":"G4-EXP-W2","grade":"4학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W2 내용 생성하기 (글감·감각/비유·사실/근거 자료 수집)","sub_skill_name":"내용 생성하기 (다중 출처 자료 수집·정확성/신뢰성 검증·시각자료 기획)","curriculum_basis":"`[4국03-02]`, `[4국03-03]`, `[4국02-04]`, `CCSS W.4.7 & W.4.8`(여러 출처에서 관련 정보를 수집·분류하고 출처 목록 정리하기).","dc_step1":"도서, 어린이 백과사전, 공공기관 누리집 등에서 설명 주제와 관련된 사실·수치 자료를 수집하고 출처와 연도를 함께 적는다.","dc_step2":"출처가 분명하고 최근 자료인지를 확인하여(`V3-2` 연계) 믿을 수 있는 자료만 남기고, 수치 자료를 보여 줄 알맞은 표·막대/꺾은선그래프를 고른다.","dc_step3":"문단별로 들어갈 사실 자료 묶음과 삽입할 표·그래프 자료를 준비한다.","mager_reading":"[조건] 설명문 쓰기를 위해 모은 여러 출처의 텍스트·도표 자료들이 주어졌을 때, [준거] 주제 관련성, 출처 명확성, 최신성, 그리고 도표 유형의 적절성을 기준으로 글에 활용할 자료를 85% 이상 정확히, [행동] 선별할 수 있다.","mager_writing":"[조건] 설명 주제와 다중 참고 자료가 주어졌을 때, [준거] 출처와 조사 연도를 명시하여 핵심 사실 정보 4가지 이상을 선별·기록하고, 수치 정보를 나타낼 표 또는 그래프 1개를, [행동] 기획·작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-W2 ➔ G4-EXP-W2 ➔ G5-EXP-W2","horizontal_link":"[공통기초 결합] A1·A2(감각어·복합어·비유·관용어 생성) + 읽기 V1-1/V2-1/V3-1 전이 | ⬅ [읽기 V1-1·V2-1·V3-1 수용] 읽은 모델 텍스트의 소재·어휘·근거 기준을 활용하여 풍부한 글감과 자료 생성"},{"code":"G4-EXP-W3","grade":"4학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W3 내용 조직하기 (읽기 구조 미러링 개요·도해 설계)","sub_skill_name":"내용 조직하기 (6대 설명 구조 선택·처음-가운데-끝 개요·담화표지 배치)","curriculum_basis":"`[4국03-02]`(처음-가운데-끝의 구성에 맞게 개요 짜기), `CCSS W.4.2a & W.4.2c`(문단과 절로 정보를 묶어 조직하고 범주 간 연결어 사용하기).","dc_step1":"수집한 자료들을 **‘처음(설명 대상 소개 및 흥미 유발) - 가운데(핵심 설명 문단 1·2·3) - 끝(요약 및 마무리)’**의 3단 구성으로 나눈다.","dc_step2":"가운데 부분의 내용 특성에 따라 ‘열거’, ‘비교·대조’, ‘순서·과정’, ‘원인·결과’ 중 알맞은 짜임을 고르고 도표가 들어갈 문단을 정한다.","dc_step3":"3단 구성 개요표에 문단별 중심 내용, 연결어, 도표 위치를 기입한다.","mager_reading":"[조건] 설명 자료 묶음과 미완성된 ‘처음-가운데-끝’ 개요표가 주어졌을 때, [준거] 3단 구성의 각 단계에 들어가야 할 내용과 가운데 문단의 설명 짜임(비교/열거/순서/인과)을 85% 이상 정확히, [행동] 배치할 수 있다.","mager_writing":"[조건] 수집한 설명 자료와 도표가 주어졌을 때, [준거] ‘처음(대상 소개)-가운데(2~3개 문단별 중심 내용 및 설명 짜임)-끝(정리)’의 3단 구조와 도표 삽입 위치, 문단 연결어를 모두 명시하여, [행동] 설명문 개요표를 작성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-W3 ➔ G4-EXP-W3 ➔ G5-EXP-W3","horizontal_link":"[공통기초 결합] A4(담화표지 배치)·A6(개요 위계) + 읽기 V1-2/V1-3(텍스트 구조 도해조직자 미러링) 전이 | ⬅ [읽기 V1-2·V1-3 수용] 읽기 단계의 텍스트 구조 도해조직자를 내 글의 문단·연·플롯 개요 틀로 전환하여 조직"},{"code":"G4-EXP-W4","grade":"4학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W4 초고 집필하기 (갈래별 핵심 표현 전략·문장화)","sub_skill_name":"집필하기 (중심-뒷받침 위계·학술 어휘 뜻풀이·객관적 어조·시각자료 통합 집필)","curriculum_basis":"`[4국03-02]`(대상의 특징이 드러나게 설명하는 글을 쓴다), `[4국03-03]`(절차와 결과가 드러나게 보고하는 글을 쓴다), `CCSS W.4.2a-e`(사실, 정의, 구체적 세부사항, 도표, 교과 어휘를 사용하여 다문단 설명글 쓰기).","dc_step1":"3단 개요에 따라 ‘처음’ 문단에서 설명할 대상을 소개하고 독자의 관심을 이끄는 문장을 쓴다.","dc_step2":"‘가운데’ 2~3개 문단에서 비교·대조(‘~와 마찬가지로, 반면에’), 열거(‘첫째, 둘째’), 순서·인과 표현을 사용하여 각 문단을 중심-뒷받침 구조로 서술하고, 준비한 표·그래프를 본문 설명과 연결해 넣는다.","dc_step3":"‘끝’ 문단에서 설명한 내용을 간추려 정리하고 제목을 붙여 3~4문단 설명글을 완성한다.","mager_reading":"[조건] 3~4문단 설명글 초안과 도표 삽입 문장이 주어졌을 때, [준거] 비교·열거·순서 표현의 적절성과 본문에서 도표를 가리키는 설명 문장의 자연스러움을 85% 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 작성한 3단 구성 개요표와 표·그래프 자료 1개가 주어졌을 때, [준거] (1) 처음-가운데-끝 3~4문단 구성을 갖출 것, (2) 비교·대조 또는 열거·순서 표현을 사용하여 중심-뒷받침 문단을 서술할 것, (3) 표·그래프를 본문 내용과 연결하여 제시할 것, (4) 어울리는 제목을 붙일 것의 4가지 준거를 충족하여 1편의 설명문을, [행동] 집필할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-W4 ➔ G4-EXP-W4 ➔ G5-EXP-W4","horizontal_link":"[공통기초 결합] A2·A3(문장 확장·장르별 표현 전략 구사) + 읽기 V1~V3 통합 전이 | ⬅ [읽기 전 과정 수용] 계획·생성·조직한 개요와 갈래별 핵심 표현 전략을 결합하여 완결된 초고 집필"},{"code":"G4-EXP-W5","grade":"4학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W5 고쳐쓰기 (내용·조직·표현[주술호응·교정부호] 3단계 퇴고)","sub_skill_name":"고쳐쓰기 (내용 정확성/객관성·조직 응집성·표현 주술/부사어 호응 `[6국04-05]` 3단계 교정부호 퇴고)","curriculum_basis":"`[4국03-04]`(교정부호를 사용하여 글을 고쳐 쓴다), `CCSS W.4.5`.","dc_step1":"3~4문단 설명문 초안에서 (1) 사실과 다르거나 도표 수치와 맞지 않는 내용, (2) 문단 구분(줄 바꿈·들여쓰기) 오류, (3) 주어와 서술어가 어울리지 않는 어색한 문장을 찾는다.","dc_step2":"찾은 오류에 알맞은 기본 교정부호(고치기, 빼기, 넣기, 줄 바꿈, 자리 바꾸기 등)를 연결한다.","dc_step3":"교정부호를 사용하여 초안을 수정하고 완성본을 다시 작성한다.","mager_reading":"[조건] 내용·문단 구분·문장 표현 오류가 포함된 3~4문단 설명문 초안이 주어졌을 때, [준거] 고쳐야 할 부분 3곳 이상과 그에 맞는 교정부호를 85% 이상 정확히, [행동] 찾아 연결할 수 있다.","mager_writing":"[조건] 3~4문단 설명문 초안과 교정부호 표가 주어졌을 때, [준거] 교정부호(빼기·넣기·고치기·줄바꿈 등)를 3개 이상 바르게 사용하여 내용(사실·도표 일치), 조직(문단 나눔), 표현(어색한 문장)을, [행동] 퇴고하여 완성할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-W5 ➔ G4-EXP-W5 ➔ G5-EXP-W5","horizontal_link":"[공통기초 결합] A3(주술·목서·부사어·시제·높임 호응 및 문장부호 교정), A4(응집성 교정) | ⬅ [공통 A3·A4 및 읽기 V3-1·V3-2 수용] 내용·조직·표현(주술/부사어 호응, 시제, 맞춤법, 교정부호) 3단계 메타인지 퇴고"},{"code":"G5-EXP-V1-1","grade":"5학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-1 내용 확인 (명시적 정보·대상·사실 식별)","sub_skill_name":"내용 확인 (대상과 특징·세부 정보 식별)","curriculum_basis":"`[6국02-01]`(글을 읽고 핵심 개념과 세부 정보를 확인한다), `[6국02-03]`(사진, 도표 등 매체 자료를 활용하며 글을 읽는다), `CCSS RI.5.1`(텍스트를 정확히 인용하며 명시적 설명 확인).","dc_step1":"4~6문단의 설명문에서 ‘~란 ~이다’, ‘~을 가리킨다’와 같은 개념 정의 문장과 구체적 수치·사례·특성 정보를 담은 문장을 포착한다.","dc_step2":"포착한 핵심 개념 정의와 각 문단의 세부 설명 항목(원리, 종류, 특징), 그리고 다중 도표(원그래프·비교표·구조도)의 세부 항목을 교차 연결한다.","dc_step3":"본문과 시각 자료에 명시된 세부 사실과 변형·과장된 오답 진술(예: ‘일부’를 ‘모두’로 변형, 수치 단위 왜곡)을 엄밀히 변별한다.","mager_reading":"[조건] 학술 개념과 비교표·그래프가 포함된 4~6문단의 설명문이 주어졌을 때, [준거] 핵심 개념의 명시적 정의 1개, 문단별 세부 사실·사례 3개 이상, 시각 자료의 세부 수치·비율 정보를 90% 이상의 정확도로, [행동] 본문 근거를 인용하여 추출하고 세부 내용 일치 여부를 판별할 수 있다.","mager_writing":"[조건] 읽은 설명문의 핵심 개념 및 세부 정보 정리 양식이 주어졌을 때, [준거] 핵심 개념의 정의와 문단별 세부 사실·수치 정보를 본문 및 도표의 객관적 근거를 명시하여 4문장 이상으로, [행동] 왜곡이나 누락 없이 정리해 기술할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V1-1 ➔ G5-EXP-V1-1 ➔ G6-EXP-V1-1","horizontal_link":"[공통기초 결합] A1(해독·어휘·형태소), A2(감각어·기초어휘) | ➔ [쓰기 W2 전이] 읽기에서 포착한 장르별 필수 요소(대상/인물/경험/개념/주장·근거)를 내 글의 내용 생성 항목으로 전환"},{"code":"G5-EXP-V1-2","grade":"5학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-2 관계 확인 (지시·인과·문장골격·비유·중심세부 관계)","sub_skill_name":"관계 확인 (문단 내 중심-세부, 어휘 위계, 문장 골격, 지시·인과 관계)","curriculum_basis":"`[6국02-02]`(글의 구조와 문단 간 관계 파악), `[6국04-02]`(낱말의 의미 관계[상하·동위·전체-부분·유의·반의] 파악), `[6국04-05]`(문장 성분의 호응 관계 파악), `CCSS RI.5.3`(두 개 이상의 개념·사건·절차 간의 관계와 상호작용 설명).","dc_step1":"4~6문단 설명문에서 각 문장의 수식어(관형어·부사어)를 괄호로 묶어 필수 문장 성분 골격(주어-목적어/보어-서술어)을 추출하고, 학술 개념어들의 범주 표지(‘~의 종류에는, ~은 ~로 이루어진다’)를 찾는다.","dc_step2":"문단 내 문장들을 [중심문장(상위 명제) ➔ 1차 뒷받침문장(하위 설명: 정의·분류·비교) ➔ 2차 세부문장(구체적 예시·수치·인용)]의 3층위로 연결하고, 어휘들을 상하위(분류)·동위·전체-부분(분석) 관계로 매핑한다.","dc_step3":"문장 성분 골격과 어휘 위계, 인과·순서 표지를 결합하여 문단 내·문단 간 명제 관계망을 도출한다.","mager_reading":"[조건] 4~6문단의 과학·사회 설명문이 주어졌을 때, [준거] 복합 문장의 필수 성분 골격(주어·목적어·서술어) 추출, 문단 내 [중심-1차 뒷받침-2차 세부(예시·인용)] 층위 구분, 그리고 핵심 개념어의 ‘상하위(종류)’ 대 ‘전체-부분(구성 요소)’ 의미 관계 변별을 각각 85% 이상 정확히, [행동] 분석하여 표시할 수 있다.","mager_writing":"[조건] 읽은 설명문의 핵심 개념어 목록과 문단 텍스트가 주어졌을 때, [준거] 개념어들의 상하위·동위·전체-부분 위계도와 문단 내 중심-세부 3층위 구조를 필수 문장 성분(주·목·서) 골격이 드러나는 명료한 문장으로, [행동] 계층형 개념도(Concept Map)에 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V1-2 ➔ G5-EXP-V1-2 ➔ G6-EXP-V1-2","horizontal_link":"[공통기초 결합] A1(상하위·단어관계), A3(문장골격 주·목·서), A4(지시어·접속어), A5(명시적 인과) | ➔ [쓰기 W3·W4 전이] 텍스트 내 관계(비유/인과/경험-감상/중심-뒷받침/주장-근거) 원리를 내 문단 연결 및 문장 구성에 적용"},{"code":"G5-EXP-V1-3","grade":"5학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-3 구조 확인 (갈래별 미시·거시 텍스트 구조 도해)","sub_skill_name":"구조 확인 (설명 방법 및 거시적 텍스트 구조 도해)","curriculum_basis":"`[6국02-01]`(글에 드러난 설명 방법을 파악한다), `[6국02-02]`(글의 구조를 고려하며 읽는다), `CCSS RI.5.5`(두 개 이상의 텍스트에서 개념·사건·정보의 전반적 구조[비교, 인과, 연대기, 문제/해결] 비교·분석), Meyer(1985) 6대 설명 구조 이론.","dc_step1":"4~6문단 설명문에서 미시적 설명 방법 표지(정의·예시·비교·대조·분류·분석)와 거시적 텍스트 구조 담화표지(일정한 기준에 따라 나누면[분류], 구성 요소를 살펴보면[분석], 공통점과 차이점[비교·대조], ~단계를 거친다[과정], ~로 인해 ~이 발생한다[인과], 이러한 문제를 해결하려면[문제·해결])를 모두 찾아 표시한다.","dc_step2":"일정한 **분류 기준**에 따라 종류를 나눈 **‘분류(Classification)’**와 하나의 대상을 구성 부분으로 쪼갠 **‘분석(Analysis)’**을 엄격히 구별하고, 각 문단의 설명 방법과 거시 구조를 매핑한다.","dc_step3":"6대 설명 구조 각각에 대응하는 맞춤형 도해조직자(위계 분류표, 부분-전체 구조도, 비교·대조 매트릭스, 단계 흐름도, 인과 사슬도, 문제-원인-해결 표)로 텍스트를 시각화한다.","mager_reading":"[조건] 다양한 설명 방법이 사용된 4~6문단의 설명문이 주어졌을 때, [준거] 담화표지와 서술 방식을 단서로 문단별 설명 방법 및 거시 텍스트 구조(**정의, 예시, 분류[기준 명시], 분석[구성 요소], 비교·대조, 순서[과정], 인과, 문제·해결**)를 85% 이상 정확히, [행동] 변별할 수 있다.","mager_writing":"[조건] 4~6문단의 설명문이 주어졌을 때, [준거] 글의 핵심 설명 구조(6대 구조 중 해당 유형)에 가장 적합한 도해조직자(Graphic Organizer)를 스스로 선택·설계하여 분류 기준·비교 준거·인과 화살표 등 구조 표지를 포함해, [행동] 한눈에 보이는 구조도로 시각화하여 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V1-3 ➔ G5-EXP-V1-3 ➔ G6-EXP-V1-3","horizontal_link":"[공통기초 결합] A4(담화 전환 표지), A5(선후·인과·구조), A6(문단 짜임) | ➔ [쓰기 W3 직결] 읽기에서 완성한 \'갈래별 구조 도해조직자\'를 내 글의 \'개요 설계 틀(Graphic Organizer)\'로 1:1 미러링"},{"code":"G5-EXP-V1-4","grade":"5학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-4 요약 및 주제 확인 (핵심 골격 간추리기·주제·제목)","sub_skill_name":"요약 및 주제 확인 (중심 내용 간추리기 & 제목 붙이기)","curriculum_basis":"`[6국02-02]`(글의 구조를 고려하며 글을 요약한다), `CCSS RI.5.2`(텍스트의 두 개 이상의 중심 생각을 결정하고 텍스트를 요약하기), van Dijk & Kintsch(1983) 4대 거시규칙(삭제·선택·일반화·구성).","dc_step1":"4~6문단 설명문에서 불필요한 수식어·부사절·세부 예시·인용구를 삭제하고, 각 문단 중심문장의 필수 문장 성분(주어·목적어·서술어)을 추출한다.","dc_step2":"중심문장이 명시되지 않은 문단은 세부 내용들을 아우르는 상위 명제를 직접 만들고(구성 규칙), 글의 설명 구조 표지(‘~는 크게 ~와 ~로 나뉘며’, ‘~와 달리 ~는’, ‘~로 인해 ~가 발생한다’)로 문단별 중심 명제를 연결한다.","dc_step3":"텍스트 구조를 반영한 완결된 요약문을 작성하고 `[핵심 대상] + [설명 측면(원리/종류/특징)]` 구조의 제목과 소제목을 생성한다.","mager_reading":"[조건] 4~6문단 설명문이 주어졌을 때, [준거] 거시규칙(삭제·선택·일반화·구성)과 글의 설명 구조(분류·비교·인과 등)가 정확히 반영된 요약문 및 [핵심 대상]+[설명 측면] 구조의 제목·소제목을 90% 이상의 정확도로, [행동] 판별할 수 있다.","mager_writing":"[조건] 4~6문단 설명문이 주어졌을 때, [준거] 세부 예시·수식어를 삭제하고 글의 구조 표지(분류/비교/인과 연결어)를 활용하여 원문 분량의 1/4~1/5 길이(3~4문장)로 요약문을 작성하고, [핵심 대상]+[설명 측면]이 명시된 제목을, [행동] 생성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V1-4 ➔ G5-EXP-V1-4 ➔ G6-EXP-V1-4","horizontal_link":"[공통기초 결합] A3(수식어 삭제·문장골격 추출), A6(중심-세부 위계 및 삭제·선택·일반화·구성 요약) | ➔ [쓰기 W1·W4 전이] 요약한 중심 명제와 제목 짓기 원리를 내 글의 핵심 주제문(Topic Sentence) 및 제목 설정에 적용"},{"code":"G5-EXP-V2-1","grade":"5학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-1 어휘·비유·관용표현·형태소 문맥 추론","sub_skill_name":"학술 어휘·형태소 및 다의어 문맥 추론","curriculum_basis":"`[6국04-02]`(낱말의 짜임[어근과 접사, 합성어와 파생어]과 새말이 만들어지는 원리를 이해한다), `[6국02-01]`, `CCSS RI.5.4 & L.5.4a-b`(원인/결과, 비교 등 문맥 단서와 형태소[어근·접사] 분석을 결합한 학술·전문 어휘 의미 추론).","dc_step1":"4~6문단 설명문에서 낯선 학술 개념어나 한자 합성어·파생어(예: ‘과잉(過剩)’, ‘친환경적’, ‘수용성’, ‘가공식품’)를 포착하고, 형태소 단위(어근+어근, 접두사+어근, 어근+접미사)로 쪼갠다.","dc_step2":"아는 형태소/한자 음뜻(예: ‘친[親: 가까울 친]+환경+적’, ‘수[水: 물]+용[溶: 녹을 용]+성[性: 성질]’)의 의미와 문단 내 정의·인과·대조·예시 문맥 단서를 교차 결합한다.","dc_step3":"형태소 분석과 문맥 단서를 통합하여 학술 어휘 및 다의어·관용표현의 정확한 문맥적 의미를 도출한다.","mager_reading":"[조건] 한자 학술어·파생어 및 다의어가 포함된 4~6문단의 설명문이 주어졌을 때, [준거] 형태소(어근+접사 [6국04-02]) 분석과 앞뒤 문맥 단서(정의·대조·인과)를 결합하여 어휘의 문맥적 의미를 90% 이상 정확히, [행동] 추론하여 판별할 수 있다.","mager_writing":"[조건] 본문 속 학술 합성어·파생어 2개와 다의어 1개가 주어졌을 때, [준거] [형태소(어근/접사) 단서] + [본문 문맥 단서] ➔ [추론한 문맥적 의미]의 3단계 추론 과정을 모두 명시하여, [행동] 어휘 추론 분석표에 서술할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V2-1 ➔ G5-EXP-V2-1 ➔ G6-EXP-V2-1","horizontal_link":"[공통기초 결합] A1(합성어·파생어 어근·접사 분석), A2(다의어·동형어·속담·관용표현 문맥 추론) | ➔ [쓰기 W2·W4 전이] 문맥으로 추론한 비유·다의어·관용표현·학술어를 내 글의 생생하고 설득력 있는 표현 재료로 활용"},{"code":"G5-EXP-V2-2","grade":"5학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-2 생략된 상황·인과·숨은 전제·거시지시어 추론","sub_skill_name":"문단 간 응집성(거시 지시어) 및 생략된 인과·과정 추론","curriculum_basis":"`[6국02-02]`(글의 구조와 문맥을 고려하며 생략된 내용 추론하기), `CCSS RI.5.1 & RI.5.3`(텍스트를 정확히 인용하며 명시적 설명과 추론적 결론 도출하기), Kintsch 텍스트 간 응집성(Coherence) 및 정교화 추론(Elaborative Inference) 이론.","dc_step1":"4~6문단 설명문에서 문단 첫머리의 거시 지시어(‘이러한 현상은, 이 원리는, 이와 같은 변화는’)와 문단 간 생략된 인과·과정 구간을 포착한다.","dc_step2":"거시 지시어가 단일 단어가 아니라 **선행 문단 전체의 복합 사태(원인+과정)**를 압축하고 있음을 역추적하여 연결하고, 과학·사회적 배경지식을 활성화하여 명시되지 않은 중간 매개 원리를 결합한다.","dc_step3":"특정 조건이 바뀌거나 현상이 지속될 때 발생할 파생 결과와 부작용을 논리적으로 추론한다.","mager_reading":"[조건] 4~6문단 설명문이 주어졌을 때, [준거] 문단 간 거시 지시어(‘이러한 현상/이 과정’)가 압축하는 선행 문단 사태 전체를 역추적하고, 생략된 중간 매개 원리 및 조건 변화에 따른 파생 결과를 90% 이상 정확히, [행동] 추론하여 판별할 수 있다.","mager_writing":"[조건] 4~6문단 설명문과 추론 과제가 주어졌을 때, [준거] (1) 거시 지시어가 지시하는 선행 문단 내용을 명시적 문장으로 복원하고, (2) 본문 단서와 배경지식을 결합하여 생략된 중간 인과 고리 및 파생 결과를 3문장 이상으로, [행동] 논리적 추론문으로 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V2-2 ➔ G5-EXP-V2-2 ➔ G6-EXP-V2-2","horizontal_link":"[공통기초 결합] A4(생략 성분 복원·거시 지시어 역추적), A5(생략된 매개 인과·숨은 전제 추론) | ➔ [쓰기 W3·W5 전이] 생략된 맥락·인과·전제 추론 원리를 통해 내 글의 논리적 비약이나 사건 빈틈을 메우며 조직·퇴고"},{"code":"G5-EXP-V2-3","grade":"5학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-3 인물 심리·화자 정서·시각자료·독자반응 추론","sub_skill_name":"텍스트와 시각 매체 자료 간 통합 추론","curriculum_basis":"`[6국02-03]`(사진, 도표 등 다양한 매체 자료를 활용하며 글을 읽는다), `CCSS RI.5.7`(다중 인쇄·디지털 시각 자료로부터 정보를 통합하여 문제 해결 및 질문 답하기), `PIRLS & PISA`(비연속 텍스트와 연속 텍스트의 통합 추론).","dc_step1":"4~6문단 설명문 본문의 원리·개념 설명과 함께 제시된 2개 이상의 시각 자료(예: 원그래프+꺾은선그래프, 구조 다이어그램+통계표)의 핵심 변인을 추출한다.","dc_step2":"본문 텍스트의 일반 원리, 첫 번째 도표의 비율 데이터, 두 번째 도표의 추세 데이터를 삼각 연결(Triangulation)하여 두 변인 간의 상관관계를 도출한다.","dc_step3":"텍스트나 단일 도표만으로는 알 수 없는 통합적 경향성과 새로운 적용 사례를 추론한다.","mager_reading":"[조건] 본문 텍스트와 2종 이상의 시각 자료(통계 도표·다이어그램)가 결합된 4~6문단 설명문이 주어졌을 때, [준거] 본문 원리와 다중 도표 데이터를 교차 결합하여 두 변인 간의 상관관계·경향성 및 실제 적용 사례를 90% 이상 정확히, [행동] 추론하여 판별할 수 있다.","mager_writing":"[조건] 본문과 다중 도표가 포함된 설명문이 주어졌을 때, [준거] [본문 설명 원리] + [도표 A·B의 데이터 추세] ➔ [통합 추론 결론]의 근거를 명시하여 3문장 이상의 통합 해석문을, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V2-3 ➔ G5-EXP-V2-3 ➔ G6-EXP-V2-3","horizontal_link":"[공통기초 결합] A2(감정·태도 어휘), A5(상황-반응 내적 인과 연결) | ➔ [쓰기 W1·W4 전이] 화자/인물 심리·시각자료·예상 독자 반응 추론을 바탕으로 독자 맞춤형 표현·시각자료·반론 대응 구사"},{"code":"G5-EXP-V2-4","grade":"5학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-4 작가(필자) 의도·관점·시점·맥락 추론","sub_skill_name":"필자의 집필 목적·예상 독자·관점 추론","curriculum_basis":"`[6국02-04]`(글쓴이의 관점이나 의도를 파악하며 읽는다), `CCSS RI.5.6`(동일 사건·주제를 다룬 여러 글에서 필자의 관점과 강조점의 유사점·차이점 분석).","dc_step1":"4~6문단 설명문에서 전문 어휘의 뜻풀이 수준, 선택된 예시 소재, 채택된 텍스트 구조(예: 인과 vs 문제·해결), 그리고 필자가 비중 있게 다룬 측면을 포착한다.","dc_step2":"포착한 텍스트 단서들을 결합하여 (1) 필자의 구체적 집필 목적, (2) 예상 독자의 연령대·사전 배경지식 수준, (3) 대상을 바라보는 필자의 시각(예: 기술 발전의 효율성 주목 vs 생태적 보존 가치 주목)을 연결한다.","dc_step3":"표면적으로는 객관적인 설명문이라도 어떤 정보를 선택·강조했는지에 따라 필자의 관점과 의도가 내재되어 있음을 추론한다.","mager_reading":"[조건] 4~6문단의 설명문이 주어졌을 때, [준거] 어휘 수준·예시 소재·설명 구조·정보 선택 비중을 단서로 필자의 집필 의도, 예상 독자의 지식 수준, 설명에 내재된 관점을 90% 이상 정확히, [행동] 추론하여 판별할 수 있다.","mager_writing":"[조건] 4~6문단 설명문이 주어졌을 때, [준거] 본문의 구체적 단서(어휘·예시·강조 문단) 2가지 이상을 근거로 들어 필자의 집필 의도, 예상 독자 수준, 대상을 바라보는 관점을 3문장으로, [행동] 분석해 서술할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V2-4 ➔ G5-EXP-V2-4 ➔ G6-EXP-V2-4","horizontal_link":"[공통기초 결합] A6(전체 주제 의식 도출), A2(어조·어감 분석) | ➔ [쓰기 W1 직결] 필자의 집필 의도·관점·맥락 추론을 역적용하여 내 글의 집필 목적·서술 시점·관점 수립"},{"code":"G5-EXP-V3-1","grade":"5학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-1 표현·서술 방식 및 근거·시각자료 적절성 평가","sub_skill_name":"설명 방법·표현 및 시각 자료의 적절성 평가","curriculum_basis":"`[6국02-01]`(설명 방법의 적절성 판단), `[6국02-03]`(매체 자료의 효과와 적절성 평가), `CCSS RI.5.5 & RI.5.7`.","dc_step1":"4~6문단 설명문에서 각 문단의 설명 대상 특성(예: 종류 구분, 구성 요소, 두 대상의 차이, 작동 과정)과 실제로 사용된 설명 방법(정의·예시·비교·대조·분류·분석), 어휘·어조, 시각 자료를 포착한다.","dc_step2":"(1) 대상 특성과 설명 방법의 정합성(예: 분류 기준이 일관적인지, 비교 기준이 명확한지), (2) 어휘·어조의 명료성(모호한 지시어·과장된 수식어 배제 여부), (3) 시각 자료(원그래프·비교표 등)의 단위·범례·본문 일치성을 준거로 점검한다.","dc_step3":"부적절하게 쓰인 설명 방법·표현·시각 자료를 비판적으로 평가하고 구체적인 수정 대안을 산출한다.","mager_reading":"[조건] 4~6문단 설명문과 시각 자료가 주어졌을 때, [준거] (1) 설명 방법(분류 기준 일관성, 비교 준거 명확성 등)의 적절성, (2) 모호하거나 과장된 표현 유무, (3) 도표의 유형·단위·본문 정합성을 기준으로 90% 이상 정확히, [행동] 평가하여 문제점을 식별할 수 있다.","mager_writing":"[조건] 분류 기준 혼란, 모호한 표현, 또는 부적절한 도표가 포함된 4~6문단 설명문이 주어졌을 때, [준거] 평가 준거(설명 방법/표현 명료성/시각 자료 정합성)를 명시하여 문제점을 분석하고, 독자 이해를 돕는 수정 문장 및 대체 시각 자료 대안을 3문장 이상으로, [행동] 구체적으로 제시할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V3-1 ➔ G5-EXP-V3-1 ➔ G6-EXP-V3-1","horizontal_link":"[공통기초 결합] A1·A2(어휘·비유·표현 효과 비교), A3(문장 명료성) | ➔ [쓰기 W4·W5 직결] 좋은 표현·시각자료·근거 적절성 평가 준거를 내 초고 집필 및 표현 퇴고 루브릭으로 적용"},{"code":"G5-EXP-V3-2","grade":"5학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-2 작품 공감·인물선택·내용 정확성·논리 타당성 평가","sub_skill_name":"정보의 정확성·객관성·출처 신뢰성 및 관점 공정성 평가","curriculum_basis":"`[6국02-04]`(글쓴이의 관점 파악 및 공정성 점검), `[6국05-01]`(매체 자료의 신뢰성 평가), `CCSS RI.5.8`, 영국 NC Year 5-6(비문학 텍스트에서 사실과 의견·편견 구별).","dc_step1":"4~6문단 설명문에서 (1) 인용된 수치·사실의 출처 기관 및 발행 연도, (2) 서술에 쓰인 형용사·부사·어조(객관적·중립적 어조 vs 감정적·편향적 어조), (3) 대상의 장단점이나 여러 측면 중 한쪽만 다룬 편향 여부를 포착한다.","dc_step2":"**정보의 정확성·최신성**, **출처의 공신력(전문성·권위)**, **서술의 객관성(주관적 편견·감정 배제)**, **관점의 공정성(균형 잡힌 정보 제시)** 4대 준거에 비추어 텍스트를 검증한다.","dc_step3":"설명 텍스트의 신뢰성과 객관성·공정성을 종합 평가한다.","mager_reading":"[조건] 4~6문단의 설명문 및 매체 정보글이 주어졌을 때, [준거] 정보의 정확성·최신성, 출처의 공신력, 서술의 객관성(감정·편견 배제), 관점의 공정성(편향 여부) 4가지 준거를 적용하여 신뢰성·객관성이 결여된 부분을 90% 이상 정확히, [행동] 비판적으로 판별할 수 있다.","mager_writing":"[조건] 출처 공신력 부족이나 주관적 편견·편향된 시각이 섞인 4~6문단 설명문이 주어졌을 때, [준거] 4대 평가 준거 중 해당 준거를 명시하여 문제 문장을 지적하고, 객관적이고 공정한 설명 문장으로, [행동] 교정하여 서술할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V3-2 ➔ G5-EXP-V3-2 ➔ G6-EXP-V3-2","horizontal_link":"[공통기초 결합] A5(근거-주장 논리적 타당성·인과 오류 점검) | ➔ [쓰기 W2·W5 직결] 인물의 선택·정보 객관성·논리 타당성 평가 준거를 내 글의 내용 타당성·공정성 자기점검 기준으로 적용"},{"code":"G5-EXP-V3-3","grade":"5학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-3 내 삶 연결·내면화 및 다매체 비교·팩트체크","sub_skill_name":"다중 설명 자료 교차 검증 및 지식 재구성","curriculum_basis":"`[6국02-05]`(동일한 화제를 다룬 여러 글을 비교하며 읽고 지식을 통합한다), `CCSS RI.5.9`(동일 주제에 관한 여러 텍스트의 정보를 통합하여 주제에 대해 지식을 가지고 쓰거나 말하기), Britt & Rouet(2012) 다중 문서 모형(Documents Model).","dc_step1":"동일 주제를 다룬 2~3종의 다중 매체 자료(인쇄 설명문, 통계 인포그래픽, 뉴스 보도문 등)에서 각 자료의 출처, 설명 구조, 핵심 정보, 세부 수치를 추출한다.","dc_step2":"자료 간 (1) 정보 깊이와 설명 측면의 차이, (2) 공통 사실과 상충(불일치) 정보의 존재 여부를 대조하고, 상충 시 출처 공신력·최신성(`V3-2`)을 기준으로 어느 정보가 타당한지 교차 검증(Corroboration)한다.","dc_step3":"검증된 다중 자료의 정보를 중복 없이 통합하여 새로운 설명 구조로 재구성한다.","mager_reading":"[조건] 동일 주제를 다룬 2~3종의 설명 자료(인쇄 글·도표·매체 자료)가 주어졌을 때, [준거] 자료 간 정보 깊이, 사실·수치 일치 여부, 상충 정보의 신뢰성을 90% 이상 정확히, [행동] 교차 검증하여 판별할 수 있다.","mager_writing":"[조건] 동일 주제를 다룬 2~3종의 다중 설명 자료가 주어졌을 때, [준거] 교차 검증을 통해 확인된 정확한 정보만을 선별·통합하여 [공통 핵심 정보 + 자료별 심화 보충 정보] 구조로 4문장 이상의 통합 설명문을, [행동] 재구성하여 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-V3-3 ➔ G5-EXP-V3-3 ➔ G6-EXP-V3-3","horizontal_link":"[공통기초 결합] A6(다중 텍스트 통합·재구성) | ➔ [쓰기 W1·W2 직결] 텍스트와 내 삶·다중 매체를 연결·검증한 성찰 결과를 내 글쓰기의 직접적 글감·주제로 채택"},{"code":"G5-EXP-W1","grade":"5학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W1 계획하기 (목적·독자·주제·갈래 설정)","sub_skill_name":"계획하기 (설명 목적·독자 분석·대상 및 주제 좁히기)","curriculum_basis":"`[6국03-01]`(목적과 독자를 고려하여 설명할 주제를 정하고 글쓰기를 계획한다), `CCSS W.5.2 & W.5.4`.","dc_step1":"사회·과학·문화 현상 중 설명할 대상을 선정하고, 예상 독자층의 연령·배경지식 수준·흥미도를 분석한다.","dc_step2":"독자 분석 결과에 맞추어 설명의 초점(개념·종류 소개 vs 작동 원리·과정 설명 vs 원인과 해결책 설명)과 어휘 수준을 결정한다.","dc_step3":"독자 분석, 설명 목적, 좁혀진 핵심 주제 및 가제목을 명세화한다.","mager_reading":"[조건] 서로 다른 독자 집단(예: 저학년 후배 vs 동학년 친구)을 대상으로 한 설명문 계획안들이 주어졌을 때, [준거] 독자의 사전 지식 수준에 맞게 설명 범위와 어휘 난이도가 계획되었는지를 90% 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 설명문 작문 계획 양식이 주어졌을 때, [준거] (1) 예상 독자의 사전 지식 및 관심사 분석, (2) 구체적 집필 목적, (3) 좁혀진 설명 주제와 가제목을 모두 포함하여, [행동] 체계적인 작문 계획서를 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-W1 ➔ G5-EXP-W1 ➔ G6-EXP-W1","horizontal_link":"[공통기초 결합] A6(주제 설정) + 읽기 V1-4/V2-4(작가 의도·목적)·V3-3(삶 연결 글감) 전이 | ⬅ [읽기 V2-4·V3-3 수용] 필자 의도 추론과 내 삶 연결 성찰에서 도출한 글감·주제·독자를 글쓰기 계획으로 확정"},{"code":"G5-EXP-W2","grade":"5학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W2 내용 생성하기 (글감·감각/비유·사실/근거 자료 수집)","sub_skill_name":"내용 생성하기 (다중 출처 자료 수집·정확성/신뢰성 검증·시각자료 기획)","curriculum_basis":"`[6국03-01]`, `[6국03-02]`(설명 대상에 알맞은 자료를 수집·선별하여 글쓰기 준비), `CCSS W.5.7 & W.5.8`(여러 출처를 활용한 조사, 정보 요약·재진술 및 출처 제시).","dc_step1":"도서, 전문 백과사전, 통계청/공공기관 누리집, 뉴스 등 2종 이상의 매체에서 정의·사례·통계 수치·전문가 설명 자료를 폭넓게 수집한다.","dc_step2":"수집한 자료들의 **정확성·최신성·출처 공신력·객관성**(`V3-2`)을 점검하여 편향되거나 출처 미상인 자료를 배제하고, 독자의 이해를 도울 보조 시각 자료(원그래프·비교표·과정도 등)를 매칭한다.","dc_step3":"검증된 텍스트 정보 카드(출처 포함)와 보조 시각 자료 기획안을 산출한다.","mager_reading":"[조건] 특정 설명 주제에 대해 수집된 5~6개의 후보 자료(공식 통계, 백과사전, 익명 블로그, 오래된 자료 등)가 주어졌을 때, [준거] 정확성·최신성·출처 공신력·주제 적합성을 기준으로 설명문에 사용할 우량 자료와 배제할 자료를 90% 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 설명 주제와 다중 매체 자료원이 주어졌을 때, [준거] 공신력 있는 출처 2곳 이상에서 핵심 사실·통계 자료를 수집하여 출처(기관명·연도)와 함께 요약 메모하고, 본문 설명을 보완할 맞춤형 시각 자료(표·그래프·그림) 1종 이상을 단위·제목과 함께, [행동] 기획하여 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-W2 ➔ G5-EXP-W2 ➔ G6-EXP-W2","horizontal_link":"[공통기초 결합] A1·A2(감각어·복합어·비유·관용어 생성) + 읽기 V1-1/V2-1/V3-1 전이 | ⬅ [읽기 V1-1·V2-1·V3-1 수용] 읽은 모델 텍스트의 소재·어휘·근거 기준을 활용하여 풍부한 글감과 자료 생성"},{"code":"G5-EXP-W3","grade":"5학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W3 내용 조직하기 (읽기 구조 미러링 개요·도해 설계)","sub_skill_name":"내용 조직하기 (6대 설명 구조 선택·처음-가운데-끝 개요·담화표지 배치)","curriculum_basis":"`[6국03-01]`(설명 대상의 특성에 알맞은 설명 방법을 사용하여 내용을 조직한다), `CCSS W.5.2a & W.5.2c`(논리적으로 아이디어를 묶어 조직하고 문장·문단·절 내부 및 상호 간을 잇는 어구·절 사용).","dc_step1":"가운데 본론의 하위 주제별로 가장 효과적인 설명 방법(**정의, 예시, 비교·대조, 분류, 분석, 과정, 인과**)을 매칭한다(`V1-3` 역전이).","dc_step2":"분류 구조 선택 시 ‘일관된 분류 기준’을, 비교·대조 선택 시 ‘명확한 비교 기준’을 설정하고, 문단 간·문단 내 담화표지(‘일정한 기준에 따라 나누면, ~와 달리, 왜냐하면~따라서’)를 배치한다.","dc_step3":"처음-가운데-끝 개요표에 문단별 중심문장, 적용할 설명 방법, 담화표지, 시각 자료 위치를 통합 설계한다.","mager_reading":"[조건] 다양한 설명 대상(예: 악기의 종류, 자전거의 구조, 두 제도의 차이, 온실효과 발생 과정)이 주어졌을 때, [준거] 각 대상의 특성에 가장 적합한 설명 방법 및 텍스트 구조(분류/분석/비교·대조/과정·인과)와 담화표지를 90% 이상 정확히, [행동] 매칭할 수 있다.","mager_writing":"[조건] 수집된 설명 자료와 시각 자료가 주어졌을 때, [준거] ‘처음-가운데(3~4문단)-끝’ 개요표에 (1) 문단별 중심 내용과 세부 내용, (2) 문단별 적용할 설명 방법(2가지 이상) 및 기준, (3) 문단 간 담화표지, (4) 시각 자료 배치 위치를 모두 명시하여, [행동] 체계적인 설명문 개요를 작성할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-W3 ➔ G5-EXP-W3 ➔ G6-EXP-W3","horizontal_link":"[공통기초 결합] A4(담화표지 배치)·A6(개요 위계) + 읽기 V1-2/V1-3(텍스트 구조 도해조직자 미러링) 전이 | ⬅ [읽기 V1-2·V1-3 수용] 읽기 단계의 텍스트 구조 도해조직자를 내 글의 문단·연·플롯 개요 틀로 전환하여 조직"},{"code":"G5-EXP-W4","grade":"5학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W4 초고 집필하기 (갈래별 핵심 표현 전략·문장화)","sub_skill_name":"집필하기 (중심-뒷받침 위계·학술 어휘 뜻풀이·객관적 어조·시각자료 통합 집필)","curriculum_basis":"`[6국03-01]`(대상의 특성에 알맞은 설명 방법을 사용하여 설명하는 글을 쓴다), `[6국03-02]`(적절한 자료를 활용하여 글을 쓴다), `CCSS W.5.2a-e`.","dc_step1":"개요서에 설계한 바에 따라 ‘처음’ 문단에서 설명 대상의 개념 정의와 글의 설명 방향을 명확히 제시한다.","dc_step2":"‘가운데’ 문단들에서 6대 설명 방법(정의·예시·비교·대조·분류·분석·인과)의 정형화된 담화표지를 구사하여 서술하고, 독자가 낯설어할 개념어는 앞뒤 문맥 단서(뜻풀이·예시)를 붙여 설명하며, 시각 자료를 본문 지시문(‘다음 그림/표를 보면~’)으로 연결한다.","dc_step3":"개인적 감정 표현을 배제한 설명적 어조로 ‘끝’ 문단 요약까지 4~5문단 설명문을 완성한다.","mager_reading":"[조건] 설명문 집필 문단 예시들이 주어졌을 때, [준거] 설명 방법 담화표지의 정확한 구사, 개념어 뜻풀이 유무, 객관적 어조 유지, 그리고 시각 자료 지시문의 유무를 90% 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 작성한 설명문 개요서와 보조 시각 자료가 주어졌을 때, [준거] (1) 처음-가운데-끝 4~5문단 구성을 갖출 것, (2) 정의·예시·비교·대조·분류·분석 중 2가지 이상의 설명 방법과 담화표지를 정확히 구사할 것, (3) 시각 자료를 본문 지시문으로 연동하고 출처를 밝힐 것, (4) 객관적 어조를 유지할 것의 4가지 준거를 모두 충족하여 완결된 설명문을, [행동] 집필할 수 있다.","vertical_link":"[학년 나선형] G4-EXP-W4 ➔ G5-EXP-W4 ➔ G6-EXP-W4","horizontal_link":"[공통기초 결합] A2·A3(문장 확장·장르별 표현 전략 구사) + 읽기 V1~V3 통합 전이 | ⬅ [읽기 전 과정 수용] 계획·생성·조직한 개요와 갈래별 핵심 표현 전략을 결합하여 완결된 초고 집필"},{"code":"G5-EXP-W5","grade":"5학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W5 고쳐쓰기 (내용·조직·표현[주술호응·교정부호] 3단계 퇴고)","sub_skill_name":"고쳐쓰기 (내용 정확성/객관성·조직 응집성·표현 주술/부사어 호응 `[6국04-05]` 3단계 교정부호 퇴고)","curriculum_basis":"`[6국03-01]`, `[6국03-05]`(쓴 글을 읽으며 내용, 조직, 표현을 점검하고 고쳐 쓴다), `[6국04-05]`(문장 성분의 호응 관계), `CCSS W.5.5`.","dc_step1":"작성한 4~5문단 설명문을 글 전체(내용·조직) ➔ 문단 ➔ 문장·낱말 순으로 읽으며, (1) 설명 방법 및 자료 출처의 적절성, (2) 문단 간 연결과 통일성, (3) 주어-서술어 및 부사어-서술어 호응 오류(`[6국04-05]`, 예: ‘결코 ~이다(X) ➔ 결코 ~아니다(O)’)를 포착한다.","dc_step2":"포착한 문제점들을 [내용-조직-표현] 3수준 점검 기준과 연결하여 수정 방향(삭제·추가·대체·재배열)을 결정한다.","dc_step3":"교정부호를 적용하여 초고를 수정하고 완결된 설명문을 산출한다.","mager_reading":"[조건] 설명 방법 오류, 문단 통일성 위배, 문장 성분 호응([6국04-05]) 오류가 포함된 4~5문단 설명문 초안이 주어졌을 때, [준거] [내용-조직-표현] 각 수준별 오류를 90% 이상 정확히, [행동] 진단하여 수정 방향을 판별할 수 있다.","mager_writing":"[조건] 자신이 작성한 설명문 초안(또는 수정용 원고)과 3수준 점검표가 주어졌을 때, [준거] 내용(설명 방법·출처·객관성), 조직(문단 통일성·담화표지), 표현(주술·부사어 호응 [6국04-05])의 오류 4곳 이상을 교정부호로 표시하고, [행동] 바르게 고쳐 쓸 수 있다.","vertical_link":"[학년 나선형] G4-EXP-W5 ➔ G5-EXP-W5 ➔ G6-EXP-W5","horizontal_link":"[공통기초 결합] A3(주술·목서·부사어·시제·높임 호응 및 문장부호 교정), A4(응집성 교정) | ⬅ [공통 A3·A4 및 읽기 V3-1·V3-2 수용] 내용·조직·표현(주술/부사어 호응, 시제, 맞춤법, 교정부호) 3단계 메타인지 퇴고"},{"code":"G6-EXP-V1-1","grade":"6학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-1 내용 확인 (명시적 정보·대상·사실 식별)","sub_skill_name":"내용 확인 (대상과 특징·세부 정보 식별)","curriculum_basis":"`[6국02-02]`(글의 구조를 고려하며 세부 정보와 핵심 내용을 파악한다), `CCSS RI.6.1`(텍스트에 명시적으로 기술된 바를 분석하기 위해 텍스트 근거를 정확히 인용하기), `PISA Reading`(복합 텍스트 및 비연속 텍스트 내 다중 조건 정보 탐색·추출).","dc_step1":"5~8문단 이상의 복합 설명문·보고서에서 핵심 학술 개념의 정의, 하위 범주별 세부 속성, 통계 수치, 실험/조사 조건 및 복합 인포그래픽(다중 축 그래프·계통도·다이어그램)의 범례·단위·주석을 정밀 탐색한다.","dc_step2":"본문의 명시적 진술(조건절·한정어 ‘약, 평균, ~에 한하여’ 포함)과 시각 자료의 세부 데이터 값을 교차 대조하여 정보의 정확한 범위를 확정한다.","dc_step3":"다중 조건이 결합된 질문에 대해 본문 텍스트와 복합 도표에서 명시적 근거를 정확히 추출하여 구조화된 정보 표로 산출한다.","mager_reading":"[조건] 전문 개념어와 복합 통계 도표·인포그래픽이 결합된 6~8문단 이상의 설명문(또는 조사 보고서)이 주어졌을 때, [준거] 핵심 개념의 정의, 한정 표현(‘대부분/일부/평균’)이 포함된 세부 사실, 그리고 도표의 다중 조건 수치 데이터를 100% 정확하게, [행동] 찾아내어 미세한 사실 왜곡 진술을 변별할 수 있다.","mager_writing":"[조건] 복합 설명문과 인포그래픽 자료가 주어졌을 때, [준거] 핵심 개념의 정의, 하위 영역별 세부 수치·사례, 시각 자료의 핵심 데이터를 출처·단위와 함께 4개 항목 이상의 표 또는 요약문으로, [행동] 객관적이고 정확한 문장으로 재정리하여 산출할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V1-1 ➔ G6-EXP-V1-1 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A1(해독·어휘·형태소), A2(감각어·기초어휘) | ➔ [쓰기 W2 전이] 읽기에서 포착한 장르별 필수 요소(대상/인물/경험/개념/주장·근거)를 내 글의 내용 생성 항목으로 전환"},{"code":"G6-EXP-V1-2","grade":"6학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-2 관계 확인 (지시·인과·문장골격·비유·중심세부 관계)","sub_skill_name":"관계 확인 (문단 내 중심-세부, 어휘 위계, 문장 골격, 지시·인과 관계)","curriculum_basis":"`[6국02-02]`(문단과 글의 논리적 층위 구조 파악), `[6국04-02]`(어휘의 체계와 의미 관계 심화), `[6국04-05]`(문장 성분 간 호응과 겹문장 구조 이해), `CCSS RI.6.3 & RI.6.5`(특정 문장·문단이 텍스트 전체 구조 및 개념 발달에 기여하는 방식 분석), Kintsch 텍스트기반 명제 위계화 이론.","dc_step1":"6~8문단 복합 설명문에서 긴 겹문장(안은문장·이어진문장)의 중심 주어-목적어-서술어 골격(`[6국04-05]`)을 포착하고, 정의·예시·상술·인용·비교·인과 표지를 식별한다.","dc_step2":"각 문단 내 문장들의 다층적 위계(중심명제 ➔ 하위 설명명제 ➔ 세부 실증명제)와 전문 어휘들의 개념 체계(상하위·동위·전체-부분·반의 관계 `[6국04-02]`), 그리고 문단 간 다중 인과(원인1·2 ➔ 매개 과정 ➔ 결과1·2) 관계를 정밀하게 연결한다.","dc_step3":"불필요한 수식절을 걷어낸 문장 골격과 개념 위계, 문단 층위를 통합하여 글 전체의 미시-거시 명제 관계도를 완성한다.","mager_reading":"[조건] 복합 문장과 다층적 설명 방법이 사용된 6~8문단 이상의 심화 설명문이 주어졌을 때, [준거] (1) 핵심 문장의 주·목·서 필수 성분 골격, (2) 중심문장과 세부문장(정의·예시·상술·인용·비교)의 다층 관계, (3) 학술 어휘의 상하위·동위·전체-부분 위계 및 문단 간 인과·순서 관계를 모두 90% 이상의 정확도로, [행동] 분석·식별할 수 있다.","mager_writing":"[조건] 복합 설명문 원문이 주어졌을 때, [준거] 각 문단의 중심문장을 필수 문장 성분(주·목·서) 골격으로 정련하고 하위 세부문장들의 기능(정의/예시/상술/인용/인과)과 어휘 개념 위계(상하위/전체-부분)를 명시하여, [행동] 3단계 다층 개요표(Multi-level Outline)로 재구성해 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V1-2 ➔ G6-EXP-V1-2 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A1(상하위·단어관계), A3(문장골격 주·목·서), A4(지시어·접속어), A5(명시적 인과) | ➔ [쓰기 W3·W4 전이] 텍스트 내 관계(비유/인과/경험-감상/중심-뒷받침/주장-근거) 원리를 내 문단 연결 및 문장 구성에 적용"},{"code":"G6-EXP-V1-3","grade":"6학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-3 구조 확인 (갈래별 미시·거시 텍스트 구조 도해)","sub_skill_name":"구조 확인 (설명 방법 및 거시적 텍스트 구조 도해)","curriculum_basis":"`[6국02-02]`(글의 구조를 고려하며 내용을 파악하고 요약한다), `CCSS RI.6.5`(특정 문장, 문단, 장, 절이 전체 텍스트 구조에 어떻게 들어맞고 아이디어의 발달에 어떻게 기여하는지 분석하기), Meyer(1985) 복합 상위구조(Complex Superstructure) 이론.","dc_step1":"6~8문단 이상의 복합 설명문·보고서에서 상위 거시 구조(예: 글 전체는 ‘문제·해결’ 또는 ‘인과’ 구조)의 표지와 하위 문단별 미시 구조(예: 2문단은 ‘분류+분석’, 3문단은 ‘인과+과정’, 4문단은 ‘비교·대조’)의 담화표지를 이중으로 포착한다.","dc_step2":"하위 문단들의 개별 설명 구조(분류·분석·비교대조·과정·인과)가 글 전체의 상위 구조(예: 현상 정의 ➔ 원인 분석 ➔ 문제점 및 해결 방안 제시) 속에서 어떤 논리적 역할을 수행하는지 위계적으로 연결한다.","dc_step3":"단일 도해 틀을 넘어 상위 구조와 하위 문단 구조가 결합된 **복합 도해조직자(Composite Graphic Organizer)**를 설계하여 글 전체의 정보 아키텍처를 도해한다.","mager_reading":"[조건] 2가지 이상의 설명 구조가 중첩된 6~8문단 이상의 복합 설명문이 주어졌을 때, [준거] 담화표지를 단서로 글 전체의 상위 거시 구조와 문단별 하위 설명 구조(6대 설명 구조: **분류, 분석, 비교·대조, 순서[과정], 인과, 문제·해결** 및 열거)를 90% 이상 정확히, [행동] 판별하고 각 문단이 전체 구조에서 수행하는 기능을 설명할 수 있다.","mager_writing":"[조건] 복합 구조로 쓰인 6~8문단 이상의 설명문이 주어졌을 때, [준거] 글 전체의 상위 구조(처음-가운데-끝 및 거시 틀)와 문단별 하위 설명 구조(분류 기준, 분석 요소, 비교 기준, 인과·과정 화살표, 문제-해결책)가 동시에 드러나도록, [행동] 복합 구조 도해조직자(Composite Graphic Organizer)를 직접 그려 텍스트 정보를 완벽히 도해할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V1-3 ➔ G6-EXP-V1-3 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A4(담화 전환 표지), A5(선후·인과·구조), A6(문단 짜임) | ➔ [쓰기 W3 직결] 읽기에서 완성한 \'갈래별 구조 도해조직자\'를 내 글의 \'개요 설계 틀(Graphic Organizer)\'로 1:1 미러링"},{"code":"G6-EXP-V1-4","grade":"6학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-4 요약 및 주제 확인 (핵심 골격 간추리기·주제·제목)","sub_skill_name":"요약 및 주제 확인 (중심 내용 간추리기 & 제목 붙이기)","curriculum_basis":"`[6국02-02]`(글의 구조를 고려하며 내용을 요약한다), `[6국04-05]`(문장 성분의 호응), `CCSS RI.6.2`(텍스트의 중심 생각을 결정하고 개인적 의견이나 판단과 무관하게 텍스트를 객관적으로 요약하기), Kintsch 거시구조 표상 이론.","dc_step1":"6~8문단 복합 설명문에서 모든 문단의 잉여 수식어·예시·부연·중복 진술을 제거하고, 핵심 문장의 필수 문장 성분 골격(주어-목적어-서술어 `[6국04-05]`)과 핵심 학술 개념어를 추출한다.","dc_step2":"추출한 문단별 거시명제들을 6대 설명 구조의 담화표지(‘첫째~둘째, ~와 달리, ~원인으로 인해 ~결과가 나타나며, 이를 해결하기 위해’)로 정교하게 통합하되, 독자의 주관적 의견·감상을 철저히 배제한다.","dc_step3":"글 전체의 복합 구조와 핵심 주제를 압축한 객관적 요약문(Abstract 수준)을 완성하고, 글 전체를 포괄하는 **`[핵심 대상] + [핵심 설명 측면 A·B]`** 형식의 본제목과 문단군별 소제목을 산출한다.","mager_reading":"[조건] 6~8문단 이상의 복합 구조 설명문이 주어졌을 때, [준거] 주관적 평가나 지엽적 세부사항이 섞인 요약문을 배제하고, 필수 문장 성분 골격과 복합 텍스트 구조 표지가 결합된 객관적 요약문 및 [핵심 대상]+[설명 측면]을 포괄하는 제목을 100% 정확히, [행동] 식별할 수 있다.","mager_writing":"[조건] 6~8문단 이상의 복합 설명문이 주어졌을 때, [준거] (1) 불필요한 수식어·예시를 삭제하고 주·목·서 문장 골격을 유지할 것, (2) 글의 복합 설명 구조 표지를 사용할 것, (3) 주관적 의견을 배제할 것의 3가지 준거를 모두 충족하여 4~5문장의 요약문과 [핵심 대상]+[설명 측면] 형식의 포괄적 제목(및 부분별 소제목)을, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V1-4 ➔ G6-EXP-V1-4 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A3(수식어 삭제·문장골격 추출), A6(중심-세부 위계 및 삭제·선택·일반화·구성 요약) | ➔ [쓰기 W1·W4 전이] 요약한 중심 명제와 제목 짓기 원리를 내 글의 핵심 주제문(Topic Sentence) 및 제목 설정에 적용"},{"code":"G6-EXP-V2-1","grade":"6학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-1 어휘·비유·관용표현·형태소 문맥 추론","sub_skill_name":"학술 어휘·형태소 및 다의어 문맥 추론","curriculum_basis":"`[6국04-02]`(어휘의 짜임과 의미 관계), `[6국04-04]`(관용표현의 의미와 효과), `CCSS RI.6.4 & L.6.4a-d`(전문적·학술적·비유적 어휘의 문맥적 의미 결정 및 형태소·문맥 추론 결과의 사전적 검증), 호주 ACARA Y6(학술 명사화 및 형태소 지식 활용).","dc_step1":"6~8문단 이상의 심화 설명문에서 추상적 한자 학술 개념어(예: ‘항상성(恒常性)’, ‘생물다양성’, ‘양극화’, ‘비대칭적’), 전문 용어, 다의어 및 관용·비유적 설명 표현을 포착하고 형태소(한자 어근+접두사 ‘비/불/초/범’+접미사 ‘-화/-성/-적’)를 분해한다.","dc_step2":"형태소 결합 원리(`[6국04-02]`)로 도출한 1차 의미 가설을 문단 내·문단 간 논리적 문맥(상위 정의, 하위 예시, 반대 개념과의 대조, 인과적 결과)에 대입하여 정교화한다.","dc_step3":"학술 어휘의 문맥적 정의를 정확히 산출하고, 일상적 의미로 쓰인 다의어와 학술 전문어로 쓰인 의미를 엄밀히 변별한다.","mager_reading":"[조건] 고난도 한자 학술어(합성어·파생어), 다의어, 관용표현이 포함된 6~8문단 이상의 복합 설명문이 주어졌을 때, [준거] 어근·접사 형태소 분석([6국04-02])과 앞뒤 정의·대조·예시 문맥 단서를 결합하여 학술 개념어의 의미와 다의어의 문맥적 의미를 90% 이상의 정확도로, [행동] 추론하고 다른 문맥에서의 쓰임과 변별할 수 있다.","mager_writing":"[조건] 본문 속 미지의 한자 학술 개념어 2개와 다의어/관용표현 1개가 주어졌을 때, [준거] 형태소 분석 근거와 본문 문맥 단서를 명시하여 사전적 뜻풀이 수준으로 정교하게 개념 정의문을 작성하고, 해당 학술어를 사용하여 새로운 설명 예문을, [행동] 문법·의미적 오류 없이 산출할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V2-1 ➔ G6-EXP-V2-1 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A1(합성어·파생어 어근·접사 분석), A2(다의어·동형어·속담·관용표현 문맥 추론) | ➔ [쓰기 W2·W4 전이] 문맥으로 추론한 비유·다의어·관용표현·학술어를 내 글의 생생하고 설득력 있는 표현 재료로 활용"},{"code":"G6-EXP-V2-2","grade":"6학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-2 생략된 상황·인과·숨은 전제·거시지시어 추론","sub_skill_name":"문단 간 응집성(거시 지시어) 및 생략된 인과·과정 추론","curriculum_basis":"`[6국02-02]`, `CCSS RI.6.1 & RI.6.3`(텍스트에서 추론한 바를 뒷받침하기 위해 명시적 근거를 인용하고 사건·개념 간 심층 상호작용 분석), Kintsch(1998) 상황모형(Situation Model) 기반 교량·정교화 추론.","dc_step1":"6~8문단 이상의 복합 설명문에서 문단 군(Paragraph cluster)을 가로지르는 추상 명사구 지시어(‘이러한 메커니즘은, 이 연쇄 작용은, 앞서 살펴본 구조적 한계는’)와 텍스트 표면에서 압축·생략된 인과 전제들을 포착한다.","dc_step2":"추상 명사구 지시어가 압축하는 다문단 선행 명제들을 역추적하여 복원하고, 독자의 과학·사회·생태학적 배경지식(스키마)을 결합하여 `[선행 원인 ➔ 텍스트에 생략된 중간 매개 원리/메커니즘 ➔ 후속 결과 ➔ 장기적 파생 영향]`의 사슬을 구축한다.","dc_step3":"구축한 상황모형을 바탕으로 새로운 상황·변인이 투입되었을 때 일어날 연쇄적 결과를 타당하게 추론·예측한다.","mager_reading":"[조건] 6~8문단 이상의 복합 인과·과정·문제해결 구조 설명문이 주어졌을 때, [준거] 문단 간 응집 지시어(‘이러한 현상, 이 과정’)가 압축하는 선행 문단 사태 전체를 정확히 역추적하고, 텍스트에 생략된 중간 매개 원리·인과 고리 및 변인 변화에 따른 파생 결과를 90% 이상의 정확도로, [행동] 본문 근거와 결합하여 추론할 수 있다.","mager_writing":"[조건] 복합 설명문과 ‘조건 변화/생략 원리 추론’ 과제가 주어졌을 때, [준거] 거시 지시어의 압축 내용을 복원하고 [본문 명시 단서] + [과학·사회적 배경지식] ➔ [생략된 매개 원리 및 파생 결과]의 논리적 인과 사슬을 4문장 이상의 완결된 설명문으로, [행동] 정교하게 서술할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V2-2 ➔ G6-EXP-V2-2 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A4(생략 성분 복원·거시 지시어 역추적), A5(생략된 매개 인과·숨은 전제 추론) | ➔ [쓰기 W3·W5 전이] 생략된 맥락·인과·전제 추론 원리를 통해 내 글의 논리적 비약이나 사건 빈틈을 메우며 조직·퇴고"},{"code":"G6-EXP-V2-3","grade":"6학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-3 인물 심리·화자 정서·시각자료·독자반응 추론","sub_skill_name":"텍스트와 시각 매체 자료 간 통합 추론","curriculum_basis":"`[6국02-03]`, `[6국05-01]`(매체 자료의 특성을 고려하여 정보 해석), `CCSS RI.6.7`(주제나 이슈에 대한 일관된 이해를 발달시키기 위해 다양한 매체·형식[시각적·양적 자료]과 텍스트로 제시된 정보를 통합하기), Schnotz(2005) 텍스트-그림 통합 이해 모형(ITPC).","dc_step1":"6~8문단 이상의 심화 설명문 본문과 복합 인포그래픽(다중 축 통계 그래프, 공간 분포 지도, 과학 메커니즘 순서도, 계통 분류도가 결합된 매체 자료)에서 각 양식이 제공하는 고유 정보 단서를 추출한다.","dc_step2":"본문 텍스트의 추상적 학술 원리를 복합 인포그래픽의 구체적 데이터·구조에 투사(Mapping)하고, 반대로 인포그래픽의 수치 변곡점·예외 구간을 본문 이론으로 역해석하여 양자 간 상호보완 관계를 구축한다.","dc_step3":"본문과 복합 시각 매체를 교차 결합하여 텍스트에 명시되지 않은 심층 경향성, 작동 원리, 예외 현상의 원인 및 새로운 실생활 적용 사례를 추론·산출한다.","mager_reading":"[조건] 복합 인포그래픽·다중 통계 도표가 결합된 6~8문단 이상의 설명문(또는 보고서)이 주어졌을 때, [준거] 본문 텍스트 정보와 다중 시각 자료의 변인·수치·구조를 교차 결합하여 명시되지 않은 경향성, 작동 원리 및 새로운 상황 적용 사례를 90% 이상의 정확도로, [행동] 통합 추론할 수 있다.","mager_writing":"[조건] 복합 설명문과 인포그래픽 자료가 주어졌을 때, [준거] 본문의 이론적 명제와 인포그래픽의 세부 수치·구조적 단서를 모두 인용하여, 명시되지 않은 심층 경향성과 실생활 적용 사례를 도출하는 4문장 이상의 분석 보고문을, [행동] 논리적으로 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V2-3 ➔ G6-EXP-V2-3 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A2(감정·태도 어휘), A5(상황-반응 내적 인과 연결) | ➔ [쓰기 W1·W4 전이] 화자/인물 심리·시각자료·예상 독자 반응 추론을 바탕으로 독자 맞춤형 표현·시각자료·반론 대응 구사"},{"code":"G6-EXP-V2-4","grade":"6학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-4 작가(필자) 의도·관점·시점·맥락 추론","sub_skill_name":"필자의 집필 목적·예상 독자·관점 추론","curriculum_basis":"`[6국02-04]`, `CCSS RI.6.6`(텍스트에서 필자의 관점이나 목적을 결정하고 그것이 텍스트에서 어떻게 전달되는지 설명하기), `PISA Reading`(텍스트의 숨겨진 의도·관점 및 수사적 맥락 추론).","dc_step1":"6~8문단 이상의 심화 설명문·보고서에서 학술 용어 정의 방식, 비유·예시의 성격, 채택된 6대 설명 구조, 시각 자료의 배치, 그리고 선택된 정보와 배제된 정보의 대비를 정밀 포착한다.","dc_step2":"텍스트의 언어적·구조적 단서들을 수사적 맥락(필자의 전문 분야·집필 목적, 예상 독자층의 지적 수준과 정보 요구, 사회적·학술적 맥락)과 다각도로 연결한다.","dc_step3":"필자의 명시적 정보 전달 목적 이면의 심층 의도, 예상 독자 프로파일, 그리고 설명 대상에 대해 내재된 관점(시각/프레임)을 객관적 텍스트 근거로 추론한다.","mager_reading":"[조건] 6~8문단 이상의 복합 설명문(또는 동일 대상을 다룬 서로 다른 설명문)이 주어졌을 때, [준거] 사용된 어휘 수준, 예시 소재, 설명 구조와 강조점을 단서로 필자의 집필 의도, 예상 독자층의 지적 수준, 그리고 설명에 내재된 관점을 90% 이상의 정확도로, [행동] 추론하여 분석할 수 있다.","mager_writing":"[조건] 복합 설명문이 주어졌을 때, [준거] [어휘·예시 단서], [설명 구조·강조점 단서]를 각각 본문에서 인용하여 (1) 필자의 집필 의도, (2) 예상 독자층의 특성 및 지식 수준, (3) 설명에 내재된 관점을 밝히는 4문장 이상의 분석문을, [행동] 논리적으로 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V2-4 ➔ G6-EXP-V2-4 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A6(전체 주제 의식 도출), A2(어조·어감 분석) | ➔ [쓰기 W1 직결] 필자의 집필 의도·관점·맥락 추론을 역적용하여 내 글의 집필 목적·서술 시점·관점 수립"},{"code":"G6-EXP-V3-1","grade":"6학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-1 표현·서술 방식 및 근거·시각자료 적절성 평가","sub_skill_name":"설명 방법·표현 및 시각 자료의 적절성 평가","curriculum_basis":"`[6국02-03]`(글에 사용된 다양한 매체 자료의 적절성과 효과를 평가하며 읽는다), `[6국05-02]`, `CCSS RI.6.5 & RI.6.7`, 영국 NC Year 5-6(비문학 텍스트의 구조·언어·프레젠테이션이 독자 이해에 미치는 효과 평가).","dc_step1":"6~8문단 이상의 복합 설명문·보고서에서 (1) 선택된 6대 설명 방법 및 거시 구조, (2) 예상 독자 대비 학술 어휘 난이도 및 서술 어조(모호성·과장성·다의적 혼동 여부), (3) 삽입된 시각 자료(도표의 눈금 왜곡, 단위·축·범례 누락, 본문 텍스트와의 수치/초점 불일치)를 정밀 점검한다.","dc_step2":"설명 대상의 본질적 특성과 예상 독자의 인지 수준을 기준으로, 현재의 설명 방법·언어 표현·시각 자료가 독자의 인지 부하를 줄이고 정확한 이해를 돕는지 다면적으로 대조·평가한다.","dc_step3":"설명 방법, 표현, 시각 자료 각각에 대한 평가 판단을 내리고, 독자 맞춤형 설명 방법 전환·문장 명료화·도표 재설계 대안을 산출한다.","mager_reading":"[조건] 6~8문단 이상의 복합 설명문과 시각 자료가 주어졌을 때, [준거] 대상의 특성과 독자 수준에 비추어 (1) 선택된 설명 방법(정의·예시·비교·분류·분석·인과)의 적절성, (2) 모호하거나 과장된 표현 배제 여부, (3) 시각 자료(단위·축 눈금·본문 정합성)의 적절성을 90% 이상의 정확도로, [행동] 비판적으로 평가할 수 있다.","mager_writing":"[조건] 설명 방법·표현·시각 자료 상의 결함이 포함된 복합 설명문이 주어졌을 때, [준거] [평가 준거 명시] ➔ [본문 및 시각 자료의 문제점 지적] ➔ [구체적 수정 대안(대체 설명 방법 적용 문장 및 도표 수정안)]의 3요소를 모두 갖추어 4문장 이상의 평가 및 대안 제시문을, [행동] 논리적으로 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V3-1 ➔ G6-EXP-V3-1 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A1·A2(어휘·비유·표현 효과 비교), A3(문장 명료성) | ➔ [쓰기 W4·W5 직결] 좋은 표현·시각자료·근거 적절성 평가 준거를 내 초고 집필 및 표현 퇴고 루브릭으로 적용"},{"code":"G6-EXP-V3-2","grade":"6학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-2 작품 공감·인물선택·내용 정확성·논리 타당성 평가","sub_skill_name":"정보의 정확성·객관성·출처 신뢰성 및 관점 공정성 평가","curriculum_basis":"`[6국02-04]`, `[6국02-05]`(매체 자료의 신뢰성과 타당성 평가), `[6국05-02]`, `CCSS RI.6.6 & RI.6.8`, `PISA Reading`(텍스트의 질과 신뢰성 평가: 출처 권위, 이해관계, 객관성·공정성 검증).","dc_step1":"6~8문단 이상의 설명문·보고서 및 디지털 정보 매체에서 (1) 사실·통계의 교차 확인 가능성 및 최신성, (2) 출처의 공신력(공인 연구기관·학술지·정부 통계 vs 상업적 이해관계 집단·익명 블로그), (3) 가치 판단 어휘·과장 수식어·단정적 표현 유무, (4) 특정 입장에 유리한 정보만 선별(Cherry-picking)하고 반대 측면 정보를 누락했는지 여부를 정밀 탐지한다.","dc_step2":"탐지한 단서들을 설명문 고유 평가 척도(**정확성·최신성 / 출처 공신력 / 서술 객관성 / 관점 공정성**)에 매핑하여 정보의 왜곡·편향 메커니즘을 분석한다.","dc_step3":"텍스트와 매체 자료의 신뢰도 등급을 판정하고 객관성·공정성 확보를 위한 비판적 평가문을 산출한다.","mager_reading":"[조건] 6~8문단 이상의 설명 텍스트와 매체 자료가 주어졌을 때, [준거] (1) 정보의 정확성·최신성, (2) 출처의 공신력(전문성·이해관계 유무), (3) 서술의 객관성(주관적 편견·감정 배제 여부), (4) 대상에 대한 관점의 공정성(균형성·누락 여부) 4대 준거를 모두 적용하여 90% 이상의 정확도로, [행동] 텍스트와 매체 자료를 비판적으로 평가할 수 있다.","mager_writing":"[조건] 미묘한 편향성, 이해관계가 얽힌 출처, 또는 감정적 수식어가 포함된 복합 설명 자료가 주어졌을 때, [준거] 정확성·최신성·출처 공신력·서술 객관성·관점 공정성의 4대 준거에 따라 본문 근거를 들어 비판적 평가표를 작성하고, 편향된 문단을 객관적·중립적 설명문으로, [행동] 재작성하여 산출할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V3-2 ➔ G6-EXP-V3-2 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A5(근거-주장 논리적 타당성·인과 오류 점검) | ➔ [쓰기 W2·W5 직결] 인물의 선택·정보 객관성·논리 타당성 평가 준거를 내 글의 내용 타당성·공정성 자기점검 기준으로 적용"},{"code":"G6-EXP-V3-3","grade":"6학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-3 내 삶 연결·내면화 및 다매체 비교·팩트체크","sub_skill_name":"다중 설명 자료 교차 검증 및 지식 재구성","curriculum_basis":"`[6국02-05]`, `[6국05-02]`, `CCSS RI.6.9`(한 필자의 사건·주제 제시 방식을 다른 필자의 제시 방식과 비교·대조하고 다중 자료 통합하기), `PISA Reading`(다중 출처 텍스트 교차 검증[Corroborating] 및 상충 정보 해결[Handling conflict]), Perfetti et al.(1999) 문서 간 통합 표상 이론.","dc_step1":"동일 주제를 다룬 3종 이상의 다중 매체 설명 자료(학술 설명문, 통계 인포그래픽, 영상/인터뷰 전사문, 백과사전 등)에서 각 자료의 출처 메타데이터(작성자·기관·연도·목적), 정보의 깊이(개괄 vs 심층 원리), 제시된 수치·사례를 추출한다.","dc_step2":"다중 자료 간 교차 검증 매트릭스를 가동하여 (1) 상호 일치하여 사실로 확정할 정보, (2) 상호 보완되어 통합할 정보, (3) 수치나 설명이 충돌(Conflict)하는 정보를 분류하고, 충돌 원인을 조사 시점·표본 범위·출처 공신력·관점 차이로 규명하여 해소한다.","dc_step3":"다중 매체 자료에서 교차 검증된 핵심 지식을 독자적인 거시 설명 구조(예: 개념 정의 ➔ 다각적 원인·현황 분석 ➔ 해결 및 전망)로 통합·재구성하여 새로운 완결된 지식 텍스트를 산출한다.","mager_reading":"[조건] 동일 주제를 다룬 3종 이상의 다중 매체 설명 자료(인쇄 설명문·인포그래픽·디지털 매체 자료)가 주어졌을 때, [준거] 각 자료의 정보 깊이, 수치·사실의 일치 여부, 상충 정보의 발생 원인 및 출처 신뢰성을 90% 이상의 정확도로, [행동] 교차 검증(Cross-check)하여 분석할 수 있다.","mager_writing":"[조건] 일부 수치 편차나 관점 차이가 포함된 3종의 다중 매체 설명 자료가 주어졌을 때, [준거] (1) 교차 검증 매트릭스를 통해 불일치·부정확 정보를 걸러낼 것, (2) 각 자료의 출처를 명시할 것, (3) 검증된 텍스트·시각 정보를 통합하여 처음-가운데-끝 구조를 갖춘 1편의 통합 요약 보고문(5문장 이상)으로, [행동] 지식을 재구성하여 산출할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-V3-3 ➔ G6-EXP-V3-3 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A6(다중 텍스트 통합·재구성) | ➔ [쓰기 W1·W2 직결] 텍스트와 내 삶·다중 매체를 연결·검증한 성찰 결과를 내 글쓰기의 직접적 글감·주제로 채택"},{"code":"G6-EXP-W1","grade":"6학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W1 계획하기 (목적·독자·주제·갈래 설정)","sub_skill_name":"계획하기 (설명 목적·독자 분석·대상 및 주제 좁히기)","curriculum_basis":"`[6국03-01]`, `[6국03-02]`(독자와 목적을 고려하여 복합 설명문·보고서 계획하기), `CCSS W.6.2 & W.6.4`(과제, 목적, 독자에게 적합한 작성 계획 수립), Flower & Hayes(1981) 수사적 문제 표상(Rhetorical Problem Representation) 이론.","dc_step1":"탐구·설명할 거시 화제를 선정하고, 예상 독자 프로파일(연령대, 해당 주제에 대한 사전 지식 수준, 오개념 유무, 알고 싶어 하는 핵심 질문)을 다각도로 분석한다.","dc_step2":"독자의 정보 요구와 필자의 설명 목적을 결합하여, 포괄적 화제(예: ‘인공지능’, ‘기후변화’)를 **`[상위 분야 ➔ 중위 대상 ➔ 구체적 설명 측면 2~3가지]`의 3단계 깔때기 기법(Funneling)**으로 정밀하게 좁힌다(예: ‘생성형 인공지능의 작동 원리와 저작권 문제 해결 방안’).","dc_step3":"독자 수준 분석, 설명 목적, 3단계로 좁혀진 주제, 그리고 `[핵심 대상]+[설명 측면]` 형식의 목표 제목을 포함한 정밀 작문 계획서를 산출한다.","mager_reading":"[조건] 여러 편의 설명문·보고서 작문 계획서가 주어졌을 때, [준거] (1) 예상 독자의 지식 수준 분석이 구체적인지, (2) 설명 목적이 객관적 정보 전달에 부합하는지, (3) 주제가 지나치게 광범위하지 않고 [핵심 대상]+[설명 측면]으로 정교하게 좁혀졌는지를 90% 이상의 정확도로, [행동] 평가·판별할 수 있다.","mager_writing":"[조건] 광범위한 탐구 화제와 설명문 작문 계획서 양식이 주어졌을 때, [준거] (1) 예상 독자 프로파일(사전 지식·정보 요구) 분석, (2) 구체적 설명 목적, (3) 3단계 깔때기 기법으로 좁힌 세부 주제 및 [핵심 대상]+[설명 측면] 형식의 가제목을 모두 갖추어, [행동] 완결된 작문 계획서를 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-W1 ➔ G6-EXP-W1 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A6(주제 설정) + 읽기 V1-4/V2-4(작가 의도·목적)·V3-3(삶 연결 글감) 전이 | ⬅ [읽기 V2-4·V3-3 수용] 필자 의도 추론과 내 삶 연결 성찰에서 도출한 글감·주제·독자를 글쓰기 계획으로 확정"},{"code":"G6-EXP-W2","grade":"6학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W2 내용 생성하기 (글감·감각/비유·사실/근거 자료 수집)","sub_skill_name":"내용 생성하기 (다중 출처 자료 수집·정확성/신뢰성 검증·시각자료 기획)","curriculum_basis":"`[6국03-02]`, `[6국05-02]`, `CCSS W.6.7, W.6.8 & W.6.9b`(다중 인쇄·디지털 출처를 활용한 단기 조사 수행, 출처 신뢰성 평가, 표절 없이 인용·재진술, 시각·양적 매체 기획), Flower & Hayes 내용 생성 및 다중양식 설계 이론.","dc_step1":"좁혀진 설명 주제에 맞추어 3종 이상의 다중 출처(학술/전문 도서, 공인 백과사전, 정부·연구기관 공식 통계 포털, 보도 자료 등)에서 개념 정의, 하위 범주별 사실, 시계열/비율 통계 데이터를 수집한다.","dc_step2":"수집된 자료들을 **`V3-2`(정확성·최신성·출처 공신력·객관성·공정성)** 및 **`V3-3`(다중 출처 간 수치·사실 교차 검증)** 기준으로 엄격히 필터링하여 상충·오류 정보를 제거하고, 원문을 그대로 베끼지 않고 자신의 말로 재진술(Paraphrasing) 메모한다.","dc_step3":"텍스트만으로는 전달하기 복잡한 수치 추세나 구조적 관계를 시각화하기 위해, 데이터의 성격에 최적화된 **보조 시각 자료(복합 그래프·비교 매트릭스·구조 다이어그램)**를 제목·축·단위·범례·출처까지完비하여 기획·제작한다.","mager_reading":"[조건] 복합 설명문 작성을 위해 수집된 다중 출처 자료와 시각 자료 기획안들이 주어졌을 때, [준거] (1) 다중 출처 교차 검증을 거친 정확하고 공신력 있는 정보인지, (2) 출처 표기가 정확한지, (3) 기획된 시각 자료가 데이터의 성격(추세/비율/구조)과 정합하며 단위·범례를 갖추었는지를 90% 이상의 정확도로, [행동] 평가·선별할 수 있다.","mager_writing":"[조건] 작문 계획서와 3종 이상의 다중 정보원이 주어졌을 때, [준거] (1) 교차 검증을 통과한 공신력 있는 자료 3건 이상을 출처(기관·연도·자료명)와 함께 자신의 말로 요약·메모할 것, (2) 본문의 핵심 데이터나 원리를 시각화한 보조 시각 자료(도표·다이어그램) 1~2개를 제목·단위·범례·출처를 갖추어 직접 제작(또는 상세 기획)할 것의 준거를 모두 충족하여, [행동] 내용 생성 포트폴리오를 산출할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-W2 ➔ G6-EXP-W2 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A1·A2(감각어·복합어·비유·관용어 생성) + 읽기 V1-1/V2-1/V3-1 전이 | ⬅ [읽기 V1-1·V2-1·V3-1 수용] 읽은 모델 텍스트의 소재·어휘·근거 기준을 활용하여 풍부한 글감과 자료 생성"},{"code":"G6-EXP-W3","grade":"6학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W3 내용 조직하기 (읽기 구조 미러링 개요·도해 설계)","sub_skill_name":"내용 조직하기 (6대 설명 구조 선택·처음-가운데-끝 개요·담화표지 배치)","curriculum_basis":"`[6국03-01]`, `[6국03-02]`, `CCSS W.6.2a & W.6.2c`(정의, 분류, 비교/대조, 원인/결과 등의 전략을 사용하여 아이디어를 조직하고 소제목·그래픽·멀티미디어를 포함하며 적절한 전환어구[Transitions]로 개념 간 관계 명료화하기), Meyer(1985) 상위구조 스키마 작문 전이.","dc_step1":"좁혀진 주제와 검증된 자료들의 논리적 성격을 분석하여, 글 전체를 관통하는 **상위 거시 구조**(6대 설명 구조: **분류, 분석, 비교·대조, 순서[과정], 인과, 문제·해결** 중 주된 틀)와 본론 각 문단의 **하위 설명 구조**를 복합적으로 선택한다.","dc_step2":"**‘처음(화제 도입·핵심 개념 정의·설명 범위 제시) - 가운데(소제목별 3~5문단: 중심명제+1·2차 뒷받침 세부명제+시각 자료 연동) - 끝(핵심 요약 및 전망)’**의 다층 개요를 구성하고, 문단 간 응집성을 높이는 거시 지시어(‘이러한 원리는, 앞서 살펴본 분류 기준에 따르면, 이와 같은 문제는’ `V2-2` 연계)와 구조별 담화표지를 정밀 배치한다.","dc_step3":"6대 설명 구조 도해조직자(`V1-3`)와 결합된 다층 개요표(소제목, 중심-뒷받침 문장 골격, 설명 구조, 담화표지, 시각 자료 삽입 지점 포함)를 완성한다.","mager_reading":"[조건] 복합 설명문 작성을 위한 개요 초안들이 주어졌을 때, [준거] (1) 6대 설명 구조가 대상의 특성에 맞게 선택·배열되었는지, (2) 처음-가운데-끝의 응집성과 소제목 구성이 논리적인지, (3) 문단 간 담화표지 및 거시 지시어가 적절히 배치되었는지를 90% 이상의 정확도로, [행동] 분석·판별할 수 있다.","mager_writing":"[조건] 검증된 다중 자료와 직접 기획한 시각 자료가 주어졌을 때, [준거] (1) 6대 설명 구조(분류·분석·비교대조·과정·인과·문제해결) 중 2종 이상을 결합한 ‘처음-가운데(소제목 포함 3~4문단)-끝’ 다층 개요, (2) 각 문단의 중심-뒷받침 위계, (3) 문단 간 응집 담화표지 및 거시 지시어, (4) 시각 자료 삽입 위치를 모두 명세하여, [행동] 완결된 복합 설명문 개요서를 작성할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-W3 ➔ G6-EXP-W3 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A4(담화표지 배치)·A6(개요 위계) + 읽기 V1-2/V1-3(텍스트 구조 도해조직자 미러링) 전이 | ⬅ [읽기 V1-2·V1-3 수용] 읽기 단계의 텍스트 구조 도해조직자를 내 글의 문단·연·플롯 개요 틀로 전환하여 조직"},{"code":"G6-EXP-W4","grade":"6학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W4 초고 집필하기 (갈래별 핵심 표현 전략·문장화)","sub_skill_name":"집필하기 (중심-뒷받침 위계·학술 어휘 뜻풀이·객관적 어조·시각자료 통합 집필)","curriculum_basis":"`[6국03-01]`, `[6국03-02]`, `[6국04-02, 05]`, `CCSS W.6.2a-f`(소제목·그래픽·멀티미디어 통합, 관련 사실·정의·구체적 세부사항·인용문·예시로 주제 전개, 적절한 전환어 사용, 정확한 학술 어휘 사용, 공식적이고 객관적인 문체·어조[Formal style and objective tone] 확립 및 유지, 결론 문단 제시).","dc_step1":"다층 개요서를 바탕으로 **`[핵심 대상]+[설명 측면]`의 포괄적 본제목**과 본론 문단군별 **소제목**을 설정하고, ‘처음’ 문단에서 화제 도입·핵심 학술 개념 정의·본론 전개 예고를 집필한다.","dc_step2":"‘가운데’ 3~5문단에서 (1) 각 문단 내 **[중심문장 ➔ 1차 뒷받침 설명문장 ➔ 2차 구체적 예시·수치·인용문장]**의 다층 위계를 확립하고, (2) 독자 수준을 고려하여 전문 한자 학술어가 등장할 때마다 **형태소 의미 풀이·괄호 부연·재진술(‘즉, 다시 말해’)·대조·예시 문맥 단서**(`V2-1` 역전이)를 자연스럽게 삽입하며, (3) 본문 텍스트 안에 **시각 자료 지시문(‘<표 1>과 [그림 2]의 추세에서 확인할 수 있듯이’)**과 핵심 데이터 해석을 유기적으로 결합한다.","dc_step3":"주관적 판단·감정적 수식어를 철저히 배제한 **공식적·객관적 설명 어조(`~이다, ~한다` 또는 일관된 `~입니다`)**를 끝까지 유지하고, 인용 자료의 출처를 명시하며, ‘끝’ 문단에서 복합 구조 요약(`V1-4` 연계) 및 향후 전망으로 글을 마무리한다.","mager_reading":"[조건] 복합 설명문·조사 보고서 집필 원고들이 주어졌을 때, [준거] (1) 중심-뒷받침 다층 위계 확립, (2) 학술 어휘에 대한 독자 맞춤형 뜻풀이 단서 제공, (3) 객관적·공식적 설명 어조의 일관성, (4) 시각 자료 지시문 및 출처 표기의 정확성을 90% 이상의 정확도로, [행동] 판별할 수 있다.","mager_writing":"[조건] 완성된 다층 개요서, 검증된 다중 출처 메모, 직접 제작한 시각 자료(도표·다이어그램)가 주어졌을 때, [준거] (1) [핵심 대상]+[설명 측면] 본제목과 소제목을 갖춘 처음-가운데-끝 5~6문단 이상의 분량일 것, (2) 6대 설명 구조 중 2종 이상과 문단 간 거시 지시어를 구사할 것, (3) 학술 개념어 2개 이상에 대해 문맥적 뜻풀이·예시를 제공할 것, (4) 시각 자료 지시문(‘<표 1>에서 보듯이’)과 출처를 본문에 통합할 것, (5) 주관적 편견을 배제한 객관적 어조를 일관되게 유지할 것의 5대 준거를 모두 충족하여, [행동] 1편의 완결된 복합 설명문(또는 조사 보고서)을 집필할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-W4 ➔ G6-EXP-W4 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A2·A3(문장 확장·장르별 표현 전략 구사) + 읽기 V1~V3 통합 전이 | ⬅ [읽기 전 과정 수용] 계획·생성·조직한 개요와 갈래별 핵심 표현 전략을 결합하여 완결된 초고 집필"},{"code":"G6-EXP-W5","grade":"6학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W5 고쳐쓰기 (내용·조직·표현[주술호응·교정부호] 3단계 퇴고)","sub_skill_name":"고쳐쓰기 (내용 정확성/객관성·조직 응집성·표현 주술/부사어 호응 `[6국04-05]` 3단계 교정부호 퇴고)","curriculum_basis":"`[6국03-05]`(글을 고쳐 쓰는 원리를 이해하고 쓴 글을 고쳐 쓴다), `[6국04-05]`(문장 성분의 호응 관계를 알고 바른 문장을 구성한다), `CCSS W.6.5 & L.6.1~6.3`(계획, 수정, 편집, 재작성을 통해 글의 명료성과 응집성 강화 및 문법적 정확성 확립), Flower & Hayes(1981) 검토하기(Reviewing: Evaluating & Revising) 모형.","dc_step1":"초고에서 (1) 사실·통계 수치의 정확성 및 다중 출처 표기 누락 여부(`V3-2, V3-3`), (2) 주관적 감정·편견·과장 표현 개입 여부, (3) 예상 독자 수준 대비 학술 어휘 뜻풀이 부족 여부를 점검하여 **추가(넣기)·삭제(빼기)·대체(고치기)**한다.","dc_step2":"(1) 문단 내 중심문장-뒷받침문장 위계 및 통일성 위배 문장 삭제, (2) 6대 설명 구조의 일관성(분류 기준·비교 기준 혼란 교정), (3) 문단 간 담화표지 및 거시 지시어(‘이러한 현상은’)의 응집성, (4) 본문과 시각 자료(도표 단위·지시문) 간 정합성(`V3-1`)을 점검하여 **재배열(자리 바꾸기)·줄 바꿈**한다.","dc_step3":"(1) 겹문장에서 **주어-서술어 호응**(예: “내가 설명하려는 핵심은 ~라는 점이다”), **목적어-서술어 호응**, **부사어-서술어 호응**(예: ‘비록 ~하더라도’, ‘결코/절대로 ~않다’, ‘마치 ~처럼’, ‘왜냐하면 ~때문이다’ `[6국04-05]`), (2) 의미를 모호하게 만드는 잉여 수식어·번역투 피동 표현 삭제, (3) 맞춤법·띄어쓰기·문장 부호를 표준 교정부호로 정밀 퇴고하여 최종본을 완성한다.","mager_reading":"[조건] 내용(객관성 결여·출처 누락), 조직(통일성 위배·담화표지 오용·도표 불일치), 표현(주술/부사어 호응 오류 [6국04-05]·모호한 수식어) 결함이 복합된 6~8문단 설명문 초고가 주어졌을 때, [준거] 3단계(내용·조직·표현) 퇴고 준거를 적용하여 모든 오류 지점과 적용할 표준 교정부호를 90% 이상의 정확도로, [행동] 진단·식별할 수 있다.","mager_writing":"[조건] 복합 설명문 초고와 ‘3단계 설명문 퇴고 점검표’가 주어졌을 때, [준거] 표준 교정부호를 사용하여 (1) **내용 수준**(주관적 편견 삭제, 출처·학술어 뜻풀이 보충), (2) **조직 수준**(통일성 위배 문장 삭제, 6대 설명 구조 담화표지 및 도표 지시문 교정), (3) **표현 수준**(주어-서술어 및 부사어-서술어 호응 [6국04-05] 교정, 잉여 수식어 삭제)의 3단계 퇴고를 완수하여, [행동] 정확하고 객관적이며 응집성 높은 최종 설명문(보고서)을 산출할 수 있다.","vertical_link":"[학년 나선형] G5-EXP-W5 ➔ G6-EXP-W5 ➔ 중등 학술 설명문·보고서","horizontal_link":"[공통기초 결합] A3(주술·목서·부사어·시제·높임 호응 및 문장부호 교정), A4(응집성 교정) | ⬅ [공통 A3·A4 및 읽기 V3-1·V3-2 수용] 내용·조직·표현(주술/부사어 호응, 시제, 맞춤법, 교정부호) 3단계 메타인지 퇴고"}],"common":[{"code":"G1-COM-A1","grade":"1학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A1 해독·형태소·단어관계","sub_skill_name":"[1학년 공통] 해독·어휘 형태소 및 단어 관계","curriculum_basis":"[2국01-01], [2국04-01], CCSS RF.1.2~1.3, Chall 1단계(초기 해독)","dc_step1":"기본 자모음·받침 글자 식별","dc_step2":"자모 결합 원리와 소리-글자 대응 연결","dc_step3":"친숙한 낱말의 정확한 해독·범주화","mager_reading":"[조건] 받침이 없거나 대표음 받침이 포함된 1~2학년 수준 낱말 카드 10개가 주어졌을 때 [준거] 소리 내어 읽기와 뜻 그림 연결을 10개 중 9개 이상 정확하게 [행동] 짝짓고 판별한다.","mager_writing":"[조건] 일상 사물 그림 10개가 제시되었을 때 [준거] 자모 결합에 맞게 글자를 써서 8개 이상 철자 오류 없이 [행동] 받아쓰거나 낱말을 완성한다.","vertical_link":"[종적] 입문기 음운인식 ➔ `COM-A1-G2` 겹받침·음운변동 해독","horizontal_link":"[횡적] 시(`V1-1`) 말놀이 소리 해독 및 기초 철자 표기 전이"},{"code":"G1-COM-A2","grade":"1학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A2 어휘·관용어 문맥 의미","sub_skill_name":"[1학년 공통] 어휘 문맥 의미","curriculum_basis":"[2국02-02], [2국05-01], CCSS RL.1.4, 감각 어휘 부호화","dc_step1":"소리·모양을 흉내 내는 말(의성어·의태어) 식별","dc_step2":"흉내 내는 말과 대상의 움직임·소리 상황 연결","dc_step3":"문맥 속 생생한 느낌 확인","mager_reading":"[조건] 의성어·의태어가 포함된 짧은 글이나 동시가 주어졌을 때 [준거] 소리와 모양을 흉내 내는 말을 찾아 각각 어떤 대상의 모습인지 80% 이상 정확히 [행동] 연결한다.","mager_writing":"[조건] 동물이나 사물의 움직임 장면이 제시되었을 때 [준거] 상황에 어울리는 흉내 내는 말을 2개 이상 넣어 [행동] 짧은 문장으로 표현한다.","vertical_link":"[종적] 일상 감각어 인지 ➔ `COM-A2-G2` 감각어 세분화·문맥 단서","horizontal_link":"[횡적] 동시(`V1-1`, `V2-1`) 말놀이 감각어 확인 및 느낌 추론 전이"},{"code":"G1-COM-A3","grade":"1학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A3 문장 성분 및 문장 호응","sub_skill_name":"[1학년 공통] 문장 성분 및 문장 호응","curriculum_basis":"[2국04-02], [2국03-01], CCSS L.1.1j, L.1.2b, 통사 인식 기초","dc_step1":"문장 끝 문장부호(`. ? !`)와 띄어쓰기 단위 식별","dc_step2":"\'누가/무엇이\'와 \'어찌하다/어떠하다/무엇이다\' 연결","dc_step3":"기본 문장 완결성 확인","mager_reading":"[조건] 설명·질문·느낌을 나타내는 기본 문장 6개가 주어졌을 때 [준거] \'누가/무엇이\'와 \'어찌하다/어떠하다\' 짝을 찾고 알맞은 문장부호를 5개 이상 정확히 [행동] 판별한다.","mager_writing":"[조건] 그림 속 인물이나 대상의 행동이 주어졌을 때 [준거] \'누가 어찌하다\' 구조를 갖추고 알맞은 문장부호와 띄어쓰기를 적용하여 3문장 이상 [행동] 작성한다.","vertical_link":"[종적] 구어 발화 ➔ `COM-A3-G2` 꾸며 주는 말 기초 결합","horizontal_link":"[횡적] 동시(`V1-4`, `W4`) 연별 기본 문장 말하기 및 행 끝 호흡 전이"},{"code":"G1-COM-A4","grade":"1학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A4 지시·대용 및 접속(응집성)","sub_skill_name":"[1학년 공통] 지시·대용 및 접속 (담화 응집성)","curriculum_basis":"[2국02-03], CCSS RL.1.3, Kintsch 국소 응집성(Local Coherence) 기초","dc_step1":"글 속 \'이것, 그것, 저것, 여기, 거기\' 등 기본 지시어 식별","dc_step2":"바로 앞 문장이나 그림의 사물·장소와 연결","dc_step3":"가리키는 대상 확인","mager_reading":"[조건] 지시어가 포함된 3~4문장의 짧은 글이 주어졌을 때 [준거] 밑줄 친 지시어가 가리키는 앞 문장의 사물이나 장소를 4개 중 3개 이상 정확히 [행동] 찾아 선으로 잇는다.","mager_writing":"[조건] 같은 낱말이 반복되는 짧은 두 문장이 주어졌을 때 [준거] 알맞은 지시어(\'이것, 그것, 거기\' 등)로 바꾸어 자연스럽게 [행동] 이어 말한다.","vertical_link":"[종적] 현장 지시(Deixis) ➔ `COM-A4-G2` 인물 대명사 및 기초 순서 접속어","horizontal_link":"[횡적] 동시(`V1-1`) 시 속 가리키는 대상 확인 전이"},{"code":"G1-COM-A5","grade":"1학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A5 인과 및 논리 관계","sub_skill_name":"[1학년 공통] 인과 및 논리 관계","curriculum_basis":"[2국02-03], CCSS RL.1.3, RI.1.3, 기초 인과 도식(Causal Schema)","dc_step1":"글 속 \'왜냐하면, ~해서, 그래서\' 표현 식별","dc_step2":"어떤 일이 일어난 까닭과 그 뒤의 결과 사건 연결","dc_step3":"단일 사건의 까닭과 결과 확인","mager_reading":"[조건] 인물이나 사물의 변화가 담긴 짧은 글이 주어졌을 때 [준거] \'무엇 때문에(까닭)\' \'어떻게 되었는지(결과)\'를 짝지어 80% 이상 바르게 [행동] 말하거나 선으로 잇는다.","mager_writing":"[조건] 일상생활의 결과 상황(\'우산을 썼다\' 등)이 제시되었을 때 [준거] \'~해서 ~했다\' 표현을 사용하여 까닭과 결과가 드러나는 문장을 2개 이상 [행동] 쓴다.","vertical_link":"[종적] 경험적 전후 인식 ➔ `COM-A5-G2` 명시적 이유·결과 문장 연결","horizontal_link":"[횡적] 동시(`V2-2`, `V2-3`) 화자의 기분이 변한 까닭 짐작 전이"},{"code":"G1-COM-A6","grade":"1학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A6 중심-세부 위계 및 요약 기초","sub_skill_name":"[1학년 공통] 중심-세부 위계 및 요약 기초","curriculum_basis":"[2국02-03], CCSS RI.1.2, RL.1.2, 핵심 화제어(Topic Word) 인식","dc_step1":"짧은 글에서 자주 반복되거나 가장 중요한 낱말 식별","dc_step2":"낱말과 글 전체의 그림·상황 연결","dc_step3":"\'무엇에 대한 글인지\' 핵심어 말하기","mager_reading":"[조건] 3~4문장으로 된 짧은 글이 주어졌을 때 [준거] 글에서 가장 중요하게 다루는 핵심 낱말(무엇에 대한 글인지)을 찾아 동그라미 치고 [행동] 바르게 말한다.","mager_writing":"[조건] 자신이 소개하고 싶은 대상(핵심어)이 정해졌을 때 [준거] 그 핵심어가 들어간 기본 문장 2개 이상을 [행동] 말해 보거나 쓴다.","vertical_link":"[종적] 낱말 해독(`COM-A1-G1`) ➔ `COM-A6-G2` 문장 단위 중심 생각 확인","horizontal_link":"[횡적] 동시(`V1-4`) 시의 중심 대상과 모습 말하기 전이"},{"code":"G2-COM-A1","grade":"2학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A1 해독·형태소·단어관계","sub_skill_name":"[2학년 공통] 해독·어휘 형태소 및 단어 관계","curriculum_basis":"[2국04-01], [2국04-03], CCSS RF.2.3, L.2.5b, Chall 2단계(유창성)","dc_step1":"겹받침·연음 포함 낱말 식별","dc_step2":"표기 형태와 실제 발음 대응 및 반대말·비슷한말 관계 연결","dc_step3":"기본 의미 관계망 분류","mager_reading":"[조건] 연음·된소리되기가 일어나는 낱말과 기초 유의·반의어 쌍이 포함된 짧은 글에서 [준거] 발음할 소리와 뜻이 반대/비슷한 낱말 쌍을 80% 이상 바르게 [행동] 찾아 기호로 표시한다.","mager_writing":"[조건] 제시된 문장의 밑줄 친 기본 낱말 5개를 바꿀 때 [준거] 문맥에 어울리는 반대말 또는 비슷한말을 4개 이상 선택하여 [행동] 문장을 고쳐 쓴다.","vertical_link":"[종적] `COM-A1-G1` ➔ `COM-A1-G3` 단일어·복합어 형태소 분해","horizontal_link":"[횡적] 시(`V1-2`) 대비되는 감각어 파악 및 동시 바꾸어 쓰기(`W2`) 전이"},{"code":"G2-COM-A2","grade":"2학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A2 어휘·관용어 문맥 의미","sub_skill_name":"[2학년 공통] 어휘 문맥 의미","curriculum_basis":"[2국02-02], CCSS L.2.4a, 문맥 단서(Context Clues) 기초","dc_step1":"시각·청각·촉각 등 감각어 및 모르는 낱말 식별","dc_step2":"앞뒤 낱말·그림·상황 단서와 결합","dc_step3":"문맥에 맞는 낱말 뜻 짐작하기","mager_reading":"[조건] 감각적 수식어와 낯선 낱말이 포함된 문단이 주어졌을 때 [준거] 앞뒤 문장의 단서(예시·상황)에 밑줄을 긋고 낱말의 뜻을 4개 중 3개 이상 바르게 [행동] 추론한다.","mager_writing":"[조건] 대상을 소개하거나 느낌을 쓰는 상황에서 [준거] 두 가지 이상의 감각(색깔·소리·촉감 등)을 나타내는 낱말을 사용하여 [행동] 3문장 이상으로 묘사한다.","vertical_link":"[종적] `COM-A2-G1` ➔ `COM-A2-G3` 다의어·동형어 및 기초 비유 문맥 해독","horizontal_link":"[횡적] 동시(`V1-2`, `W2`) 꾸며 주는 말과 감각 연결 및 동시 쓰기 전이"},{"code":"G2-COM-A3","grade":"2학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A3 문장 성분 및 문장 호응","sub_skill_name":"[2학년 공통] 문장 성분 및 문장 호응","curriculum_basis":"[2국04-02], CCSS L.2.1f, 기본 문장 확장(Modifier Expansion)","dc_step1":"기본 문장 내 동작·상태의 주체와 서술 부분 식별","dc_step2":"모양·정도·소리를 자세히 해 주는 꾸며 주는 말 연결","dc_step3":"기본 문장과 확장된 문장 비교","mager_reading":"[조건] 꾸며 주는 말이 있는 문장과 없는 문장 쌍 5개가 주어졌을 때 [준거] 꾸며 주는 말과 꾸밈을 받는 말을 화살표로 연결하고 의미 차이를 4개 이상 바르게 [행동] 구별한다.","mager_writing":"[조건] \'누가 무엇을 어찌하다\'의 뼈대 문장 4개가 주어졌을 때 [준거] 대상을 자세히 나타내는 꾸며 주는 말을 1개 이상씩 덧붙여 확장된 문장으로 [행동] 바꾸어 쓴다.","vertical_link":"[종적] `COM-A3-G1` ➔ `COM-A3-G3` 문장 골격(주어·목적어·서술어)과 수식어 분리","horizontal_link":"[횡적] 동시(`V1-2`, `W2`) 감각적 수식어 연결 및 표현 생성 전이"},{"code":"G2-COM-A4","grade":"2학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A4 지시·대용 및 접속(응집성)","sub_skill_name":"[2학년 공통] 지시·대용 및 접속 (담화 응집성)","curriculum_basis":"[2국02-03], [2국03-02], CCSS L.2.1c, 담화 대용어 추적 기초","dc_step1":"인물 대명사(\'그, 그녀, 우리\') 및 기본 이어 주는 말(\'그리고, 그래서, 그러나\') 식별","dc_step2":"앞 문장의 인물 및 앞뒤 문장 내용 관계 연결","dc_step3":"문장 간 이어짐 파악","mager_reading":"[조건] 인물 대명사와 기초 접속어가 쓰인 짧은 글에서 [준거] 대명사가 가리키는 인물을 쓰고 앞뒤 문장을 잇는 접속어의 역할을 80% 이상 바르게 [행동] 판별한다.","mager_writing":"[조건] 서로 관련된 두 문장 4세트가 주어졌을 때 [준거] \'그리고, 그래서, 그러나\' 중 알맞은 이어 주는 말을 넣어 4세트 중 3세트 이상 자연스럽게 [행동] 연결한다.","vertical_link":"[종적] `COM-A4-G1` ➔ `COM-A4-G3` 접속어 유형(순서·원인·대조·예시) 및 대명사 연쇄 추적","horizontal_link":"[횡적] 동시(`V1-1`, `V1-3`) 시적 화자(\'나\')와 대상 추적 전이"},{"code":"G2-COM-A5","grade":"2학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A5 인과 및 논리 관계","sub_skill_name":"[2학년 공통] 인과 및 논리 관계","curriculum_basis":"[2국02-03], [2국01-03], CCSS RI.2.3, 명시적 인과 연결","dc_step1":"까닭을 나타내는 말(\'~기 때문에, ~덕분에, 왜냐하면\') 식별","dc_step2":"원인 사건과 결과 상태의 짝 연결","dc_step3":"원인과 결과 구분 정리","mager_reading":"[조건] 원인과 결과가 순서대로 혹은 바뀌어 제시된 짧은 문단에서 [준거] 무엇이 원인이고 무엇이 결과인지 구분하여 표의 빈칸을 4개 중 3개 이상 정확히 [행동] 채운다.","mager_writing":"[조건] 자신의 생각이나 기분을 표현할 때 [준거] \'왜냐하면 ~기 때문이다\' 또는 \'~해서 ~하다\' 구문을 사용하여 까닭이 분명한 글을 3문장 이상 [행동] 작성한다.","vertical_link":"[종적] `COM-A5-G1` ➔ `COM-A5-G3` 단순 시간 선후와 논리적 인과 관계 변별","horizontal_link":"[횡적] 동시(`V2-3`, `V3-1`) 마음에 드는 시어를 고른 까닭 말하기 전이"},{"code":"G2-COM-A6","grade":"2학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A6 중심-세부 위계 및 요약 기초","sub_skill_name":"[2학년 공통] 중심-세부 위계 및 요약 기초","curriculum_basis":"[2국02-03], [2국02-04], CCSS RI.2.2, 문장 내 중심 내용 파악","dc_step1":"짧은 문단 내 각 문장의 핵심 낱말 식별","dc_step2":"가장 대표가 되는 문장과 설명해 주는 문장 비교","dc_step3":"글의 중심 생각 한 문장으로 확인","mager_reading":"[조건] 4~5문장으로 이루어진 짧은 문단이 주어졌을 때 [준거] 글쓴이가 가장 하고 싶은 말을 담은 대표 문장을 찾아 밑줄을 긋고 80% 이상 정확히 [행동] 골라낸다.","mager_writing":"[조건]하고 싶은 중심 생각 한 문장이 주어졌을 때 [준거] 그 생각을 뒷받침하는 구체적인 경험이나 설명 문장을 2개 이상 덧붙여 [행동] 짧은 글을 완성한다.","vertical_link":"[종적] `COM-A6-G1` ➔ `COM-A6-G3` 중심문장(두괄·미괄)과 뒷받침문장 위계 구분","horizontal_link":"[횡적] 동시(`V1-4`, `W3`) 연별 중심 모습 파악 및 동시 연 구성 전이"},{"code":"G3-COM-A1","grade":"3학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A1 해독·형태소·단어관계","sub_skill_name":"[3학년 공통] 해독·어휘 형태소 및 단어 관계","curriculum_basis":"[4국04-01], CCSS RF.3.3a, L.3.4b, 형태소 인식 이론(Morphological Awareness)","dc_step1":"낱말 내 뜻을 가진 중심 부분(어근) 식별","dc_step2":"홀로 쓰이는 말(단일어)과 둘 이상 결합한 말(복합어) 비교","dc_step3":"낱말 짜임 분류 및 상하위 범주 묶기","mager_reading":"[조건] 단일어와 기초 합성어·파생어가 섞인 낱말 12개가 주어졌을 때 [준거] 한 덩어리 낱말과 쪼개지는 낱말을 구분하고 상위 범주어로 묶기를 10개 이상 [행동] 분류한다.","mager_writing":"[조건] 기본 어근 낱말 카드와 흔히 쓰이는 앞뒤 덧붙는 말이 주어졌을 때 [준거] 새로운 복합어 4개 이상을 만들고 그 뜻을 바르게 [행동] 설명하여 쓴다.","vertical_link":"[종적] `COM-A1-G2` ➔ `COM-A1-G4` 합성어·파생어 및 유의·반의·상하위 위계","horizontal_link":"[횡적] 시(`V2-1`) 시어 조어 원리 이해 및 감각적 시어 생성(`W2`) 전이"},{"code":"G3-COM-A2","grade":"3학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A2 어휘·관용어 문맥 의미","sub_skill_name":"[3학년 공통] 어휘 문맥 의미","curriculum_basis":"[4국02-01], [4국04-02], CCSS L.3.4a, L.3.5a, 어휘 중의성 해소 이론","dc_step1":"소리는 같으나 뜻이 여러 개인 낱말(다의어·동형어) 식별","dc_step2":"문장 내 호응하는 주어·서술어 단서와 연결","dc_step3":"기본 의미와 확장(문맥) 의미 구분","mager_reading":"[조건] 기본 다의어(예: 손, 발, 머리, 가다 등)가 서로 다른 문맥에 쓰인 예문 6개가 주어졌을 때 [준거] 앞뒤 문맥 단서를 근거로 중심 의미와 주변 확장 의미를 5개 이상 정확히 [행동] 구별한다.","mager_writing":"[조건] 제시된 다의어 2개를 활용할 때 [준거] 각각의 기본 의미와 확장된 문맥 의미가 드러나도록 서로 다른 문장 4개를 [행동] 작성한다.","vertical_link":"[종적] `COM-A2-G2` ➔ `COM-A2-G4` 관용표현·속담 및 비유 의미 추론","horizontal_link":"[횡적] 시(`V1-2`, `V2-1`) 비유적 시어 문맥 의미 추론 전이"},{"code":"G3-COM-A3","grade":"3학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A3 문장 성분 및 문장 호응","sub_skill_name":"[3학년 공통] 문장 성분 및 문장 호응","curriculum_basis":"[4국04-03], CCSS L.3.1a, L.3.1i, Kintsch 명제 핵심 논항 추출","dc_step1":"문장 내 수식어(관형어·부사어) 식별 및 괄호 묶기","dc_step2":"필수 성분인 주어(누가/무엇이), 목적어(무엇을), 서술어(어찌하다) 연결","dc_step3":"문장 골격(핵심 명제) 추출","mager_reading":"[조건] 수식어가 여러 개 포함된 긴 문장 5개가 주어졌을 때 [준거] 꾸며 주는 말을 덜어 내고 문장 -A2-G4` ➔ `COM-A2-G6` 상징·역설·사회문화적 함축 의미 추론","horizontal_link":"[횡적] 시(`V2-1`) 다의적 시어·상징 추론 및 시 집필(`W4`) 전이"},{"code":"G5-COM-A3","grade":"5학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A3 문장 성분 및 문장 호응","sub_skill_name":"[5학년 공통] 문장 성분 및 문장 호응","curriculum_basis":"[6국04-05], CCSS L.5.1, 통사 호응 제약(Syntactic Agreement)","dc_step1":"복문·장문 내 주어, 목적어, 서술어, 필수 부사어(\'결코, 마치, 비록\' 등) 식별","dc_step2":"성분 간 의미·문법적 호응 관계 대조","dc_step3":"비문(호응 오류) 진단 및 문장 골격 재구성","mager_reading":"[조건] 주술·목서·부사어 호응 오류가 섞인 문장 8개가 주어졌을 때 [준거] 호응이 어긋난 성분을 찾아 원인을 설명하고 바른 호응 구조를 7개 이상 정확히 [행동] 판별한다.","mager_writing":"[조건] 성분 생략이나 호응 오류가 포함된 초고 문단이 주어졌을 때 [준거] 교정부호를 사용하여 주술·목서·부사어 호응 오류를 100% 바르게 [행동] 수정한다.","vertical_link":"[종적] `COM-A3-G4` ➔ `COM-A3-G6` 다중 안은문장·행간 도치·피동/사동 호응 교정","horizontal_link":"[횡적] 시(`V1-4`, `W5`) 행간 걸침(Enjambment) 문장 골격 복원 및 퇴고 전이"},{"code":"G5-COM-A4","grade":"5학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A4 지시·대용 및 접속(응집성)","sub_skill_name":"[5학년 공통] 지시·대용 및 접속 (담화 응집성)","curriculum_basis":"[6국02-02], [6국04-05], CCSS L.5.1, 거시 지시(Extended Reference) 이론","dc_step1":"앞 문장이나 문단 전체를 가리키는 거시 지시어(\'이것, 이러한 사실, 그런 까닭\') 식별","dc_step2":"선행 문단의 핵심 사건·명제 묶음과 지시어 연결","dc_step3":"지시 내용을 핵심 명제로 풀어서 진술","mager_reading":"[조건] \'이러한 현상\', \'이 문제\' 등 거시 지시어가 포함된 다문단 텍스트에서 [준거] 해당 지시어가 압축하고 있는 앞 문단의 내용을 완전한 문장으로 85% 이상 정확히 [행동] 풀어서 쓴다.","mager_writing":"[조건] 앞 문단의 내용을 받아 다음 문단으로 논의를 이어 갈 때 [준거] 앞 내용을 압축하는 거시 지시어구(\'이러한 점에 비추어 볼 때\' 등)를 사용하여 [행동] 문단 간 응집성을 구현한다.","vertical_link":"[종적] `COM-A4-G4` ➔ `COM-A4-G6` 복합 담화표지 및 텍스트 거시 응집성 통제","horizontal_link":"[횡적] 시(`V1-1`, `V1-3`) \'그곳, 그날\' 등 시적 지시어의 함축 상황 복원 전이"},{"code":"G5-COM-A5","grade":"5학년","genre":"공통기초","domain":"0. 공통 기초","layer":"A5 인과 및 논리 관계","sub_skill_name":"[5학년 공통] 인과 및 논리 관계","curriculum_basis":"[6국02-02], [6국02-03], CCSS RI.5.3, Kintsch 교량 추론(Bridging Inference)","dc_step1":"연쇄 사건(`A➔B➔C➔D`) 및 표면에 생략된 중간 인과 고리 식별","dc_step2":"텍스트 단서와 배경지식을 결합해 생략된 매개 원인 연결","dc_step3":"연쇄 인과 및 암묵적 인과 복원","mager_reading":"[조건] 연쇄적 사건 전개나 인과 표지
