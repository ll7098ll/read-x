가 먼저 자라나고, 이어서 앞다리가 쑥 나옵니다.","step1_hint":"잠깐! 이 문제는 글의 내용과 ‘다른’ 것을 고르는 문제예요! 2문단에서 다리가 나오는 순서를 다시 확인해 볼까요?","step2_hint":"본문은 ‘뒷다리 ➔ 앞다리’ 순서인데, 선지 중 순서를 거꾸로 뒤집어 놓은 [D2 순서 뒤바뀜 함정] 선지가 하나 숨어 있어요!"}]}},{"id":"g3_seoyeon","grade_num":3,"grade":"3학년","grade_band":"초중 (3~4학년군 · 4지선다 기본형)","persona_label":"초3 이서연 · 다의어·개념어 문맥추론 취약형","slot_id":"G3-EXP-V2-1","domain":"2. 추론적 이해","layer":"V2-1 문맥 추론 (학술 개념어·다의어)","sub_skill_name":"설명문 문맥 단서를 활용한 다의어(‘높다’, ‘크다’) 구별 및 과학 개념어(‘세기’, ‘높낮이’) 추론","curriculum_concept":{"subject":"초3 과학 (2학기) · 초3 국어 (사전 찾기와 다의어)","unit":"소리의 성질","concept":"소리의 세기(진폭: 큰 소리/작은 소리)와 소리의 높낮이(진동수: 높은 소리/낮은 소리) 비교","text_structure":"비교·대조 (Comparison & Contrast) + 인과"},"complexity_metrics":{"kread_target":"1045 (3학년 표준 1000~1090)","current_kread":"950 (2학년 후반 수준 · -95p)","para_count":"3문단 (10문장)","char_count":"386자 (3학년 권장 320~450자)","eojeol_count":"91어절 (문장당 평균 9.1어절)","vocab_profile":"Tier 1(78%) · Tier 2(15%: 반면에, 비교, 구별) · Tier 3(7%: 떨림, 세기, 높낮이, 음판)","csat_scaling":"4지선다 · 수능 어휘 문맥 의미 교체형 + 실험 조건 대조 추론형"},"mager_goal":"[조건] 3문단 비교 설명글이 주어졌을 때, [준거] 일상 다의어('높다')의 문맥적 의미와 과학 개념어('소리의 세기' vs '소리의 높낮이')의 차이를 85% 이상 정확히, [행동] 문맥 단서로 추론하고 구별할 수 있다.","student_summary":"문단의 중심 내용은 파악하나, 과학·사회 지문에서 일상 다의어(‘높다, 크다, 차다’)가 학술적 의미로 쓰일 때 [D4 다의어 중심의미 고착] 함정에 자주 빠짐","diagnostic_test":{"passage_title":"[진단 미니 지문] 자석의 극과 나침반 (초3 과학 ‘자석의 이용’)","passage_spec":"2문단 · 310자 · KReaD 1030 · 4지선다","paragraphs":["막대자석에 철로 된 클립을 가까이 가져가면 클립이 자석의 양 끝부분에 가장 많이 달라붙는다. 이처럼 자석에서 철로 된 물체를 끌어당기는 힘이 가장 센 양 끝부분을 자석의 ‘극’이라고 부른다.","자석의 극에는 N극과 S극 두 가지가 있다. 자석을 공중에 매달아 놓으면 N극은 언제나 북쪽을 ㉠<u>가리키고</u>, S극은 남쪽을 향한다. 이러한 성질을 이용해 만든 도구가 바로 방향을 알려 주는 ‘나침반’이다."],"questions":[{"q_no":1,"target_code":"G3-EXP-V2-1","target_skill":"문맥 속 다의어의 정확한 의미 추론","stem":"윗글의 밑줄 친 ㉠‘가리키고’와 뜻이 가장 비슷하게 쓰인 문장은 무엇인가요?","options":[{"no":1,"text":"시계의 짧은바늘이 숫자 3을 가리키고 있다.","is_correct":true,"trap":"정답 (어떤 방향이나 대상을 향하다)"},{"no":2,"text":"선생님께서 우리에게 재미있는 노래를 가르치고 계신다.","is_correct":false,"trap":"D4 (음운 유사어 ‘가리키다’ ↔ ‘가르치다 >높은</u> 소리를 낸다.”에서 ‘높은’과 같은 뜻으로 쓰인 것은?","choices":["실로폰의 짧은 음판을 치면 높은 음이 난다.","우리 동네에서 가장 높은 산에 올라갔다."],"correct":"실로폰의 짧은 음판을 치면 높은 음이 난다.","feedback":"정확해요! 둘 다 앞뒤에 ‘소리/음’이 와서 [소리의 높낮이가 위쪽에 있다]라는 뜻으로 쓰였어요."},"step1_2_drill":{"badge":"[본 처방 훈련] G3-EXP-V2-1 소리의 ‘세기(큰 소리)’와 ‘높낮이(높은 소리)’ 문맥 단서 조립","passage_snippet":"북을 <span class='rx-cue' data-tip='세기 원인: 세게 치면'>세게 치면</span> 북가죽이 크게 떨리면서 큰 소리가 나고, 약하게 치면 작게 떨리면서 작은 소리가 난다. 이처럼 소리의 크고 작은 정도를 ‘소리의 세기’라고 한다. 반면에 실로폰의 <span class='rx-cue' data-tip='높낮이 원인: 짧은 음판'>짧은 음판</span>을 치면 빠르게 떨리면서 <u>높은</u> 소리가 나고, 긴 음판을 치면 느리게 떨리면서 낮은 소리가 난다. 이처럼 소리의 높고 낮은 정도를 ‘소리의 높낮이’라고 한다.","think_aloud_prompt":"노란색 단서를 클릭해 보고, ‘소리의 세기’와 ‘소리의 높낮이’가 각각 무엇에 따라 달라지는지 빈칸을 조립해 보세요!","cloze_sentences":["• [소리의 세기(큰 소리/작은 소리)]: 물체를 치는 힘과 떨림의 ( {b1} )에 따라 결정됨","• [소리의 높낮이(높은 소리/낮은 소리)]: 음판의 길이와 떨리는 ( {b2} )에 따라 결정됨"],"blanks":[{"id":"b1","correct":"크기(폭)","options":["크기(폭)","빠르기","색깔"]},{"id":"b2","correct":"빠르기(속도)","options":["빠르기(속도)","크기(폭)","무게"]}]},"step3_vaccine":{"badge":"[오답 함정 백신 드릴] D4(세기 ↔ 높낮이 속성 교차 함정) 참/거짓 판별하기","desc":"수능에서는 ‘소리의 세기’ 설명과 ‘소리의 높낮이’ 설명을 슬쩍 바꿔치기(D4)합니다! 구별해 볼까요?","items":[{"statement":"실로폰의 긴 음판을 세게 치면 짧은 음판을 칠 때보다 더 ‘높은’ 소리가 난다.","answer":"X","reason":"함정 포착! 세게 치면 소리가 ‘커지는(세기)’ 것일 뿐, 긴 음판은 여전히 ‘낮은’ 소리가 납니다! [D4 세기↔높낮이 교차 함정]"},{"statement":"짧은 음판은 긴 음판보다 더 빠르게 떨리기 때문에 높은 소리가 난다.","answer":"O","reason":"정답입니다! [짧은 음판 ➔ 빠른 떨림 ➔ 높은 소리] 인과 관계를 정확히 파악했어요."}]}},"real_csat_test":{"test_title":"[실전 수능 대비 4지선다] 초3 과학 ‘작은북과 실로폰으로 알아보는 소리의 세기와 높낮이’","passage_spec":"3문단 · 386자 · 91어절 · KReaD 1045 · 비교 실험표 결합 · 4지선다","passage_title":"작은북과 실로폰으로 알아보는 소리의 세기와 높낮이","paragraphs":["우리 주변에서는 시계 초침 소리처럼 작은 소리도 나고, 천둥소리처럼 큰 소리도 난다. 또 호루라기 소리처럼 높은 소리도 있고, 큰북 소리처럼 낮은 소리도 있다. 과학에서는 이 두 가지 성질을 <span class='cue-span' data-cue='g3-c1'>‘소리의 세기’</span>와 <span class='cue-span' data-cue='g3-c2'>‘소리의 높낮이’</span>라고 부르며 엄격하게 구별한다.","먼저 ‘소리의 세기’는 소리가 크고 작은 정도를 뜻한다. 작은북 위에 좁쌀을 올려놓고 채로 북을 <span class='cue-span' data-cue='g3-c3'>세게 치면 좁쌀이 높이 뛰어오르면서 큰 소리</span>가 난다. 반면에 북을 약하게 치면 좁쌀이 낮게 튀면서 작은 소리가 난다. 즉, 물체가 떨리는 폭이 클수록 더 큰 소리가 나는 것이다.","이와 달리 ‘소리의 높낮이’는 소리가 높고 낮은 정도를 뜻한다. 길이가 다른 음판들이 나란히 놓인 실로폰을 같은 힘으로 쳐 보면, <span class='cue-span' data-cue='g3-c4'>길이가 짧은 음판에서는 ㉠<u>높은</u> 소리</span>가 나고 길이가 긴 음판에서는 낮은 소리가 난다. 이는 물체의 길이가 짧을수록 더 빠르게 떨리기 때문이다."],"vocab_notes":[{"word":"구별하다","tier":"Tier 2 (범교과 사고어)","desc":"성질이나 종류에 따라 차이를 두어 가르다"},{"word":"소리의 세기","tier":"Tier 3 (과학 개념어)","desc":"소리가 크고 작은 정도 (떨리는 폭에 비례)"},{"word":"소리의 높낮이","tier":"Tier 3 (과학 개념어)","desc":"소리가 높고 낮은 정도 (떨리는 빠르기에 비례)"}],"visual_html":"\\n              <div style=\\"background:#F8FAFC; border:1px solid #CBD5E1; border-radius:10px; padding:14px; margin:12px 0;\\">\\n                <div style=\\"font-weight:800; color:#1E293B; margin-bottom:8px;\\">📊 [실험 비교표] 소리의 세기 vs 소리의 높낮이</div>\\n                <table style=\\"width:100%; border-collapse:collapse; font-size:0.86rem; background:#fff;\\">\\n                  <thead>\\n                    <tr style=\\"background:#E2E8F0; color:#0F172A;\\">\\n                      <th style=\\"border:1px solid #CBD5E1; padding:7px;\\">비교 기준</th>\\n                      <th style=\\"border:1px solid #CBD5E1; padding:7px;\\">소리의 세기 (큰 소리 / 작은 소리)</th>\\n                      <th style=\\"border:1px solid #CBD5E1; padding:7px;\\">소리의 높낮이 (높은 소리 / 낮은 소리)</th>\\n                    </tr>\\n                  </thead>\\n                  <tbody>\\n                    <tr>\\n                      <td style=\\"border:1px solid #CBD5E1; padding:7px; font-weight:700; text-align:center;\\">실험 악기</td>\\n                      <td style=\\"border:1px solid #CBD5E1; padding:7px;\\">작은북 (위에 좁쌀 올려놓기)</td>\\n                      <td style=\\"border:1px solid #CBD5E1; padding:7px;\\">실로폰 (음판 길이 비교하기)</td>\\n                    </tr>\\n                    <tr>\\n                      <td style=\\"border:1px solid #CBD5E1; padding:7px; font-weight:700; text-align:center;\\">달라지는 조건</td>\\n                      <td style=\\"border:1px solid #CBD5E1; padding:7px; color:#1D4ED8; font-weight:700;\\">치는 힘 ➔ 물체가 떨리는 폭</td>\\n                      <td style=\\"border:1px solid #CBD5E1; padding:7px; color:#047857; font-weight:700;\\">음판 길이 ➔ 물체가 떨리는 빠르기</td>\\n                    </tr>\\n                  </tbody>\\n                </table>\\n              </div>\\n            ","questions":[{"q_no":1,"archetype":"CSAT-READ-V2-1 (수능 어휘 문맥적 의미 구별 전형 - 4지선다)","stem":"윗글의 밑줄 친 ㉠<u>높은</u>과 문맥적 의미가 가장 가까운 것은?","bogi":null,"options":[{"no":1,"text":"저 산은 구름이 걸릴 만큼 봉우리가 매우 <u>높다</u>.","is_correct":false,"formula":"오답 공식 [D4 다의어 기본 의미 혼동]: 공간적 수직 길이(물리적 높이) 의미","explanation":"❌ **[D4 다의어 기본 의미 함정]** 산봉우리가 ‘높다’는 아래에서 위까지의 길이가 길다는 뜻이에요."},{"no":2,"text":"언니가 부르는 노래는 고음 부분이 아주 <u>높아서</u> 따라 부르기 어렵다.","is_correct":true,"formula":"정답 공식: [소리의 진동수가 많아 음이 가늘고 맑은 상태] 문맥 의미 일치","explanation":"🎉 **[처방 성공! 다의어 문맥 추론 완료]** ㉠‘높은 소리’와 마찬가지로 **소리의 음이 위쪽에 있다(고음이다)**는 뜻으로 쓰였어요!"},{"no":3,"text":"오늘 낮에는 기온이 어제보다 훨씬 <u>높을</u> 것으로 예상된다.","is_correct":false,"formula":"오답 공식 [D4 다의어 주변 의미 2]: 온도 수치의 크기를 나타내는 의미","explanation":"❌ **오답이에요!** 기온이 ‘높다’는 온도의 수치가 크다는 뜻이에요."},{"no":4,"text":"이순신 장군은 백성들에게 <u>높은</u> 존경을 받은 인물이다.","is_correct":false,"formula":"오답 공식 [D4 다의어 추상·비유 의미]: 가치나 수준이 뛰어나다는 의미","explanation":"❌ **오답이에요!** 존경이 ‘높다’는 정도나 가치가 뛰어나다는 비유적 의미예요."}]},{"q_no":2,"archetype":"CSAT-READ-V2-4 (<보기> 실험 상황 적용 및 개념 교차 검증형 - 4지선다)","stem":"윗글을 바탕으로 <보기>의 실험 결과를 추론한 내용으로 가장 적절한 것은?","bogi":"<보기>\\n  민수는 실로폰에서 가장 짧은 ‘도’ 음판(㉮)과 가장 긴 ‘도’ 음판(㉯)을 준비했다. 그리고 작은북(㉰) 위에는 좁쌀을 올려놓았다.","options":[{"no":1,"text":"같은 힘으로 칠 때, ㉮ 음판은 ㉯ 음판보다 더 느리게 떨리면서 낮은 소리가 날 것이다.","is_correct":false,"formula":"오답 공식 [D2 비례 방향 왜곡]: 짧은 음판(㉮)은 '빠르게 떨리며 높은 소리'가 남","explanation":"❌ **[D2 비례 방향 왜곡 함정]** 길이가 가장 짧은 ㉮ 음판은 가장 **빠르게 떨리면서 높은 소리**가 나요."},{"no":2,"text":"㉯ 음판을 더 세게 치면 소리의 높낮이가 갑자기 높아져서 ㉮ 음판과 똑같은 음이 날 것이다.","is_correct":false,"formula":"오답 공식 [D4 개념 속성 교차 치환]: 치는 힘(소리의 세기 조건)을 바꾸면 높낮이가 바뀐다고 왜곡","explanation":"❌ **[D4 세기↔높낮이 교차 함정]** 음판을 세게 치면 소리가 **커질(세기 증가)** 뿐, 긴 음판의 낮은 "본문의 조건 화살표(기온↑ · 습도↓ = 증산 작용↑)를 보고 아래 빈칸을 완성해 보세요!","cloze_sentences":["• [막대그래프 해석]: 잎이 있는 (가)에서 줄어든 물의 양(35mL)이 (나)(2mL)보다 훨씬 많은 까닭은 잎에서 ( {b1} )이 일어났기 때문임","• [꺾은선그래프 결합]: 하루 중 기온이 가장 높고(28℃) 습도가 가장 낮은 ( {b2} )에 (가)의 물이 가장 빠르게 줄어듦"],"blanks":[{"id":"b1","correct":"증산 작용","options":["증산 작용","자연 증발","광합성 정지"]},{"id":"b2","correct":"오후 2시","options":["오후 2시","오전 9시","오후 6시"]}]},"step3_vaccine":{"badge":"[오답 함정 백신 드릴] D2(증감 방향 왜곡 함정) 참/거짓 판별하기","desc":"수능에서는 ‘습도가 낮을수록 활발하다’를 ‘습도가 높을수록 활발하다’로 슬쩍 바꿉니다(D2)! 판별해 볼까요?","items":[{"statement":"공기 중의 습도가 높고 기온이 낮을수록 식물의 증산 작용이 가장 활발하게 일어난다.","answer":"X","reason":"함정 포착! [D2 증감 방향 역전 함정]입니다. 본문에서 기온이 ‘높고’ 습도가 ‘낮을수록’ 활발하다고 했어요!"},{"statement":"기온이 28℃로 가장 높고 습도가 40%로 가장 낮은 오후 2시에 줄어드는 물의 양이 가장 많다.","answer":"O","reason":"정확합니다! 본문 조건과 꺾은선그래프의 오후 2시 수치를 완벽하게 결합했어요."}]}},"real_csat_test":{"test_title":"[실전 수능 대비 4지선다] 초4 과학·수학 ‘식물의 증산 작용 실험과 시간대별 기온·습도 변화’","passage_spec":"4문단 · 512자 · 121어절 · KReaD 1150 · 복합 그래프(막대+꺾은선) 결합 · 4지선다","passage_title":"식물의 증산 작용 실험과 시간대별 기온·습도 변화","paragraphs":["식물의 뿌리에서 흡수한 물은 줄기의 물관을 따라 잎까지 이동한다. 잎에 도달한 물의 일부는 광합성에 쓰이지만, 대부분은 잎 뒷면에 있는 작은 구멍인 <span class='cue-span' data-cue='g4-c1'>‘기공’을 통해 수증기 형태로 식물 밖으로 빠져나간다. 이를 ‘증산 작용’</span>이라고 한다.","증산 작용은 식물이 살아가는 데 매우 중요한 역할을 한다. 잎에서 물이 수증기로 빠져나가면 그 빈자리를 채우기 위해 뿌리에서 흡수한 물을 위쪽 줄기와 잎까지 계속 끌어 올리는 힘이 생긴다. 또한 더운 날 땀이 식으면서 체온이 내려가듯이 식물 주변의 온도를 낮추어 준다.","잎을 통한 물의 이동을 확인하기 위해 똑같은 양(200mL)의 물이 담긴 눈금실린더 <span class='cue-span' data-cue='g4-c2'>(가)에는 잎이 무성한 나뭇가지를, (나)에는 잎을 모두 딴 나뭇가지</span>를 꽂았다. 그다음 눈금실린더 속의 물이 공기 중으로 <span class='cue-span' data-cue='g4-c3'>자연 증발하는 것을 막으려고 물 표면 위에 식용유를 한 방울씩</span> 떨어뜨린 뒤 햇빛이 잘 드는 창가에 두었다.","증산 작용은 기공이 활짝 열릴 때 활발하게 일어난다. 따라서 <span class='cue-span' data-cue='g4-c4'>햇빛이 강하고 기온이 높을수록, 그리고 공기 중의 습도가 낮아 건조할수록</span> 줄어드는 물의 양이 많아진다."],"vocab_notes":[{"word":"기공(氣孔)","tier":"Tier 3 (과학 개념어)","desc":"식물 잎 표면에 공기와 수증기가 드나드는 작은 구멍"},{"word":"증산 작용","tier":"Tier 3 (과학 개념어)","desc":"식물 속의 물이 기공을 통해 수증기로 빠져나가는 현상"},{"word":"습도(濕度)","tier":"Tier D1·D4 함정 백신]","rx_reason":"5학년 설명문의 핵심인 ‘생물 분류 체계(균계 vs 세균계)’와 ‘매체 비판 4대 준거(정확성·공신력·객관성·공정성)’를 정복하고 인과 역전 함정을 깨뜨리는 클리닉을 처방합니다.","step0_remedial":{"badge":"[선행 징검다리 복습] G4-EXP-V1-2 ‘분류(종류)’ vs ‘분석(전체-부분)’ 1분 구분 공식","rule_box":"💡 **1초 판별 공식**: 하위 항목에 **‘~은 상위 개념의 한 종류이다’**가 성립하면 **[상하위 분류]**(예: 미생물의 종류 ➔ 세균, 곰팡이)이고, **‘~은 전체를 이루는 부품/구성 요소이다’**가 성립하면 **[전체-부분 분석]**(예: 보온병 ➔ 마개, 진공 층)입니다!","mini_question":"“곰팡이는 크게 푸른곰팡이, 누룩곰팡이, 털곰팡이로 나뉜다.”에서 쓰인 설명 방법은?","choices":["상하위 분류 (종류 나누기)","전체-부분 분석 (부품 쪼개기)"],"correct":"상하위 분류 (종류 나누기)","feedback":"정확합니다! 푸른곰팡이와 누룩곰팡이는 각각 곰팡이의 ‘한 종류’이므로 [상하위 분류]입니다."},"step1_2_drill":{"badge":"[본 처방 훈련] G5-EXP-V3-2 미생물의 양면성과 설명문 4대 평가 준거 조립하기","passage_snippet":"미생물은 세포 구조에 따라 <span class='rx-cue' data-tip='상하위 분류: 균계 vs 세균계'>‘균계(곰팡이·버섯)’와 ‘세균계(세균)’로 분류</span>된다. 일부 미생물은 식중독이나 무좀을 일으키지만, <span class='rx-cue' data-tip='유익한 역할 ①: 발효와 항생제'>김치·된장 발효와 페니실린(푸른곰팡이) 생산</span>을 돕고, 생태계에서 <span class='rx-cue' data-tip='유익한 역할 ②: 분해자(유기물➔무기물)'>죽은 생물의 유기물을 무기물로 분해</span>해 식물의 영양분으로 돌려보낸다. 따라서 미생물 정보를 읽을 때는 ① 사실의 정확성, ② 출처의 공신력, ③ 서술의 객관성, ④ 양면을 고루 다룬 관점의 공정성을 점검해야 한다.","think_aloud_prompt":"노란색 단서를 확인하고, 인터넷 게시글의 문제점을 4대 평가 준거와 연결해 보세요!","cloze_sentences":["• “어제 동네 친구한테 들었는데~” ➔ 검증되지 않은 출처이므로 ( {b1} ) 결여!","• “세균과 곰팡이는 끔찍하고 징그러운 존재다!” ➔ 감정적 표현을 썼으므로 ( {b2} ) 위배!","• “유익한 점은 모두 빼고 해로운 점만 부각함” ➔ 한쪽 측면만 다뤘으므로 ( {b3} ) 부족!"],"blanks":[{"id":"b1","correct":"출처의 공신력","options":["출처의 공신력","문장 길이","분류 기준"]},{"id":"b2","correct":"서술의 객관성","options":["서술의 객관성","자료의 최신성","전체-부분 분석"]},{"id":"b3","correct":"관점의 공정성(균형성)","options":["관점의 공정성(균형성)","맞춤법 표기","도표의 단위"]}]},"step3_vaccine":{"badge":"[오답 함정 백신 드릴] D1(인과 역전) & D4(분류 속성 교차) 참/거짓 판별하기","desc":"수능 5지선다에서 가장 많이 출제되는 인과 역전(D1)과 분류 교차(D4) 문장을 판별해 보세요!","items":[{"statement":"세계 최초의 항생제인 페니실린은 세균계에 속하는 유산균에서 추출한 물질로 만들어졌다.","answer":"X","reason":"함정 포착! [D4 분류 속성 교차 함정]입니다. 페니실린은 유산균(세균계)이 아니라 균계에 속하는 ‘푸른곰팡이’에서 추출했어요!"},{"statement":"숲속의 곰팡이와 세균이 사라지면 죽은 생물의 유기물이 무기물로 분해되지 않아 식물이 자랄 영양분이 부족해진다.","answer":"O","reason":"정확합니다! [분해자 소멸(원인) ➔ 유기물 분해 중단(매개) ➔ 식물 영양분 부족(결과)] 인과 사슬이 정확히 맞습니다."}]}},"real_csat_test":{"test_title":"[실전 수능 대비 5지선다] 초5 과학·국어 ‘우리 주변의 작은 생물, 세균과 곰팡이의 두 얼굴’","passage_spec":"5문단 · 695자 · 164어절 · KReaD 1245 · 분류·생태 비율표 결합 · 5지선다","passage_title":"우리 주변의 작은 생물, 세균과 곰팡이의 두 얼굴","paragraphs":["우리 주변의 공기, 흙, 물속, 심지어 우리 몸속에는 눈으로 직접 볼 수 없을 만큼 작은 생물인 ‘미생물’이 무수히 살아가고 있다. 미생물은 세포의 구조와 생김새에 따라 크게 <span class='cue-span' data-cue='g5-c1'>곰팡이·버섯 등이 속하는 ‘균계’와 대장균·유산균 등이 속하는 ‘세균계’로 분류</span>된다. 균계에 속하는 곰팡이는 몸이 실처럼 가는 ‘균사’로 이루어져 있으며 포자로 번식하는 반면, 세균계에 속하는 세균은 하나의 세포로만 이루어진 단세포 생물로 스스로 둘로 갈라지는 분열 방식으로 빠르게 번식한다.","흔히 사람들은 세균과 곰팡이를 우리에게 질병과 피해만 주는 해로운 존재로 여기기 쉽다. 실제로 살모넬라균 같은 병원성 세균은 식중독이나 폐렴을 일으키고, 여름철 음식물이나 욕실 타일에 피는 일부 곰팡이는 호흡기 질환이나 무좀을 유발하기도 한다. 이처럼 인간에게 해를 끼치는 측면 때문에 미생물을 무조건 박멸해야 할 대상으로 오해하는 경우가 많다.","그러나 <span class='cue-span' data-cue='g5-c2'>인간에게 질병을 일으키는 병원성 미생물은 전체 미생물의 1% 미만</span>에 불과하며, 대다수의 미생물은 인간과 자연 생태계에 없어서는 안 될 유익한 역할을 수행한다. 예컨대 김치와 요구르트를 익게 하는 ‘유산균’이나 된장·간장을 만드는 ‘누룩곰팡이’는 음식의 맛과 보존성을 높이는 유익한 발효 미생물이다. 또한 인류의 생명을 구한 최초의 항생제인 <span class='cue-span' data-cue='g5-c3'>‘페니실린’ 역시 푸른곰팡이에서 추출한 물질</span>로 만들어졌다.","더 나아가 자연 생태계에서 곰팡이와 세균은 <span class='cue-span' data-cue='g5-c4'>죽은 동식물의 사체나 배설물 속 ‘유기물’을 잘게 쪼개어 ‘무기물’로 되돌려보내는 ‘분해자’ 역할</span>을 담당한다. 만약 숲속에 세균과 곰팡이가 모두 사라진다면 죽은 생물과 낙엽이 썩지 않고 그대로 쌓여 지구는 거대한 쓰레기장이 될 것이며, 식물이 다시 흡수할 영양분도 고갈될 것이다.","따라서 미생물에 관한 매체 자료나 설명 글을 읽을 때에는 해로운 측면이나 유익한 측면 중 어느 한쪽만 과장하여 전달하지 않았는지 <span class='cue-span' data-cue='g5-c5'>‘관점의 공정성’을 따져 보아야 한다. 아울러 과학적 사실에 부합하는지(‘정확성’), 믿을 만한 전문 기관의 연구 결과인지(‘출처의 공신력’), 감정적 표현 없이 중립적으로 서술했는지(‘객관성’)</span>를 비판적으로 점검하는 태도가 필요하다."],"vocab_notes":[{"word":"분류(分類)","tier":"Tier 2 (학술 사고어)","desc":"일정한 기준에 따라 상위 개념을 하위 종류들로 나누는 것"},{"word":"유기물 / 무기물","tier":"Tier 3 (과학 개념어)","desc":"생물체를 이루는 탄소 화합물(유기물)과 물·무기염류 같은 물질(무기물)"},{"word":"공신력(公信力)","tier":"Tier 2 (비판적 독해어)","desc":"사회적으로 대중에게 믿음을 줄 수 있는 공적인 신뢰도"}],"visual_html":"\\n              <div style=\\"background:#F8FAFC; border:1px solid #CBD5E1; border-radius:10px; padding:12px; margin:12px 0;\\">\\n                <div style=\\"font-weight:800; font-size:0.86rem; color:#1E293B; margin-bottom:6px;\\">📋 [핵심 요약표] 균계 vs 세균계 분류 및 설명문 비판적 읽기 4대 준거</div>\\n                <div style=\\"display:grid; grid-template-columns:1.1fr 1fr; gap:10px; font-size:0.8rem;\\">\\n                  <div style=\\"background:#fff; padding:9px; border-radius:8px; border:1px solid #E2E8F0;\\">\\n                    <b style=\\"color:#1D4ED8;\\">[생물 분류 비교]</b><br>\\n                    • <b>균계(곰팡이·버섯)</b>: 실 모양 ‘균사’ 구조, 포자 번식 (예: 누룩곰팡이, 푸른곰팡이)<br>\\n                    • <b>세균계(세균)</b>: 균사 없는 ‘단세포’ 구조, 분열 번식 (예: 유산균, 살모넬라균)\\n                  </div>\\n                  <div style=\\"background:#FEFCE8; padding:9px; border-radius:8px; border:1px solid #FDE047;\\">\\n                    <b style=\\"color:#A16207;\\">[설명문 비판적 읽기 4대 평가 준거]</b><br>\\n                    ① <b>정확성</b>(사실 부합) · ② <b>출처 공신력</b>(전문 기관)<br>\\n                    ③ <b>서술 객관성</b>(감정 배제) · ④ <b>관점 공정성</b>(양면 균형)\\n                  </div>\\n                </div>\\n              </div>\\n            ","questions":[{"q_no":1,"archetype":"CSAT-READ-V3-2 (수능 비판적 독해 전형: 4대 평가 준거 기반 매체 자료 비판형 - 5지선다)","stem":"윗글과 [설명문 비판적 읽기 4대 평가 준거]를 바탕으로 <보기>의 인터넷 게시글을 평가한 내용으로 적절하지 <u>않은</u> 것은?","bogi":"<보기> [인터넷 게시판 글: 우리 집 세균 박멸 대작전!]\\n  세균과 곰팡이는 우리에게 식중독과 무좀만 일으키는 아주 끔찍하고 징그러운 백해무익(百害無益)한 존재입니다! 어제 동네 친구한테 들었는데, 세균을 완전히 없애려면 발효 식품인 된장과 김치도 절대 먹으면 안 된다고 합니다. 우리 모두 시중에서 파는 ‘○○ 강력 살균 스프레이’를 사서 집 안의 모든 미생물을 하나도 남김없이 없애야 합니다.","options":[{"no":1,"text":"‘끔찍하고 징그러운’과 같이 필자의 주관적인 감정과 혐오감을 드러내는 표현을 사용하여 설명의 ‘서술 객관성’을 해치고 있다.","is_correct":false,"formula":"타당한 평가: [감정적 수식어 ➔ ③ 서술 객관성 위배 정확 매칭]","explanation":"⭕ **타당한 평가예요!** 객관적 사실을 전달해야 할 설명문에 '끔찍하고 징그러운' 같은 주관적 감정 어휘를 쓴 것은 **서술의 객관성**을 어긴 것이에요."},{"no":2,"text":"전문 연구 기관의 자료가 아니라 ‘어제 동네 친구한테 들었는데’라는 불확실한 말을 근거로 삼아 ‘출처의 공신력’이 결여되어 있다.","is_correct":false,"formula":"타당한 평가: [전언/카더라 ➔ ② 출처 공신력 결여 정확 매칭]","explanation":"⭕ **타당한 평가예요!** 검증되지 않은 주변 사람의 말을 출처로 삼았으므로 **출처의 공신력(신뢰성)**이 매우 낮아요."},{"no":3,"text":"미생물이 발효 식품, 항생제, 생태계 물질 순환에 기여하는 유익한 측면은 모두 누락하고 해로운 점만 일방적으로 부각하여 ‘관점의 공정성’이 부족하다.","is_correct":false,"formula":"타당한 평가: [일방적 편향 서술 ➔ ④ 관점 공정성 부족 정확 매칭]","explanation":"⭕ **타당한 평가예요!** 윗글 3~4문단에 나온 유익한 역할은 모두 빼고 '백해무익하다'며 한쪽 측면만 강조했으므로 **관점의 공정성(균형성)**을 잃었어요."},{"no":4,"text":"된장과 김치 속 미생물까지 모두 병을 일으키는 해로운 균으로 왜곡하여 설명했으므로 ‘정보의 정확성’ 기준에 어긋난다.","is_correct":false,"formula":"타당한 평가: [유익균 발효 사실 왜곡 ➔ ① 정보 정확성 위배 정확 매칭]","explanation":"⭕ **타당한 평가예요!** 윗글 3문단에서 된장(누룩곰팡이)과 김치(유산균)는 유익한 발효 식품이라고 했으므로 사실의 **정확성**에 어긋나요."},{"no":5,"text":"특정 상품(‘○○ 살균 스프레이’) 구매를 유도한 것은 다양한 시각 도표를 함께 제시하여 독자의 이해를 도운 ‘서술 객관성’의 모범 사례이다.","is_correct":true,"formula":"정답(부적절) - 오답 공식 [D5 평가 준거 역전 & D6 상업적 편향 미화]: 상업적 광고 의도와 시각자료 미제시를 정반대로 평가","explanation":"🎉 **[처방 성공! 정답(부적절한 평가)]** \`<보기>\`에는 시각 도표가 제시되지도 않았을뿐더러, 특정 상업 제품을 홍보하며 구매를 부추기는 것은 이해관계가 개입되어 **출처의 공정성과 설명문 본래의 객관적 정보 전달 목적을 심각하게 훼손**한 사례예요!"}]},{"q_no":2,"archetype":"CSAT-READ-V1-2 & V2-2 (분류 기준 대조 및 생태계 인과 추론형 - 5지선다)","stem":"윗글을 읽고 추론한 내용으로 가장 적절한 것은?","bogi":null,"options":[{"no":1,"text":"대장균과 유산균은 몸이 실처럼 가는 균사로 이루어져 있으며 포자를 만들어 번식한다.","is_correct":false,"formula":"오답 공식 [D4 분류군 속성 교차 치환]: '균계(곰팡이)'의 속성을 '세균계(대장균·유산균)'에 치환","explanation":"❌ **[D4 분류 속성 교차 함정]** 균사로 이루어져 포자로 번식하는 것은 세균이 아니라 **균계(곰팡이·버섯)**의 특징이에요!"},{"no":2,"text":"지구상에 존재하는 미생물의 절반 이상은 인간에게 식중독이나 폐렴을 일으키는 병원성 미생물이다.","is_correct":false,"formula":"오답 공식 [D3 비율 수치 과장 왜곡]: 3문단 '1% 미만'을 '절반(50%) 이상'으로 과장","explanation":"❌ **[D3 수치 과장 함정]** 3문단에서 병원성 미생물은 전체 미생물의 **1% 미만**에 불과하다고 했어요."},{"no":3,"text":"숲속의 세균과 곰팡이가 모두 사라지면 죽은 생물의 유기물이 무기물로 분해되지 않아 식물이 자랄 영양분이 부족해질 것이다.","is_correct":true,"formula":"정답 공식: [4문단 분해자의 역할(유기물➔무기물 환원 및 식물 영양분 공급) 인과 추론 일치]","explanation":"🎉 **[처방 성공! 인과 추론 정답]** 4문단에서 곰팡이와 세균(분해자)이 사체의 유기물을 무기물로 쪼개어 흙으로 돌려보내야 식물이 영양분을 흡수할 수 있다고 했으므로 정확한 추론이에요!"},{"no":4,"text":"세계 최초의 항생제인 페니실린은 세균계에 속하는 유산균에서 추출한 물질로 만들어졌다.","is_correct":false,"formula":"오답 공식 [D4 대상 속성 교차 치환]: '푸른곰팡이(균계)'를 '유산균(세균계)'으로 바꿔치기","explanation":"❌ **[D4 속성 교차 함정]** 페니실린은 세균계인 유산균이 아니라 균계에 속하는 **'푸른곰팡이'**에서 추출한 물질로 만들었어요."},{"no":5,"text":"식물이 땅속 영양분을 먼저 모두 흡수했기 때문에 그 결과로 곰팡이가 죽은 생물의 사체를 유기물로 합성하는 것이다.","is_correct":false,"formula":"오답 공식 [D1 인과 역전 & 방향 왜곡]: [곰팡이의 유기물➔무기물 분해 ➔ 식물 영양분 흡수]를 거꾸로 서술","explanation":"❌ **[D1 인과 역전 함정]** 곰팡이가 먼저 유기물을 무기물로 분해해 주어야 식물이 영양분을 흡수할 수 있어요!"}]},{"q_no":3,"archetype":"CSAT-READ-V2-3 (<보기> 해수 온도·산호초 백화율 다중 도표 결합 추론형 - 5지선다)","stem":"윗글의 ‘생태계 상호작용 및 인과 추론 원리’를 바탕으로 <보기>의 산호초 백화 현상 조사 자료를 이해한 내용으로 적절하지 <u>않은</u> 것은?","bogi":"<보기> [A 해역의 산호초 백화 현상과 어류 종 수 변화]\\n  산호는 몸속에 사는 ‘공생 조류(식물성 플랑크톤)’에게 서식처와 이산화 탄소를 제공하고, 공생 조류는 광합성으로 만든 영양분을 산호에게 공급한다. 그러나 바닷물 수온이 평년보다 +1.5℃ 이상 높아지는 고수온 현상이 지속되면 공생 조류가 독성 물질을 내뿜게 되고, 산호는 공생 조류를 몸 밖으로 내보내 하얀 석회질 골격만 남는 ‘백화 현상’을 겪다 사멸한다.\\n  • 2019년(수온 편차 +0.3℃): 건강한 산호 82% / 백화 산호 8% / 서식 어류 145종\\n  • 2022년(수온 편차 +2.1℃): 건강한 산호 35% / 백화 산호 52% / 서식 어류 88종\\n  • 2023년(수온 편차 +2.4℃): 건강한 산호 18% / 백화 산호 68% / 서식 어류 54종","options":[{"no":1,"text":"2019년에는 수온 편차가 +0.3℃로 임계치(+1.5℃)보다 낮아 산호와 공생 조류의 상리 공생이 안정적으로 유지되었겠군.","is_correct":false,"formula":"적절한 추론: [2019년 +0.3℃ < +1.5℃] ➔ 건강한 산호 82% 유지","explanation":"⭕ **적절한 이해예요!** 수온 편차가 +1.5℃ 미만일 때는 공생 관계가 잘 유지됩니다."},{"no":2,"text":"2022년과 2023년에 백화 산호 비율이 50%를 넘어선 것은 고수온 현상으로 인해 산호가 공생 조류를 몸 밖으로 배출했기 때문이겠군.","is_correct":false,"formula":"적절한 추론: [고수온(+2.1℃, +2.4℃) ➔ 공생 조류 배출 ➔ 백화 비율 급증]","explanation":"⭕ **적절한 이해예요!** +1.5℃ 이상 고수온이 나타나 산호가 공생 조류를 내보낸 결과입니다."},{"no":3,"text":"2022년에서 2023년 사이에 서식 어류 종 수가 54종으로 급감한 까닭은, 어류와 산호가 먼저 사라졌기 때문에 그 결과로 바닷물의 수온 편차가 +2.4℃까지 올라갔기 때문이겠군.","is_correct":true,"formula":"정답(부적절) - 오답 공식 [D1 인과 역전 함정]: [수온 상승(원인) ➔ 산호 백화·어류 급감(결과)]을 정반대로 뒤집음!","explanation":"🎉 **[처방 성공! D1 인과 역전 함정 완벽 간파]** 산호와 어류가 사라져서 수온이 올라간 것이 아니라, **수온이 +2.4℃까지 올라갔기 때문에(원인) 산호가 백화 현상을 겪고 서식처를 잃은 어류 종 수가 급감(결과)**한 것입니다!"},{"no":4,"text":"평상시에 산호에게 광합성으로 만든 영양분을 공급하는 주체는 산호 자신이 아니라 몸속의 ‘공생 조류’이겠군.","is_correct":false,"formula":"적절한 추론: [D5 주객 전도 방어 확인 - 광합성 주체 = 공생 조류]","explanation":"⭕ ** escription_clinic":{"rx_title":"박지호 맞춤 처방전 #RX-G6-D5: [주술·부사어 호응 3대 공식 ➔ 3단계 퇴고 매트릭스 조립 ➔ D1·D5 퇴고 함정 백신]","rx_reason":"수능 ‘화법과 작문’ 고쳐쓰기 문항과 6학년 문법 성취기준(\`[6국04-05]\`)의 핵심인 **호응 규칙** 및 **3단계 퇴고(내용·조직·표현)**를 완벽히 체화하는 클리닉을 처방합니다.","step0_remedial":{"badge":"[선행 징검다리 복습] G6-COM-A2 수능 필수 주어-서술어·부사어 호응 3대 공식","rule_box":"💡 **호응 3대 공식**: ① **‘내 생각은 / 핵심 원리는 / 문제점은 ~ 때문이다(❌) ➔ ~ 것이다(⭕)’**, ② **‘왜냐하면 ~ 때문이다(⭕)’**, ③ **‘결코 / 전혀 / 비록 ~ 없다/아니다/할지라도(⭕)’**","mini_question":"“북극 해빙이 빠르게 줄어드는 가장 큰 원인은 지구온난화로 기온이 ( ).” — 괄호에 알맞은 서술어는?","choices":["높아졌기 때문이다 (❌ 주술 불호응)","높아진 것이다 (⭕ '원인은 ~ 것이다' 호응)"],"correct":"높아진 것이다 (⭕ '원인은 ~ 것이다' 호응)","feedback":"완벽합니다! 주어 ‘원인은’은 서술어 ‘~것이다’(또는 ‘~점이다’)와 호응해야 문법적으로 바른 문장이 됩니다."},"step1_2_drill":{"badge":"[본 처방 훈련] G6-EXP-W5 설명문 3단계 퇴고(내용·조직·표현) 점검 매트릭스 조립","passage_snippet":"① <span class='rx-cue' data-tip='내용 수준: 객관적 통계 보충'>[내용 수준]</span> ‘온실가스가 많이 늘었다’처럼 막연한 진술은 구체적인 통계 수치로 보충한다. ② <span class='rx-cue' data-tip='조직 수준: 통일성 위배 삭제 & 접속어 점검'>[조직 수준]</span> 문단 중심 생각에서 벗어난 문장(통일성 위배)은 삭제하고, 앞뒤 문장 관계(인과 ‘따라서’ vs 역접 ‘그러나’)에 맞는 접속부사를 쓴다. ③ <span class='rx-cue' data-tip='표현 수준: 주어-서술어 호응 교정'>[표현 수준]</span> 주어 ‘핵심 원리는’과 호응하지 않는 서술어 ‘~까닭이다’를 ‘~것이다’로 고친다.","think_aloud_prompt":"노란색 3단계 퇴고 단서를 확인하고, 각 오류를 고치는 방법을 조립해 보세요!","cloze_sentences":["• [내용 수준]: 막연한 설명을 뒷받침하기 위해 구체적인 ( {b1} ) 자료를 추가함","• [조직 수준]: 문단의 중심 내용에서 벗어난 문장은 글의 ( {b2} )을 해치므로 과감히 삭제함","• [표현 수준]: 주어 ‘핵심 원리는’과 서술어 ‘~까닭이다’의 ( {b3} ) 오류를 ‘~것이다’로 교정함"],"blanks":[{"id":"b1","correct":"통계 수치(근거)","options":["통계 수치(근거)","주관적 감상","유행어"]},{"id":"b2","correct":"통일성","options":["통일성","글자 수","글씨체"]},{"id":"b3","correct":"주어-서술어 호응","options":["주어-서술어 호응","높임법","시간 표현"]}]},"step3_vaccine":{"badge":"[오답 함정 백신 드릴] D1(접속어 역전 수정) & D5(호응 오류 미탐지) 참/거짓 판별하기","desc":"수능 퇴고 문항에서는 ‘원래 올바른 접속어를 틀린 접속어로 고치자’고 속이는 함정(D1)이 자주 나옵니다!","items":[{"statement":"“바닷물은 햇빛의 90%를 흡수한다. 따라서 얼음이 녹아 바닷물이 드러나면 수온이 더 빨리 오른다.”에서 ‘따라서’를 역접 접속어 ‘그러나’로 고쳐야 한다.","answer":"X","reason":"함정 포착! [D1 접속어 역전 수정 함정]입니다. 앞 문장(원인)과 뒷문장(결과)은 인과 관계이므로 원래 쓰인 ‘따라서’가 정확히 맞습니다!"},{"statement":"“기후 위기를 막는 핵심 원리는 온실가스 배출량을 줄이는 까닭이다.”에서 ‘줄이는 까닭이다’를 ‘줄이는 것이다’로 고쳐 주어-서술어 호응을 맞춘다.","answer":"O","reason":"정확합니다! 주어 ‘원리는’에 호응하도록 서술어를 ‘~것이다’로 고친 모범적인 퇴고입니다."}]}},"real_csat_test":{"test_title":"[실전 수능 대비 5지선다] 초6 과학·사회·국어 ‘지구의 열수지 균형과 북극 해빙 감소에 따른 알베도 되먹임’","passage_spec":"6문단 · 865자 · 204어절 · KReaD 1355 · 열수지 모식도 + 퇴고 구간(㉠~㉤) 결합 · 5지선다","passage_title":"지구의 열수지 균형과 북극 해빙 감소에 따른 알베도 되먹임","paragraphs":["지구는 태양으로부터 끊임없이 열에너지를 받지만, 지구의 연평균 기온은 오랫동안 일정한 수준을 유지해 왔다. 이는 지구가 태양으로부터 흡수하는 <span class='cue-span' data-cue='g6-c1'>‘태양 복사 에너지’의 양과 지구가 우주 공간으로 다시 내보내는 ‘지구 복사 에너지’의 양이 서로 같아 ‘열수지(Heat Budget) 균형’</span>을 이루고 있기 때문이다.","지구의 대기권에 있는 수증기, 이산화 탄소, 메탄 같은 온실가스는 태양에서 들어오는 빛은 쉽게 통과시키지만, 지표면에서 우주로 나가는 지구 복사 에너지의 일부를 흡수했다가 지표면으로 다시 되돌려보내는 ‘온실효과’를 일으킨다. 적당한 온실효과는 지구의 평균 기온을 약 15℃로 유지해 생물이 살기에 알맞은 환경을 만들어 준다. 그러나 산업 혁명 이후 화석 연료 사용이 급증하면서 대기 중 온실가스 농도가 지나치게 높아졌고, ㉠<u>우주로 빠져나가야 할 열에너지가 대기 중에 갇히면서 지구의 평균 기온이 상승하는 ‘지구온난화’가 심화되고 있다.</u>","더욱 심각한 문제는 지구온난화가 북극의 바다얼음(해빙)을 녹이면서 온난화 속도를 스스로 더욱 재촉하는 <span class='cue-span' data-cue='g6-c2'>‘양(+)의 되먹임(Positive Feedback)’</span> 현상을 일으킨다는 점이다. 지표면이나 물체가 태양빛을 반사하는 비율을 ‘알베도(Albedo, 반사율)’라고 한다. <span class='cue-span' data-cue='g6-c3'>새하얀 눈과 바다얼음은 알베도가 약 80%에 달해 들어오는 태양빛의 대부분을 우주로 반사한다. 반면에 검푸른 바닷물은 알베도가 약 10%에 불과하여 태양빛의 90%를 그대로 흡수</span>한다.","㉡<u>따라서</u> 지구온난화로 북극의 하얀 바다얼음이 녹아 줄어들면, 그 자리에 알베도가 낮은 검푸른 바닷물이 넓게 드러나게 된다. ㉢<u>북극곰이 얼음 위에서 헤엄치는 모습은 다큐멘터리 영화에서 매우 인상적인 장면을 연출한다.</u> 드러난 바닷물은 이전보다 훨씬 더 많은 태양 복사 에너지를 흡수하게 되고, 이는 다시 북극 바다의 수온을 높여 남아 있는 바다얼음을 더욱 빠르게 녹인다.","결국 ‘기온 상승 ➔ 바다얼음 감소 ➔ 지표면 평균 알베도 하락 ➔ 태양열 흡수량 증가 ➔ 기온 추가 상승’이라는 악순환의 고리가 형성되는 것이다. ㉣<u>이처럼 북극 해빙을 지켜야 하는 핵심 원리는</u> 해빙이 거대한 거울처럼 태양열을 반사하여 지구의 열수지 균형을 지켜 주는 방패 역할을 ㉤<u>수행하기 까닭이다.</u>","따라서 기후 위기의 악순환을 끊어 내기 위해서는 재생 에너지 전환과 산림 복원을 통해 대기 중 온실가스 배출량을 줄이고, 북극 해빙이 더 이상 급격히 사라지지 않도록 국제 사회가 함께 노력해야 한다."],"vocab_notes":[{"word":"열수지(Heat Budget)","tier":"Tier 3 (과학 전문어)","desc":"지구가 흡수하는 태양 복사 에너지와 방출하는 지구 복사 에너지의 수입·지출 균형"},{"word":"알베도(Albedo)","tier":"Tier 3 (과학 전문어)","desc":"물체 표면이 받은 태양빛 가운데 반사하는 빛의 비율(반사율)"},{"word":"양(+)의 되먹임","tier":"Tier 2/3 (학술 개념어)","desc":"어떤 현상의 결과가 다시 원인을 강화하여 처음의 변화가 점점 더 커지는 연쇄 작용"}],"visual_html":"\\n              <div style=\\"background:#EFF6FF; border:1px solid #93C5FD; border-radius:10px; padding:12px; margin:12px 0;\\">\\n                <div style=\\"font-weight:800; font-size:0.86rem; color:#1E3A8A; margin-bottom:8px;\\">🔄 [시각 모식도] 북극 해빙 알베도 비교 및 양(+)의 되먹임 인과 루프</div>\\n                <div style=\\"display:grid; grid-template-columns:1fr 1.3fr; gap:10px; font-size:0.8rem;\\">\\n                  <div style=\\"background:#fff; padding:9px; border-radius:8px; border:1px solid #BFDBFE;\\">\\n                    <b>☀️ 표면별 알베도(반사율) 비교</b><br>\\n                    • 🧊 <b>하얀 바다얼음(해빙):</b> 반사 <b>80%</b> / 흡수 20%<br>\\n                    • 🌊 <b>검푸른 바닷물(해수):</b> 반사 <b>10%</b> / 흡수 <b>90%</b>\\n                  </div>\\n                  <div style=\\"background:#FFF1F2; padding:9px; border-radius:8px; border:1px solid #FECDD3; color:#881337;\\">\\n                    <b>🔥 양(+)의 되먹임 연쇄 사슬</b><br>\\n                    기온 상승 ➔ 해빙 면적 감소 ➔ 북극 평균 <b>알베도 하락</b> ➔ 태양 에너지 <b>흡수량 증가</b> ➔ 수온·기온 <b>더욱 상승!</b>\\n                  </div>\\n                </div>\\n              </div>\\n            ","questions":[{"q_no":1,"archetype":"CSAT-WRIT-W5 (수능 화법과 작문 전형: 내용·조직·표현 3단계 통합 고쳐쓰기 - 5지선다)","stem":"윗글은 학생이 작성한 과학 설명문 초고이다. ㉠~㉤을 고쳐 쓰기 위한 방안으로 적절하지 <u>않은</u> 것은?","bogi":null,"options":[{"no":1,"text":"㉠: 지구온난화의 실태를 객관적 수치로 뒷받침하기 위해 ‘지난 100년간 지구의 평균 기온이 약 1.1℃ 상승했다’는 기상청 통계 자료를 보충한다.","is_correct":false,"formula":"타당한 퇴고: [내용 수준 - 공신력 있는 통계 수치 보강]","explanation":"⭕ **적절한 고쳐쓰기 방안이에요!** 객관적 통계 수치를 보충하면 설명의 설득력과 정확성이 높아져요."},{"no":2,"text":"㉡: 앞 문장(얼음과 바닷물의 반사율 차이)과 뒷문장(얼음 감소 시 바닷물 노출)이 서로 반대되는 역접 관계이므로, ‘따라서’를 ‘그러나’로 고친다.","is_correct":true,"formula":"정답(부적절) - 오답 공식 [D1 접속어 역전 수정 함정]: 올바른 인과 표지('따라서')를 역접('그러나')으로 잘못 고치라고 유도","explanation":"🎉 **[처방 성공! D1 접속어 함정 격파]** ㉡의 앞 문장은 원인 원리이고 뒷문장은 그에 따른 결과이므로 인과 접속부사 **'따라서'가 정확히 맞아요.** 이를 '그러나'로 고치면 오히려 글의 논리적 응집성이 깨져요!"},{"no":3,"text":"㉢: 4문단의 중심 내용인 ‘해빙 감소에 따른 태양열 흡수량 증가와 온난화 가속화’에서 벗어나 문단의 통일성을 해치므로 삭제한다.","is_correct":false,"formula":"타당한 퇴고: [조직 수준 - 통일성 위배 문장 삭제]","explanation":"⭕ **적절한 고쳐쓰기 방안이에요!** 북극곰 다큐멘터리 감상 문장(㉢)은 문단 중심 생각과 어긋나므로 삭제해야 통일성이 살아나요."},{"no":4,"text":"㉣, ㉤: 주어인 ‘핵심 원리는’과 서술어인 ‘수행하기 까닭이다’가 서로 호응하지 않으므로, ㉤을 ‘수행하기 때문이다’ 또는 ‘수행한다는 점이다(것이다)’로 고친다.","is_correct":false,"formula":"타당한 퇴고: [표현 수준 - \`[6국04-05]\` 주어-서술어 호응 오류 교정]","explanation":"⭕ **적절한 고쳐쓰기 방안이에요!** 처방 클리닉에서 훈련한 \`[원리는 ➔ ~것이다/점이다]\` 호응 규칙이 정확히 적용되었어요."},{"no":5,"text":"6문단에서 국제 협력의 필요성을 강조하기 위해 ‘기후 위기는 결코 한 국가만의 노력으로는 해결할 수 없다’와 같이 부사어 ‘결코’와 부정 표현이 호응하는 문장을 덧붙인다.","is_correct":false,"formula":"타당한 퇴고: [표현 수준 - 부정 극성 부사어 '결코'와 부정 서술어 '없다'의 호응]","explanation":"⭕ **적절한 고쳐쓰기 방안이에요!** 부사어 '결코'는 부정 서술어('~없다')와 정확히 호응해요."}]},{"q_no":2,"archetype":"CSAT-READ-V2-2 (수능 독서 과학 전형: 다단계 연쇄 인과 및 비례 추론형 - 5지선다)","stem":"윗글을 바탕으로 ‘지구의 열수지’와 ‘북극의 알베도 변화’를 이해한 내용으로 가장 적절한 것은?","bogi":null,"options":[{"no":1,"text":"대기 중에 온실가스가 전혀 없어야만 지구의 연평균 기온이 생물이 살기 좋은 15℃로 유지될 수 있다.","is_correct":false,"formula":"오답 공식 [D3 극단적 부정 왜곡]: 2문단 '적당한 온실효과는 평균 기온을 약 15℃로 유지해 준다'와 반대","explanation":"❌ **[D3 극단적 왜곡 함정]** 2문단에서 **적당한 온실효과**가 있어야 지구 평균 기온이 약 15℃로 유지된다고 했어요."},{"no":2,"text":"북극의 바다얼음 면적이 넓어질수록 북극 표면의 평균 알베도는 낮아지고 바닷물의 태양열 흡수량은 증가한다.","is_correct":false,"formula":"오답 공식 [D2 비례·반비례 방향 역전]: 바다얼음(알베도 80%)이 넓어지면 평균 알베도는 '높아짐'","explanation":"❌ **[D2 비례 방향 역전 함정]** 반사율이 80%인 바다얼음이 넓어지면 평균 알베도는 **높아지고** 태양열 흡수량은 **줄어들어요**."},{"no":3,"text":"지구온난화가 심화되어 북극 해빙이 녹을수록 북극 지역이 우주로 반사하는 태양 복사 에너지의 비율은 점차 감소할 것이다.","is_correct":true,"formula":"정답 공식: [해빙(반사율 80%) 감소 ➔ 바닷물(반사율 10%) 노출 ➔ 태양빛 반사 비율 감소 연쇄 인과 일치]","explanation":"🎉 **[처방 성공! 연쇄 인과 추론 정답]** 반사율이 80%인 해빙이 녹고 반사율이 10%인 바닷물이 드러나므로, 우주로 반사하는 태양 복사 에너지의 비율(알베도)은 **점차 감소**해요!"},{"no":4,"text":"지구가 흡수하는 태양 복사 에너지양보다 방출하는 지구 복사 에너지양이 계속 더 많아질 때 지구온난화가 발생한다.","is_correct":false,"formula":"오답 공식 [D1·D2 인과 조건 역전]: 방출량 ,"part_a_options":[{"no":1,"text":"우주로 반사되는 태양빛의 비율(알베도)은 낮아지고 바닷물이 흡수하는 태양열의 양은 늘어난다.","is_correct":true},{"no":2,"text":"우주로 반사되는 태양빛의 비율(알베도)이 80%에서 90%로 더 높아져 기온이 내려간다.","is_correct":false},{"no":3,"text":"태양 복사 에너지 흡수량보다 지구 복사 에너지 방출량이 더 많아져 열수지 균형이 회복된다.","is_correct":false},{"no":4,"text":"바닷물이 태양빛을 100% 반사하여 주변 바다얼음이 다시 두껍게 얼어붙는다.","is_correct":false}],"part_b_stem":"[Part B] 위 Part A의 판단 근거가 되는 ‘알베도 수치 대조 문장’을 3문단에서 고르세요.","part_b_options":[{"no":1,"text":"1문단: “지구는 태양으로부터 끊임없이 열에너지를 받지만, 지구의 연평균 기온은 오랫동안 일정한 수준을 유지해 왔다.”","is_correct":false},{"no":2,"text":"2문단: “적당한 온실효과는 지구의 평균 기온을 약 15℃로 유지해 생물이 살기에 알맞은 환경을 만들어 준다.”","is_correct":false},{"no":3,"text":"3문단: “새하얀 눈과 바다얼음은 알베도가 약 80%에 달해 들어오는 태양빛의 대부분을 우주로 반사한다. 반면에 검푸른 바닷물은 알베도가 약 10%에 불과하여 태양빛의 90%를 그대로 흡수한다.”","is_correct":true}],"explanation":"🔗 **[EBSR 근거 연결 성공]** 3문단의 알베도 수치 대조(얼음 반사 80% vs 바닷물 반사 10%·흡수 90%)를 근거로 4~5문단의 연쇄 인과를 완벽히 추론했어요!"},"writing_workbench":{"mode":"red_pen_proofreader","code":"G6-EXP-W5","title":"[TEI-7 인라인 빨간펜 교정부호 퇴고 에디터] 초고 ㉠~㉤ 3단계(내용·조직·표현) 직접 첨삭하기","conditions":["조건 ①: 통일성을 해치는 문장(㉢)에는 [빼기(삭제) 부호]를 적용할 것","조건 ②: 주어(‘핵심 원리는’)와 호응하지 않는 서술어(㉤)에는 [고치기 부호]를 적용해 ‘수행한다는 점이다(것이다)’로 교정할 것","조건 ③: 인과 관계가 자연스러운 접속부사(㉡ ‘따라서’)는 잘못 고치지 말고 유지할 것"],"proofread_items":[{"marker":"㉠","tier":"1단계: 내용 수준 (근거 보충)","original":"우주로 빠져나가야 할 열에너지가 대기 중에 갇히면서 지구의 평균 기온이 상승하는 ‘지구온난화’가 심화되고 있다.","action_label":"➕ [넣기 부호] 기상청 통계(‘지난 100년간 평균 기온 1.1℃ 상승’) 보충하기","corrected":"우주로 빠져나가야 할 열에너지가 대기 중에 갇히면서 지난 100년간 지구의 평균 기온이 약 1.1℃ 상승하는 등 ‘지구온난화’가 심화되고 있다.","status_note":"객관적 통계 수치를 추가하여 설명의 정확성과 신뢰성을 높임"},{"marker":"㉡","tier":"2단계: 조직 수준 (접속부사 검증 — 함정 주의!)","original":"따라서 지구온난화로 북극의 하얀 바다얼음이 녹아 줄어들면, 그 자리에 알베도가 낮은 검푸른 바닷물이 넓게 드러나게 된다.","action_label":"✅ [유지하기] 앞뒤 인과 관계가 맞으므로 ‘따라서’ 그대로 유지 (‘그러나’로 변경 금지!)","corrected":"따라서 지구온난화로 북극의 하얀 바다얼음이 녹아 줄어들면, 그 자리에 알베도가 낮은 검푸른 바닷물이 넓게 드러나게 된다.","status_note":"[D1 함정 방어] 원래 올바른 인과 표지 ‘따라서’를 역접 ‘그러나’로 바꾸면 오답!"},{"marker":"㉢","tier":"2단계: 조직 수준 (문단 통일성)","original":"북극곰이 얼음 위에서 헤엄치는 모습은 다큐멘터리 영화에서 매우 인상적인 장면을 연출한다.","action_label":"✂️ [빼기(삭제) 부호] 4문단 중심 생각(알베도 하락과 열 흡수 증가)에서 벗어난 문장 삭제","corrected":"(삭제됨 — 문단 통일성 회복 완료)","status_note":"중심 내용과 무관한 감상 문장을 삭제하여 문단의 통일성을 확보함"},{"marker":"㉣·㉤","tier":"3단계: 표현 수준 (\`[6국04-05]\` 주어-서술어 호응)","original":"이처럼 북극 해빙을 지켜야 하는 핵심 원리는 해빙이 거대한 거울처럼 태양열을 반사하여 지구의 열수지 균형을 지켜 주는 방패 역할을 수행하기 까닭이다.","action_label":"🖍️ [고치기 부호] 주어 ‘원리는’에 호응하도록 ‘수행하기 까닭이다’ ➔ ‘수행한다는 점이다(것이다)’로 교정","corrected":"이처럼 북극 해빙을 지켜야 하는 핵심 원리는 해빙이 거대한 거울처럼 태양열을 반사하여 지구의 열수지 균형을 지켜 주는 방패 역할을 수행한다는 점이다.","status_note":"[핵심 원리는 ~ 점이다/것이다] 주어-서술어 호응 오류 완벽 교정!"}],"draft_prefix":"[학생 초고 4~5문단 실시간 빨간펜 퇴고 점검]","choices":[{"id":"w-1","text":"㉠에 구체적 기온 상승 통계를 보충(내용)하고, ㉡의 ‘따라서’는 인과 관계에 맞으므로 유지하며, ㉢은 통일성에 어긋나므로 삭제(조직)하고, ㉤은 주어 ‘원리는’과 호응하도록 ‘수행한다는 점이다’로 고친다(표현).","is_correct":true,"cond_check":[true,true,true],"feedback":"🎉 수능 화법과 작문 만점 수준의 완벽한 3단계(내용·조직·표현) 퇴고입니다!"},{"id":"w-2","text":"㉡의 ‘따라서’를 역접 접속어 ‘그러나’로 고치고, ㉢의 북극곰 영화 문장은 흥미를 위해 그대로 둔다.","is_correct":false,"cond_check":[false,false,false],"feedback":"❌ ㉡은 인과 관계이므로 ‘따라서’가 맞고(D1 함정), ㉢은 통일성을 해치므로 반드시 삭제해야 합니다(D5 함정)!"}]},"question_scaffolding":[{"q_no":1,"target_para_idx":3,"spotlight_quote":"㉡따라서 지구온난화로 북극의 하얀 바다얼음이 녹아 줄어들면, 그 자리에 알베도가 낮은 검푸른 바닷물이 넓게 드러나게 된다.","step1_hint":"잠깐! 이 문항은 고쳐 쓰기 방안으로 적절하지 ‘않은’ 것을 고르는 문제예요! 4문단 첫머리의 ㉡‘따라서’ 앞뒤 문장 관계를 스포트라이트 구간에서 확인해 보세요.","step2_hint":"3문단(얼음은 반사율 80%, 바닷물은 반사율 10%) ➔ 4문단(얼음이 녹으면 알베도가 낮은 바닷물이 드러남)은 자연스러운 인과 연결이에요! 원래 맞는 ‘따라서’를 ‘그러나’로 고치라는 선지를 찾아보세요."},{"q_no":2,"target_para_idx":2,"spotlight_quote":"새하얀 눈과 바다얼음은 알베도가 약 80%에 달해 들어오는 태양빛의 대부분을 우주로 반사한다. 반면에 검푸른 바닷물은 알베도가 약 10%에 불과하여 태양빛의 90%를 그대로 흡수한다.","step1_hint":"잠깐! 3문단의 노란색 스포트라이트 문장과 아래 [시각 모식도]에서 바다얼음(80%)과 바닷물(10%)의 알베도(반사율) 수치를 대조해 보세요!","step2_hint":"반사율 80%인 바다얼음이 녹아서 줄어들고 반사율 10%인 바닷물이 넓어지면, 북극이 우주로 반사하는 태양 복사 에너지의 비율은 어떻게 될까요?"}]}}]`),Yu=JSON.parse('{"expository":[{"code":"G1-EXP-V1-1","grade":"1학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-1 내용 확인 (명시적 정보·대상·사실 식별)","sub_skill_name":"내용 확인 (대상과 특징·세부 정보 식별)","curriculum_basis":"`[2국02-02]`(글을 읽고 중심 내용을 확인한다), `CCSS RI.1.1`(텍스트의 핵심 세부사항에 대해 질문하고 답하기), `PIRLS`(명시적 정보 인출), Kintsch 미시명제(Micro-proposition) 어휘-지시대상 매핑 이론.","dc_step1":"그림과 함께 제시된 2~4문장의 짧은 정보글에서 글 전체에 반복되거나 제목·첫 문장에 제시된 ‘설명 대상(사물·동물·식물)의 이름’ 낱말을 찾는다.","dc_step2":"찾은 대상의 이름 뒤에 이어지는 색깔, 모양, 크기, 소리, 사는 곳 등을 나타내는 설명 낱말(형용사·동사구)을 대상과 1:1로 짝짓는다.","dc_step3":"글에 직접 쓰여 있는 대상의 이름과 겉모습·특징 정보를 누락 없이 골라내어 질문에 답하거나 말풍선·빈칸에 옮겨 적는다.","mager_reading":"[조건] 동식물이나 주변 사물을 소개하는 3~4문장의 그림 결합 설명글이 주어졌을 때, [준거] 글에서 설명하는 대상의 이름 1가지와 글에 명시된 겉모습·특징 정보 2가지 이상을 본문 낱말 그대로 정확히, [행동] 찾아 동그라미를 치거나 선으로 연결할 수 있다.","mager_writing":"[조건] 방금 읽은 사물 소개 글과 ‘무엇(이름)-어떤 모양/색깔’ 빈칸 카드가 주어졌을 때, [준거] 본문에 명시된 낱말을 사용하여 받침과 띄어쓰기 오류 1개 이하로, [행동] 대상의 이름과 핵심 특징 2가지를 완성된 단문(“○○은 ~합니다.”)으로 또박또박 옮겨 쓰거나 구두로 발표할 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V1-1 ➔ G2-EXP-V1-1","horizontal_link":"[공통기초 결합] A1(해독·어휘·형태소), A2(감각어·기초어휘) | ➔ [쓰기 W2 전이] 읽기에서 포착한 장르별 필수 요소(대상/인물/경험/개념/주장·근거)를 내 글의 내용 생성 항목으로 전환"},{"code":"G1-EXP-V1-2","grade":"1학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-2 관계 확인 (지시·인과·문장골격·비유·중심세부 관계)","sub_skill_name":"관계 확인 (문단 내 중심-세부, 어휘 위계, 문장 골격, 지시·인과 관계)","curriculum_basis":"`[2국02-02]`(낱말과 문장의 관계를 생각하며 읽기), `[2국04-02]`(낱말들을 분류하고 관계 파악하기 기초), `CCSS RI.1.3 & RI.1.7`(두 개체·사건·아이디어 간의 연결 및 그림과 설명의 관계 파악).","dc_step1":"짧은 설명글에서 그림의 각 부분(예: 코끼리의 코, 귀, 다리)을 가리키는 낱말과 앞 문장의 대상을 다시 가리키는 쉬운 지시어(‘이것은, 이 동물은’)를 찾는다.","dc_step2":"지시어(‘이것은’)가 바로 앞 문장의 어떤 사물·동물을 가리키는지 화살표로 연결하고, 그림의 세부 부분과 설명 문장을 짝짓는다.","dc_step3":"전체 대상(예: 동물)과 개별 이름(예: 강아지, 고양이)의 기초 묶음 관계를 확인하고 그림-문장 관계를 설명한다.","mager_reading":"[조건] 그림과 3~4문장으로 된 사물·동물 설명글이 주어졌을 때, [준거] 문장 속 지시어(‘이것은/이 동물은’)가 가리키는 앞 문장의 대상 낱말 1개와 그림의 세부 부위를 설명하는 문장 2개 이상을 정확히, [행동] 화살표나 선으로 연결할 수 있다.","mager_writing":"[조건] 대상의 전체 그림과 세부 부위 낱말 카드가 주어졌을 때, [준거] 전체 이름과 부분 특징을 연결하여 지시어나 조사(‘은/는, 이/가’)를 바르게 사용한 2문장 이상으로, [행동] 바꾸어 쓰거나 말할 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V1-2 ➔ G2-EXP-V1-2","horizontal_link":"[공통기초 결합] A1(상하위·단어관계), A3(문장골격 주·목·서), A4(지시어·접속어), A5(명시적 인과) | ➔ [쓰기 W3·W4 전이] 텍스트 내 관계(비유/인과/경험-감상/중심-뒷받침/주장-근거) 원리를 내 문단 연결 및 문장 구성에 적용"},{"code":"G1-EXP-V1-3","grade":"1학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-3 구조 확인 (갈래별 미시·거시 텍스트 구조 도해)","sub_skill_name":"구조 확인 (설명 방법 및 거시적 텍스트 구조 도해)","curriculum_basis":"`[2국02-02]`(글의 짜임 기초 인식), `CCSS RI.1.5`(제목, 목차, 글상자 등 정보 위치 파악을 위한 텍스트 구조적 특징 활용), 영국 NC Year 1(순서대로 배열된 안내 정보 인식).","dc_step1":"짧은 안내문이나 정보글에서 ‘제목’과 번호(①, ②, ③) 또는 순서를 나타내는 말(‘첫째, 둘째 / 처음에, 다음에’)을 찾는다.","dc_step2":"번호나 순서를 나타내는 말에 따라 그림과 설명 문장이 어떤 차례로 이어지는지 연결한다.","dc_step3":"뒤섞인 설명 그림이나 문장 카드를 글의 순서에 맞게 차례대로 배열한다.","mager_reading":"[조건] 손 씻기나 놀이 방법을 알려 주는 3~4단계의 그림 결합 안내글이 주어졌을 때, [준거] 글의 ‘제목’ 위치와 1~3단계의 설명 순서를 100% 정확히, [행동] 찾아 번호를 매기거나 순서대로 가리킬 수 있다.","mager_writing":"[조건] 순서가 뒤섞인 3~4장의 과정 그림과 빈칸 안내판이 주어졌을 때, [준거] 일의 차례에 맞게 그림을 배열하고 ‘먼저, 다음에, 마지막으로’ 중 2개 이상을 사용하여, [행동] 순서 안내글의 빈칸을 완성할 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V1-3 ➔ G2-EXP-V1-3","horizontal_link":"[공통기초 결합] A4(담화 전환 표지), A5(선후·인과·구조), A6(문단 짜임) | ➔ [쓰기 W3 직결] 읽기에서 완성한 \'갈래별 구조 도해조직자\'를 내 글의 \'개요 설계 틀(Graphic Organizer)\'로 1:1 미러링"},{"code":"G1-EXP-V1-4","grade":"1학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-4 요약 및 주제 확인 (핵심 골격 간추리기·주제·제목)","sub_skill_name":"요약 및 주제 확인 (중심 내용 간추리기 & 제목 붙이기)","curriculum_basis":"`[2국02-02]`(글을 읽고 중심 내용을 확인한다), `CCSS RI.1.2`(텍스트의 핵심 주제[Main topic]를 확인하고 핵심 세부사항을 다시 말하기).","dc_step1":"3~4문장의 짧은 설명글에서 가장 많이 나오거나 글 전체가 설명하고 있는 ‘중심 낱말(대상)’을 찾는다.","dc_step2":"중심 낱말이 들어 있는 문장들 가운데 글 전체의 내용을 가장 잘 말해 주는 문장 1개를 고른다.","dc_step3":"고른 중심 낱말을 넣어 글에 어울리는 짧은 제목(‘○○의 특징 / 귀여운 ○○’)을 만든다.","mager_reading":"[조건] 제목이 가려진 3~4문장의 사물·동식물 설명글이 주어졌을 때, [준거] 글에서 가장 중요한 중심 낱말 1개와 글 전체를 대표하는 문장 1개를 100% 정확히, [행동] 찾아내고 가장 알맞은 제목을 고를 수 있다.","mager_writing":"[조건] 제목이 없는 3~4문장의 설명글이 주어졌을 때, [준거] 글의 중심 낱말(설명 대상)이 반드시 들어가게 하여 2~4어절의 알맞은 제목을, [행동] 직접 지어 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V1-4 ➔ G2-EXP-V1-4","horizontal_link":"[공통기초 결합] A3(수식어 삭제·문장골격 추출), A6(중심-세부 위계 및 삭제·선택·일반화·구성 요약) | ➔ [쓰기 W1·W4 전이] 요약한 중심 명제와 제목 짓기 원리를 내 글의 핵심 주제문(Topic Sentence) 및 제목 설정에 적용"},{"code":"G1-EXP-V2-1","grade":"1학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-1 어휘·비유·관용표현·형태소 문맥 추론","sub_skill_name":"학술 어휘·형태소 및 다의어 문맥 추론","curriculum_basis":"`[2국02-02]`(글을 읽고 모르는 낱말의 뜻을 짐작한다), `CCSS RI.1.4 & L.1.4a`(문장 문맥과 그림을 단서로 모르는 낱말·어구의 의미 파악하기).","dc_step1":"짧은 설명글을 읽다가 뜻을 잘 모르는 낱말(예: ‘보호색’, ‘겨울잠’)이 나오면 그 낱말이 들어 있는 문장과 옆의 그림을 살펴본다.","dc_step2":"그림 속 동물의 모습과 그 낱말 앞뒤에 쓰인 쉬운 설명 말(예: “주변 색깔과 비슷해서 눈에 띄지 않는 색”)을 낱말과 연결한다.","dc_step3":"짐작한 낱말의 뜻을 쉬운 말로 바꾸어 보아 문장이 자연스러운지 확인한다.","mager_reading":"[조건] 그림과 함께 제시된 3~4문장의 설명글 속에 1학년 수준에서 낯선 낱말 1~2개가 포함되어 있을 때, [준거] 그림 단서와 앞뒤 말을 활용하여 그 낱말의 알맞은 뜻을 100% 정확히, [행동] 추론하여 고를 수 있다.","mager_writing":"[조건] 방금 뜻을 짐작한 낱말과 빈칸 문장이 주어졌을 때, [준거] 그 낱말의 뜻을 쉬운 일상어로 풀어 말하거나 그 낱말을 넣어 알맞은 짧은 문장 1개를, [행동] 만들 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V2-1 ➔ G2-EXP-V2-1","horizontal_link":"[공통기초 결합] A1(합성어·파생어 어근·접사 분석), A2(다의어·동형어·속담·관용표현 문맥 추론) | ➔ [쓰기 W2·W4 전이] 문맥으로 추론한 비유·다의어·관용표현·학술어를 내 글의 생생하고 설득력 있는 표현 재료로 활용"},{"code":"G1-EXP-V2-2","grade":"1학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-2 생략된 상황·인과·숨은 전제·거시지시어 추론","sub_skill_name":"문단 간 응집성(거시 지시어) 및 생략된 인과·과정 추론","curriculum_basis":"`[2국02-02]`, `CCSS RI.1.3`(두 사건·아이디어 간의 연결 관계 추론), `PIRLS`(직접 추론: Make Straightforward Inferences).","dc_step1":"3~4문장의 짧은 정보·안내글에서 앞 문장의 행동과 뒷문장의 결과를 찾는다.","dc_step2":"자신의 일상 경험(배경지식)을 떠올려 왜 그렇게 해야 하는지(간단한 까닭)를 앞뒤 문장과 연결한다.","dc_step3":"글에 직접 쓰여 있지 않지만 쉽게 알 수 있는 간단한 까닭이나 다음 행동을 짐작한다.","mager_reading":"[조건] 생활 안전이나 동식물 특징을 다룬 3~4문장의 설명글이 주어졌을 때, [준거] 앞뒤 문장과 일상 경험을 연결하여 글에 직접 쓰이지 않은 간단한 까닭(‘왜 그렇게 하는지’)을, [행동] 바르게 추론하여 고를 수 있다.","mager_writing":"[조건] 읽은 안내·정보글에 대한 ‘왜 그럴까요?’ 질문이 주어졌을 때, [준거] 본문 내용과 자신의 경험을 연결하여 “~하기 때문입니다.”라는 1문장으로, [행동] 까닭을 짐작해 말하거나 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V2-2 ➔ G2-EXP-V2-2","horizontal_link":"[공통기초 결합] A4(생략 성분 복원·거시 지시어 역추적), A5(생략된 매개 인과·숨은 전제 추론) | ➔ [쓰기 W3·W5 전이] 생략된 맥락·인과·전제 추론 원리를 통해 내 글의 논리적 비약이나 사건 빈틈을 메우며 조직·퇴고"},{"code":"G1-EXP-V2-3","grade":"1학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-3 인물 심리·화자 정서·시각자료·독자반응 추론","sub_skill_name":"텍스트와 시각 매체 자료 간 통합 추론","curriculum_basis":"`[2국02-02]`, `CCSS RI.1.6 & RI.1.7`(그림이 제공하는 정보와 글이 제공하는 정보를 구별하고 통합하여 핵심 아이디어 설명하기), Mayer(2009) 멀티미디어 학습 인지이론 기초.","dc_step1":"짧은 설명글 옆에 있는 사진·삽화에서 글에는 자세히 쓰여 있지 않은 세부 모습(크기 비교, 주변 환경, 표정·움직임)을 살펴본다.","dc_step2":"글의 설명 문장과 사진·삽화의 세부 모습을 합쳐서 대상이 어떤 상태인지 연결한다.","dc_step3":"글과 그림을 함께 보았을 때 새로 알 수 있는 점을 짐작한다.","mager_reading":"[조건] 사진이나 삽화가 포함된 3~4문장의 설명글이 주어졌을 때, [준거] 글의 내용과 사진·그림의 단서를 결합하여 글에만 쓰인 것보다 더 자세히 알 수 있는 대상의 특징 1가지 이상을, [행동] 추론하여 고를 수 있다.","mager_writing":"[조건] 글과 사진이 함께 있는 정보 카드가 주어졌을 때, [준거] 사진과 글을 함께 보고 알게 된 점을 “그림과 글을 보니 ○○은 ~합니다.”라는 1문장으로, [행동] 말하거나 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V2-3 ➔ G2-EXP-V2-3","horizontal_link":"[공통기초 결합] A2(감정·태도 어휘), A5(상황-반응 내적 인과 연결) | ➔ [쓰기 W1·W4 전이] 화자/인물 심리·시각자료·예상 독자 반응 추론을 바탕으로 독자 맞춤형 표현·시각자료·반론 대응 구사"},{"code":"G1-EXP-V2-4","grade":"1학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-4 작가(필자) 의도·관점·시점·맥락 추론","sub_skill_name":"필자의 집필 목적·예상 독자·관점 추론","curriculum_basis":"`[2국02-04]`(글을 읽고 글쓴이의 마음을 짐작한다), `CCSS RI.1.6 & RI.1.8`(글쓴이가 글을 쓴 이유 확인).","dc_step1":"짧은 설명·안내글의 끝맺는 말(‘~입니다, ~을 알 수 있습니다’)을 살펴본다.","dc_step2":"이 글이 재미있는 옛날이야기를 들려주려는 것인지, 새로운 사실이나 방법을 ‘알려 주려는 것’인지 연결한다.","dc_step3":"글쓴이가 무엇을 알려 주려고 이 글을 썼는지 짐작한다.","mager_reading":"[조건] 사물·동식물을 소개하는 짧은 설명글이 주어졌을 때, [준거] 재미있는 이야기를 꾸며 쓴 글과 구별하여 글쓴이가 이 글을 쓴 까닭(‘새로운 사실을 알려 주려고’)을 100% 정확히, [행동] 추론하여 고를 수 있다.","mager_writing":"[조건] 읽은 설명글에 대해 “글쓴이는 왜 이 글을 썼을까요?”라는 질문이 주어졌을 때, [준거] 설명 대상의 이름을 넣어 “○○에 대해 알려 주려고 썼습니다.”라고, [행동] 바르게 답할 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V2-4 ➔ G2-EXP-V2-4","horizontal_link":"[공통기초 결합] A6(전체 주제 의식 도출), A2(어조·어감 분석) | ➔ [쓰기 W1 직결] 필자의 집필 의도·관점·맥락 추론을 역적용하여 내 글의 집필 목적·서술 시점·관점 수립"},{"code":"G1-EXP-V3-1","grade":"1학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-1 표현·서술 방식 및 근거·시각자료 적절성 평가","sub_skill_name":"설명 방법·표현 및 시각 자료의 적절성 평가","curriculum_basis":"`[2국02-02]`, `CCSS RI.1.7`, `PIRLS`(내용·언어·텍스트 요소 검토 및 평가 기초).","dc_step1":"짧은 설명글이 무엇을 설명하고 있는지(예: 토끼의 귀와 꼬리) 확인하고 옆에 실린 그림·사진을 본다.","dc_step2":"그림·사진이 글에서 설명하는 대상의 모습을 잘 보여 주는지, 아니면 엉뚱한 그림인지 비교한다.","dc_step3":"그림이나 설명 말이 알기 쉽게 잘 어울리는지 판단한다.","mager_reading":"[조건] 3~4문장의 설명글과 어울리는 그림/어울리지 않는 그림 후보가 주어졌을 때, [준거] 글의 설명 내용을 가장 잘 보여 주는 알맞은 그림·사진을 100% 정확히, [행동] 평가하여 고를 수 있다.","mager_writing":"[조건] 글 내용과 맞지 않는 그림이 실린 짧은 설명글이 주어졌을 때, [준거] 왜 그 그림이 알맞지 않은지 이유를 말하고 어떤 그림으로 바꾸면 좋을지 1문장으로, [행동] 제안할 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V3-1 ➔ G2-EXP-V3-1","horizontal_link":"[공통기초 결합] A1·A2(어휘·비유·표현 효과 비교), A3(문장 명료성) | ➔ [쓰기 W4·W5 직결] 좋은 표현·시각자료·근거 적절성 평가 준거를 내 초고 집필 및 표현 퇴고 루브릭으로 적용"},{"code":"G1-EXP-V3-2","grade":"1학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-2 작품 공감·인물선택·내용 정확성·논리 타당성 평가","sub_skill_name":"정보의 정확성·객관성·출처 신뢰성 및 관점 공정성 평가","curriculum_basis":"`[2국02-02]`, `CCSS RI.1.8 & RL.1.5`(정보를 알려주는 책과 이야기를 꾸며낸 책 구별하기).","dc_step1":"동물이나 사물에 대한 문장을 읽으며 실제로 있는 일인지(예: “강아지는 다리가 네 개입니다”) 상상 속 이야기인지(예: “강아지가 하늘을 날며 말을 합니다”) 살펴본다.","dc_step2":"자신이 알고 있는 실제 사실이나 사진 자료와 문장 내용을 비교한다.","dc_step3":"진짜 사실만을 알려 주는 설명 문장인지 판단한다.","mager_reading":"[조건] 동물이나 사물에 대한 실제 사실 문장과 상상·꾸며낸 문장이 섞여 주어졌을 때, [준거] 실제로 확인 가능한 진짜 사실 정보 문장을 100% 정확히, [행동] 가려낼 수 있다.","mager_writing":"[조건] 상상이 섞인 사물 소개 문장이 주어졌을 때, [준거] 어느 부분이 실제 사실과 다른지 찾아 실제 사실에 맞는 1문장으로, [행동] 바르게 고쳐 말하거나 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V3-2 ➔ G2-EXP-V3-2","horizontal_link":"[공통기초 결합] A5(근거-주장 논리적 타당성·인과 오류 점검) | ➔ [쓰기 W2·W5 직결] 인물의 선택·정보 객관성·논리 타당성 평가 준거를 내 글의 내용 타당성·공정성 자기점검 기준으로 적용"},{"code":"G1-EXP-V3-3","grade":"1학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-3 내 삶 연결·내면화 및 다매체 비교·팩트체크","sub_skill_name":"다중 설명 자료 교차 검증 및 지식 재구성","curriculum_basis":"`[2국02-02]`, `CCSS RI.1.9`(동일 주제를 다룬 두 텍스트 간의 기본적인 유사점과 차이점 확인하기).","dc_step1":"같은 동물이나 사물(예: 호랑이)을 설명한 두 개의 짧은 글(글 ㉮, 글 ㉯)을 각각 읽는다.","dc_step2":"두 글에 똑같이 나온 내용과 한쪽 글에만 나온 새로운 내용을 찾아 연결한다.","dc_step3":"두 글을 함께 읽어서 알게 된 대상의 특징을 합쳐 본다.","mager_reading":"[조건] 같은 동식물을 소개한 3~4문장의 짧은 설명글 두 편(㉮, ㉯)이 주어졌을 때, [준거] 두 글에 공통으로 나온 내용 1가지와 각 글에만 나온 내용 1가지를 100% 정확히, [행동] 비교하여 찾을 수 있다.","mager_writing":"[조건] 같은 대상을 다룬 짧은 설명글 두 편이 주어졌을 때, [준거] 두 글에서 알게 된 사실을 합쳐서 대상의 특징 2가지 이상을, [행동] 말하거나 빈칸에 옮겨 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-V3-3 ➔ G2-EXP-V3-3","horizontal_link":"[공통기초 결합] A6(다중 텍스트 통합·재구성) | ➔ [쓰기 W1·W2 직결] 텍스트와 내 삶·다중 매체를 연결·검증한 성찰 결과를 내 글쓰기의 직접적 글감·주제로 채택"},{"code":"G1-EXP-W1","grade":"1학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W1 계획하기 (목적·독자·주제·갈래 설정)","sub_skill_name":"계획하기 (설명 목적·독자 분석·대상 및 주제 좁히기)","curriculum_basis":"`[2국03-01]`(주변의 사물이나 자연 현상에 관심을 가지고 글쓰기 계획 기초), `CCSS W.1.2`.","dc_step1":"교실이나 집 주변에서 친구들에게 알려 주고 싶은 좋아하는 사물·동물·식물 후보를 떠올린다.","dc_step2":"그중에서 내가 모양이나 색깔, 특징을 가장 잘 알고 있는 대상 1가지를 고른다.","dc_step3":"누구에게 무엇을 소개할지 생각 카드를 채운다.","mager_reading":"[조건] 사물 소개 글쓰기 준비 예시가 주어졌을 때, [준거] 내가 잘 알고 있어 친구에게 특징을 정확히 알려 줄 수 있는 설명 대상을 100% 정확히, [행동] 골라낼 수 있다.","mager_writing":"[조건] ‘내가 소개할 것’ 계획 카드가 주어졌을 때, [준거] 소개할 대상의 이름 1가지와 누구에게 알려 줄지를, [행동] 빈칸에 정확히 적어 글쓰기 계획을 세울 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-W1 ➔ G2-EXP-W1","horizontal_link":"[공통기초 결합] A6(주제 설정) + 읽기 V1-4/V2-4(작가 의도·목적)·V3-3(삶 연결 글감) 전이 | ⬅ [읽기 V2-4·V3-3 수용] 필자 의도 추론과 내 삶 연결 성찰에서 도출한 글감·주제·독자를 글쓰기 계획으로 확정"},{"code":"G1-EXP-W2","grade":"1학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W2 내용 생성하기 (글감·감각/비유·사실/근거 자료 수집)","sub_skill_name":"내용 생성하기 (다중 출처 자료 수집·정확성/신뢰성 검증·시각자료 기획)","curriculum_basis":"`[2국03-01]`, `CCSS W.1.2 & W.1.8`(경험을 떠올리거나 제공된 출처에서 사실 정보를 모아 질문에 답하기).","dc_step1":"소개할 사물이나 동식물의 사진·실물을 자세히 살펴본다(눈으로 본 모양·색깔, 만져 본 느낌, 소리 등).","dc_step2":"대상의 진짜 특징인 것과 관련 없는 것을 구별하여 특징 낱말들을 모은다.","dc_step3":"설명글에 쓸 특징 낱말 2~3개와 함께 그릴 그림을 준비한다.","mager_reading":"[조건] 소개할 사물 사진과 여러 낱말 카드들이 주어졌을 때, [준거] 그 사물의 실제 모양·색깔·쓰임새에 맞는 사실 낱말 카드를 100% 정확히, [행동] 골라낼 수 있다.","mager_writing":"[조건] 소개할 대상과 생각 모으기 그물망(마인드맵)이 주어졌을 때, [준거] 대상의 실제 특징을 나타내는 낱말이나 짧은 어구를 3개 이상, [행동] 생각 그물망에 적고 알맞은 그림을 그릴 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-W2 ➔ G2-EXP-W2","horizontal_link":"[공통기초 결합] A1·A2(감각어·복합어·비유·관용어 생성) + 읽기 V1-1/V2-1/V3-1 전이 | ⬅ [읽기 V1-1·V2-1·V3-1 수용] 읽은 모델 텍스트의 소재·어휘·근거 기준을 활용하여 풍부한 글감과 자료 생성"},{"code":"G1-EXP-W3","grade":"1학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W3 내용 조직하기 (읽기 구조 미러링 개요·도해 설계)","sub_skill_name":"내용 조직하기 (6대 설명 구조 선택·처음-가운데-끝 개요·담화표지 배치)","curriculum_basis":"`[2국03-01]`, `CCSS W.1.2`.","dc_step1":"모은 특징 낱말 카드들을 늘어놓는다.","dc_step2":"첫 번째 문장에는 대상의 이름을 먼저 쓰고, 그다음 문장들에 모양·색깔·특징을 어떤 차례로 쓸지 연결한다.","dc_step3":"문장 쓸 순서를 번호(①, ②, ③)로 정한다.","mager_reading":"[조건] 사물 소개 문장 카드 3장이 섞여 있을 때, [준거] [대상 이름 소개 ➔ 겉모습과 특징 설명]의 자연스러운 순서를 100% 정확히, [행동] 찾을 수 있다.","mager_writing":"[조건] 내가 모은 사물의 특징 낱말 카드들이 주어졌을 때, [준거] 먼저 쓸 내용과 나중에 쓸 내용의 순서를 ①, ②, ③ 번호로, [행동] 바르게 배열할 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-W3 ➔ G2-EXP-W3","horizontal_link":"[공통기초 결합] A4(담화표지 배치)·A6(개요 위계) + 읽기 V1-2/V1-3(텍스트 구조 도해조직자 미러링) 전이 | ⬅ [읽기 V1-2·V1-3 수용] 읽기 단계의 텍스트 구조 도해조직자를 내 글의 문단·연·플롯 개요 틀로 전환하여 조직"},{"code":"G1-EXP-W4","grade":"1학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W4 초고 집필하기 (갈래별 핵심 표현 전략·문장화)","sub_skill_name":"집필하기 (중심-뒷받침 위계·학술 어휘 뜻풀이·객관적 어조·시각자료 통합 집필)","curriculum_basis":"`[2국03-01]`(주변의 사물이나 자연 현상에 대해 짧은 글을 쓴다), `[2국04-02]`(마침표와 띄어쓰기 기초), `CCSS W.1.2`(주제 이름을 밝히고 주제에 대한 몇 가지 사실을 제공하며 마무리 느낌 제시하기).","dc_step1":"계획한 대상 이름과 특징 낱말들을 보고 첫 문장으로 “이것은 ○○입니다.”(또는 “제가 소개할 것은 ○○입니다.”)를 쓴다.","dc_step2":"대상의 모양, 색깔, 소리, 하는 일을 나타내는 말과 알맞은 조사(‘은/는, 이/가, 을/를’)를 붙여 1~2문장을 이어 쓴다.","dc_step3":"문장 끝에 마침표(`.`)를 찍고 그림과 어울리는 2~3문장의 사물 소개 글을 완성한다.","mager_reading":"[조건] 사물의 특징을 바르게 설명한 문장과 문장이 끊기거나 끝맺음이 이상한 문장이 주어졌을 때, [준거] 대상과 특징이 자연스럽게 연결되고 마침표가 바르게 찍힌 설명 문장을 100% 정확히, [행동] 고를 수 있다.","mager_writing":"[조건] 소개할 사물·동식물의 그림과 특징 낱말 계획 카드가 주어졌을 때, [준거] 대상의 이름과 주요 특징 2가지 이상을 포함하고 알맞은 조사와 마침표(`.`)를 사용하여 2~3문장의 사물 소개 글을, [행동] 완성하여 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-W4 ➔ G2-EXP-W4","horizontal_link":"[공통기초 결합] A2·A3(문장 확장·장르별 표현 전략 구사) + 읽기 V1~V3 통합 전이 | ⬅ [읽기 전 과정 수용] 계획·생성·조직한 개요와 갈래별 핵심 표현 전략을 결합하여 완결된 초고 집필"},{"code":"G1-EXP-W5","grade":"1학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W5 고쳐쓰기 (내용·조직·표현[주술호응·교정부호] 3단계 퇴고)","sub_skill_name":"고쳐쓰기 (내용 정확성/객관성·조직 응집성·표현 주술/부사어 호응 `[6국04-05]` 3단계 교정부호 퇴고)","curriculum_basis":"`[2국03-01]`, `[2국04-01~02]`, `CCSS W.1.5 & L.1.2`(교사·친구의 도움으로 세부사항을 보태어 글을 보강하고 마침표·철자 점검하기).","dc_step1":"내가 쓴 2~3문장의 사물 소개 글을 소리 내어 읽어 본다.","dc_step2":"대상의 특징이 빠지지 않았는지, 틀린 글자(받침)나 빠진 띄어쓰기, 마침표(`.`)가 없는지 찾는다.","dc_step3":"틀린 글자와 마침표를 바르게 고쳐 쓴다.","mager_reading":"[조건] 글자 받침이나 마침표가 틀린 짧은 사물 소개 문장이 주어졌을 때, [준거] 고쳐야 할 곳 2곳 이상을 100% 정확히, [행동] 찾아 표시할 수 있다.","mager_writing":"[조건] 자신이 쓴 2~3문장의 사물 소개 글과 기초 점검표(특징 넣기·띄어쓰기·마침표)가 주어졌을 때, [준거] 점검표의 3가지 항목을 모두 확인하여 오류 없이, [행동] 바르게 고쳐 쓸 수 있다.","vertical_link":"[학년 나선형] 입문기 사물·안내 관찰 ➔ G1-EXP-W5 ➔ G2-EXP-W5","horizontal_link":"[공통기초 결합] A3(주술·목서·부사어·시제·높임 호응 및 문장부호 교정), A4(응집성 교정) | ⬅ [공통 A3·A4 및 읽기 V3-1·V3-2 수용] 내용·조직·표현(주술/부사어 호응, 시제, 맞춤법, 교정부호) 3단계 메타인지 퇴고"},{"code":"G2-EXP-V1-1","grade":"2학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-1 내용 확인 (명시적 정보·대상·사실 식별)","sub_skill_name":"내용 확인 (대상과 특징·세부 정보 식별)","curriculum_basis":"`[2국02-03]`(글을 읽고 주요 내용을 확인한다), `CCSS RI.2.1`(누가, 무엇을, 언제, 어디서, 왜, 어떻게의 6하원칙 질문으로 핵심 세부사항 확인), 영국 NC Year 2(비문학 텍스트의 사실 정보 추출).","dc_step1":"1~2문단의 관찰 기록문이나 생활 안내글에서 ‘무엇을, 언제, 어디서, 어떻게’에 해당하는 시간·장소·준비물·행동 낱말에 밑줄을 긋는다.","dc_step2":"밑줄 그은 세부 정보들을 질문 유형(무엇/언제/어디서/어떻게)에 따라 분류하고 본문 문장의 서술어와 호응시켜 사실 여부를 대조한다.","dc_step3":"글에 명시된 사실과 명시되지 않은(또는 다르게 바꾼) 진술을 구별하고 핵심 세부 정보를 항목별로 정리한다.","mager_reading":"[조건] 동식물 관찰 기록문이나 만들기 안내글(6~8문장)과 세부 내용 확인 문항이 주어졌을 때, [준거] ‘무엇을, 언제, 어디서, 어떻게’에 해당하는 명시적 사실 정보를 4개 중 3개 이상 정확히, [행동] 본문에서 찾아 확인하고 사실과 일치하는 문장을 판별할 수 있다.","mager_writing":"[조건] 읽은 관찰·안내글의 내용을 정리하는 ‘관찰/안내 기록 표’가 주어졌을 때, [준거] 대상, 때와 장소, 주요 특징(또는 준비물·방법) 3개 항목을 본문 정보와 100% 일치하게, [행동] 짧은 문장이나 어구로 분류하여 기록할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V1-1 ➔ G2-EXP-V1-1 ➔ G3-EXP-V1-1","horizontal_link":"[공통기초 결합] A1(해독·어휘·형태소), A2(감각어·기초어휘) | ➔ [쓰기 W2 전이] 읽기에서 포착한 장르별 필수 요소(대상/인물/경험/개념/주장·근거)를 내 글의 내용 생성 항목으로 전환"},{"code":"G2-EXP-V1-2","grade":"2학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-2 관계 확인 (지시·인과·문장골격·비유·중심세부 관계)","sub_skill_name":"관계 확인 (문단 내 중심-세부, 어휘 위계, 문장 골격, 지시·인과 관계)","curriculum_basis":"`[2국02-03]`(문장 간의 앞뒤 관계를 생각하며 읽기), `CCSS RI.2.3`(역사적 사건, 과학적 아이디어, 기술적 절차의 일련의 단계 간 연결 파악), 영국 NC Year 2(문장 간 연결어와 지시 관계).","dc_step1":"1~2문단의 설명·관찰글에서 앞뒤 문장을 이어 주는 말(‘그래서, 왜냐하면, 그리고, 먼저, 다음에’)과 지시어(‘이곳, 이때, 이렇게’)를 찾는다.","dc_step2":"지시어가 가리키는 앞 문장의 장소·시간·방법을 찾고, 이어 주는 말 앞뒤의 두 문장이 ‘원인-결과’인지 ‘차례(순서)’인지 연결한다.","dc_step3":"같은 종류의 낱말(예: 채소 - 오이, 당근, 배추)을 묶어 주는 말과 포함하는 말로 나누고 문장 간 앞뒤 관계를 정리한다.","mager_reading":"[조건] 6~8문장으로 된 관찰·정보글이 주어졌을 때, [준거] 지시어(‘이곳/이렇게’)가 가리키는 앞 문장의 내용과 이어 주는 말(‘그래서/먼저~다음에’)로 연결된 문장 간 까닭·순서 관계를 3개 중 2개 이상 정확히, [행동] 찾아 연결할 수 있다.","mager_writing":"[조건] 서로 관계있는 두 사실 문장 카드와 묶음 낱말 카드가 주어졌을 때, [준거] 알맞은 이어 주는 말(‘그래서/그리고’)을 넣어 두 문장을 자연스럽게 연결하고 같은 종류의 낱말 3개를 묶어 주는 말로, [행동] 분류해 쓸 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V1-2 ➔ G2-EXP-V1-2 ➔ G3-EXP-V1-2","horizontal_link":"[공통기초 결합] A1(상하위·단어관계), A3(문장골격 주·목·서), A4(지시어·접속어), A5(명시적 인과) | ➔ [쓰기 W3·W4 전이] 텍스트 내 관계(비유/인과/경험-감상/중심-뒷받침/주장-근거) 원리를 내 문단 연결 및 문장 구성에 적용"},{"code":"G2-EXP-V1-3","grade":"2학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-3 구조 확인 (갈래별 미시·거시 텍스트 구조 도해)","sub_skill_name":"구조 확인 (설명 방법 및 거시적 텍스트 구조 도해)","curriculum_basis":"`[2국02-03]`(글에 드러난 일이나 과정의 순서를 파악하며 읽는다), `CCSS RI.2.5`(자막, 굵은 글씨, 소제목, 색인 등 텍스트 특징을 활용하여 핵심 정보 구조를 효율적으로 찾기).","dc_step1":"식물 자람 관찰글이나 만들기 설명글에서 시간·과정 표지(‘씨앗을 심은 뒤, 며칠 뒤, 마침내’) 또는 나열 표지(‘첫째, 둘째, 또’)를 찾는다.","dc_step2":"찾은 표지를 기준으로 글이 ‘시간·과정 순서대로 쓴 글’인지 ‘여러 가지 특징을 나열한 글’인지 구별한다.","dc_step3":"글의 짜임에 맞는 기초 그림 틀(화살표 기차 틀 또는 꽃잎 나열 틀)에 각 단계나 특징을 옮겨 넣는다.","mager_reading":"[조건] 동식물의 성장 과정을 담은 관찰글과 여러 특징을 소개한 정보글(각 6~8문장)이 주어졌을 때, [준거] 시간·순서 표지와 나열 표지를 단서로 두 글의 짜임(순서 짜임 vs 나열 짜임)을 정확히, [행동] 구별하고 단계별 내용을 화살표 순서도에 짝지을 수 있다.","mager_writing":"[조건] 읽은 관찰·정보글과 기초 도해 틀(화살표 순서도 또는 방사형 마인드맵)이 주어졌을 때, [준거] 글의 짜임에 알맞은 틀을 선택하여 3~4개의 핵심 단계나 특징을 순서와 위치에 맞게, [행동] 짧은 문장으로 채워 넣을 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V1-3 ➔ G2-EXP-V1-3 ➔ G3-EXP-V1-3","horizontal_link":"[공통기초 결합] A4(담화 전환 표지), A5(선후·인과·구조), A6(문단 짜임) | ➔ [쓰기 W3 직결] 읽기에서 완성한 \'갈래별 구조 도해조직자\'를 내 글의 \'개요 설계 틀(Graphic Organizer)\'로 1:1 미러링"},{"code":"G2-EXP-V1-4","grade":"2학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-4 요약 및 주제 확인 (핵심 골격 간추리기·주제·제목)","sub_skill_name":"요약 및 주제 확인 (중심 내용 간추리기 & 제목 붙이기)","curriculum_basis":"`[2국02-03]`(글을 읽고 중심 내용을 간추린다), `CCSS RI.2.2`(다문단 텍스트의 전체 주제뿐만 아니라 텍스트 내 특정 문단의 초점 파악하기).","dc_step1":"1~2문단의 설명·관찰글에서 각 문단의 대표 문장이나 단계별 핵심 낱말을 찾는다.","dc_step2":"찾은 핵심 낱말들을 연결하여 “이 글은 [무엇]의 [어떤 점/과정]을 설명하는 글입니다.”라는 틀에 맞추어 본다.","dc_step3":"글 전체의 중심 내용을 한두 문장으로 간추리고 대상과 설명 내용이 드러나는 제목을 붙인다.","mager_reading":"[조건] 1~2문단(6~8문장)의 정보·관찰글이 주어졌을 때, [준거] 글 전체가 무엇의 어떤 점을 설명하는지 핵심 내용을 바르게 간추린 문장과 알맞은 제목을, [행동] 정확히 선택할 수 있다.","mager_writing":"[조건] 1~2문단의 정보·관찰글이 주어졌을 때, [준거] [설명 대상]과 [핵심 내용(특징/순서)]이 모두 포함되도록 1~2문장으로 중심 내용을 간추려 쓰고 어울리는 제목을, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V1-4 ➔ G2-EXP-V1-4 ➔ G3-EXP-V1-4","horizontal_link":"[공통기초 결합] A3(수식어 삭제·문장골격 추출), A6(중심-세부 위계 및 삭제·선택·일반화·구성 요약) | ➔ [쓰기 W1·W4 전이] 요약한 중심 명제와 제목 짓기 원리를 내 글의 핵심 주제문(Topic Sentence) 및 제목 설정에 적용"},{"code":"G2-EXP-V2-1","grade":"2학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-1 어휘·비유·관용표현·형태소 문맥 추론","sub_skill_name":"학술 어휘·형태소 및 다의어 문맥 추론","curriculum_basis":"`[2국02-03]`, `[2국04-02]`(문맥을 통해 낱말의 의미 파악하기), `CCSS RI.2.4 & L.2.4a-c`(문장 수준 문맥, 기초 접두사·복합어 구성 요소를 단서로 새 낱말 뜻 추론하기).","dc_step1":"1~2문단의 설명글에서 모르는 낱말이나 두 가지 이상의 뜻으로 쓰이는 쉬운 다의어(예: ‘손’, ‘발’, ‘눈’)가 쓰인 문장을 찾는다.","dc_step2":"그 낱말을 이루는 쉬운 낱말 조각(예: ‘물+오리’, ‘비늘+줄기’)이나 앞뒤 문장의 예시·상황 설명을 단서로 뜻을 짐작한다.","dc_step3":"문맥에 맞는 뜻풀이를 확정하고 다른 뜻으로 쓰인 문장과 구별한다.","mager_reading":"[조건] 1~2문단의 정보글에 합성 낱말이나 다의어가 포함되어 있을 때, [준거] 앞뒤 문장의 문맥 단서를 활용하여 해당 낱말의 문맥적 의미를 3개 중 2개 이상 정확히, [행동] 추론하고 같은 뜻으로 쓰인 문장을 찾을 수 있다.","mager_writing":"[조건] 본문에서 추론한 낱말이 주어졌을 때, [준거] 왜 그런 뜻이라고 짐작했는지 앞뒤 문장의 단서 낱말을 1개 이상 들어, [행동] 한 문장으로 설명할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V2-1 ➔ G2-EXP-V2-1 ➔ G3-EXP-V2-1","horizontal_link":"[공통기초 결합] A1(합성어·파생어 어근·접사 분석), A2(다의어·동형어·속담·관용표현 문맥 추론) | ➔ [쓰기 W2·W4 전이] 문맥으로 추론한 비유·다의어·관용표현·학술어를 내 글의 생생하고 설득력 있는 표현 재료로 활용"},{"code":"G2-EXP-V2-2","grade":"2학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-2 생략된 상황·인과·숨은 전제·거시지시어 추론","sub_skill_name":"문단 간 응집성(거시 지시어) 및 생략된 인과·과정 추론","curriculum_basis":"`[2국02-03]`(글의 앞뒤 관계를 생각하며 생략된 내용 짐작하기), `CCSS RI.2.3`(과학적 아이디어·기술적 절차의 단계 간 연결 추론).","dc_step1":"관찰 기록문이나 만드는 순서 글에서 1단계와 3단계 사이에 비어 있거나 생략된 부분, 그리고 ‘그렇게 하면, 그러면’ 같은 지시 표현을 찾는다.","dc_step2":"‘그렇게 하면’이 가리키는 앞 문장 전체의 행동을 확인하고, 앞 단계의 상태가 뒷 단계의 상태로 바뀌기 위해 필요한 중간 과정을 연결한다.","dc_step3":"빠진 중간 순서나 그 뒤에 일어날 결과를 논리적으로 짐작한다.","mager_reading":"[조건] 1~2문단의 관찰·만들기 과정 글에서 중간 단계 1곳이 비어 있을 때, [준거] 앞뒤 단계의 단서와 지시어(‘그렇게 하면’)를 연결하여 생략된 중간 과정과 이어질 결과를 100% 정확히, [행동] 추론하여 찾을 수 있다.","mager_writing":"[조건] 중간 과정이나 마지막 결과가 비어 있는 관찰·안내글이 주어졌을 때, [준거] 앞뒤 문장의 흐름에 어긋나지 않게 빠진 과정이나 결과를 1~2문장으로, [행동] 추론하여 빈칸을 완성할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V2-2 ➔ G2-EXP-V2-2 ➔ G3-EXP-V2-2","horizontal_link":"[공통기초 결합] A4(생략 성분 복원·거시 지시어 역추적), A5(생략된 매개 인과·숨은 전제 추론) | ➔ [쓰기 W3·W5 전이] 생략된 맥락·인과·전제 추론 원리를 통해 내 글의 논리적 비약이나 사건 빈틈을 메우며 조직·퇴고"},{"code":"G2-EXP-V2-3","grade":"2학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-3 인물 심리·화자 정서·시각자료·독자반응 추론","sub_skill_name":"텍스트와 시각 매체 자료 간 통합 추론","curriculum_basis":"`[2국02-03]`, `CCSS RI.2.7`(다이어그램 등 특정 이미지가 텍스트 이해에 어떻게 기여하는지 설명하기).","dc_step1":"1~2문단 정보글에 실린 순서 그림, 간단한 그림그래프, 단면도(예: 땅속 개미집 그림)의 화살표와 이름표를 찾는다.","dc_step2":"본문에서 설명하는 내용과 그림 속 화살표 방향·위치 관계를 포개어 연결한다.","dc_step3":"그림과 글을 합쳐서 대상이 움직이는 방향이나 변화하는 모습을 추론한다.","mager_reading":"[조건] 단면도나 간단한 그림그래프가 포함된 1~2문단 설명글이 주어졌을 때, [준거] 본문 설명과 시각 자료의 화살표·기호를 연결하여 대상의 이동 경로 또는 많고 적은 경향을 100% 정확히, [행동] 추론하여 찾을 수 있다.","mager_writing":"[조건] 설명글과 설명 그림이 주어졌을 때, [준거] 그림의 단서와 본문 내용을 합쳐서 알게 된 사실을 1~2문장으로, [행동] 연결해 쓸 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V2-3 ➔ G2-EXP-V2-3 ➔ G3-EXP-V2-3","horizontal_link":"[공통기초 결합] A2(감정·태도 어휘), A5(상황-반응 내적 인과 연결) | ➔ [쓰기 W1·W4 전이] 화자/인물 심리·시각자료·예상 독자 반응 추론을 바탕으로 독자 맞춤형 표현·시각자료·반론 대응 구사"},{"code":"G2-EXP-V2-4","grade":"2학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-4 작가(필자) 의도·관점·시점·맥락 추론","sub_skill_name":"필자의 집필 목적·예상 독자·관점 추론","curriculum_basis":"`[2국02-04]`, `CCSS RI.2.6`(글쓴이가 무엇에 답하거나 무엇을 설명·기술하려고 하는지 텍스트의 주된 목적 파악하기).","dc_step1":"1~2문단의 안내문·관찰글·정보글에서 제목과 첫 문장, 끝 문장의 표현을 찾는다.","dc_step2":"이 글을 읽으면 누가 어떤 도움을 받을 수 있는지(예: 동물을 기르려는 친구, 도서관을 이용하려는 사람) 연결한다.","dc_step3":"글쓴이가 누구에게 무엇을 알려 주려고 썼는지 추론한다.","mager_reading":"[조건] 1~2문단의 생활 안내글이나 정보글이 주어졌을 때, [준거] 글쓴이가 이 글을 쓴 목적과 이 글이 가장 필요한 사람(예상 독자)을 100% 정확히, [행동] 추론하여 선택할 수 있다.","mager_writing":"[조건] 읽은 정보·안내글이 주어졌을 때, [준거] “이 글은 [누구]에게 [무엇]을 알려 주려고 쓴 글입니다.”라는 틀에 맞추어 글쓴이의 목적과 독자를, [행동] 1문장으로 쓸 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V2-4 ➔ G2-EXP-V2-4 ➔ G3-EXP-V2-4","horizontal_link":"[공통기초 결합] A6(전체 주제 의식 도출), A2(어조·어감 분석) | ➔ [쓰기 W1 직결] 필자의 집필 의도·관점·맥락 추론을 역적용하여 내 글의 집필 목적·서술 시점·관점 수립"},{"code":"G2-EXP-V3-1","grade":"2학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-1 표현·서술 방식 및 근거·시각자료 적절성 평가","sub_skill_name":"설명 방법·표현 및 시각 자료의 적절성 평가","curriculum_basis":"`[2국02-03]`, `CCSS RI.2.5 & RI.2.7`(텍스트 특징과 시각 이미지가 독자의 이해를 어떻게 돕는지 평가 기초).","dc_step1":"1~2문단의 만드는 법 안내글이나 관찰글에서 설명 순서와 번호·그림을 확인한다.","dc_step2":"읽는 사람이 따라 하거나 알아듣기에 설명이 너무 어렵거나 순서가 뒤섞인 곳이 없는지 점검한다.","dc_step3":"더 알기 쉽게 설명한 글을 고르고 부족한 설명이나 그림을 고칠 방법을 생각한다.","mager_reading":"[조건] 같은 만들기 과정을 설명한 두 안내글(순서와 그림이 명확한 글 vs 순서가 섞이고 설명이 빠진 글)이 주어졌을 때, [준거] 독자가 이해하고 따라 하기 쉬운 글과 그 이유(번호·순서 말·그림 유무)를 100% 정확히, [행동] 판단하여 선택할 수 있다.","mager_writing":"[조건] 순서가 헷갈리거나 그림이 빠진 짧은 안내글이 주어졌을 때, [준거] 읽는 사람이 더 쉽게 이해할 수 있도록 고칠 점 1가지 이상을 찾아, [행동] 바르게 고쳐 쓰거나 말할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V3-1 ➔ G2-EXP-V3-1 ➔ G3-EXP-V3-1","horizontal_link":"[공통기초 결합] A1·A2(어휘·비유·표현 효과 비교), A3(문장 명료성) | ➔ [쓰기 W4·W5 직결] 좋은 표현·시각자료·근거 적절성 평가 준거를 내 초고 집필 및 표현 퇴고 루브릭으로 적용"},{"code":"G2-EXP-V3-2","grade":"2학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-2 작품 공감·인물선택·내용 정확성·논리 타당성 평가","sub_skill_name":"정보의 정확성·객관성·출처 신뢰성 및 관점 공정성 평가","curriculum_basis":"`[2국02-03]`, `[2국02-04]`, 영국 NC Year 2(사실 진술과 개인적 느낌·생각 구별 기초).","dc_step1":"1~2문단의 정보글·관찰글에서 누구에게나 똑같은 ‘사실 문장’과 글쓴이 혼자만의 느낌·기분을 적은 ‘느낌 문장(예: 세상에서 제일 못생기고 싫다)’을 찾는다.","dc_step2":"정보를 알려 주는 글에서는 개인적인 싫고 좋은 느낌보다 정확한 사실 설명이 중요함을 연결한다.","dc_step3":"사실과 맞지 않거나 개인적 느낌만 앞세운 문장을 찾아낸다.","mager_reading":"[조건] 1~2문단의 관찰·정보글 속에 객관적 사실 문장과 주관적 감정·느낌 문장이 섞여 있을 때, [준거] 정확한 사실 정보 문장과 개인적 느낌 문장을 100% 정확히, [행동] 구별할 수 있다.","mager_writing":"[조건] 개인적 감정 표현(‘너무 징그럽다, 제일 최고다’)이 들어간 관찰 기록문이 주어졌을 때, [준거] 감정 표현을 빼고 실제 관찰한 모양·크기·행동 사실로 바꾸어 1~2문장으로, [행동] 고쳐 쓸 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V3-2 ➔ G2-EXP-V3-2 ➔ G3-EXP-V3-2","horizontal_link":"[공통기초 결합] A5(근거-주장 논리적 타당성·인과 오류 점검) | ➔ [쓰기 W2·W5 직결] 인물의 선택·정보 객관성·논리 타당성 평가 준거를 내 글의 내용 타당성·공정성 자기점검 기준으로 적용"},{"code":"G2-EXP-V3-3","grade":"2학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-3 내 삶 연결·내면화 및 다매체 비교·팩트체크","sub_skill_name":"다중 설명 자료 교차 검증 및 지식 재구성","curriculum_basis":"`[2국02-03]`, `CCSS RI.2.9`(동일 주제에 대해 두 텍스트가 제시하는 가장 중요한 점들을 비교·대조하기).","dc_step1":"같은 주제를 다룬 두 정보글(예: 글로 쓴 안내문 vs 그림표로 된 안내문)에서 각각 설명하는 항목을 찾는다.","dc_step2":"두 자료의 내용이 서로 똑같은지 다른 부분이 있는지 대조한다.","dc_step3":"두 자료를 합쳐서 대상에 대해 더 완전한 정보를 정리한다.","mager_reading":"[조건] 같은 주제를 다룬 1~2문단 정보글 두 편이 주어졌을 때, [준거] 두 자료에서 일치하는 사실과 서로 다르게 설명하거나 보충해 주는 내용을 3개 중 2개 이상 정확히, [행동] 비교하여 판별할 수 있다.","mager_writing":"[조건] 같은 주제의 두 설명 자료와 정리표가 주어졌을 때, [준거] [두 자료에 모두 있는 내용]과 [새로 더 알게 된 내용]을 구분하여 2~3문장으로, [행동] 합쳐 쓸 수 있다.","vertical_link":"[학년 나선형] G1-EXP-V3-3 ➔ G2-EXP-V3-3 ➔ G3-EXP-V3-3","horizontal_link":"[공통기초 결합] A6(다중 텍스트 통합·재구성) | ➔ [쓰기 W1·W2 직결] 텍스트와 내 삶·다중 매체를 연결·검증한 성찰 결과를 내 글쓰기의 직접적 글감·주제로 채택"},{"code":"G2-EXP-W1","grade":"2학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W1 계획하기 (목적·독자·주제·갈래 설정)","sub_skill_name":"계획하기 (설명 목적·독자 분석·대상 및 주제 좁히기)","curriculum_basis":"`[2국03-02]`(관찰한 내용이나 겪은 일을 쓰기 위해 계획하기), `CCSS W.2.2`.","dc_step1":"동식물 관찰이나 만들기·놀이 방법 중에서 설명할 주제를 찾는다.","dc_step2":"내 글을 읽을 사람(친구, 동생, 부모님)이 무엇을 궁금해할지 연결해 본다.","dc_step3":"설명할 대상, 읽을 사람, 알려 줄 내용을 계획표에 정한다.","mager_reading":"[조건] 읽을 사람(예: 1학년 동생 vs 선생님)과 설명 주제가 적힌 카드들이 주어졌을 때, [준거] 읽을 사람이 궁금해하고 이해할 수 있는 알맞은 설명 주제를, [행동] 바르게 짝지을 수 있다.","mager_writing":"[조건] 설명글 쓰기 계획표가 주어졌을 때, [준거] [설명할 대상], [읽을 사람], [왜 쓰는지(알려 줄 점)] 3가지 항목을 빠짐없이, [행동] 계획표에 작성할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-W1 ➔ G2-EXP-W1 ➔ G3-EXP-W1","horizontal_link":"[공통기초 결합] A6(주제 설정) + 읽기 V1-4/V2-4(작가 의도·목적)·V3-3(삶 연결 글감) 전이 | ⬅ [읽기 V2-4·V3-3 수용] 필자 의도 추론과 내 삶 연결 성찰에서 도출한 글감·주제·독자를 글쓰기 계획으로 확정"},{"code":"G2-EXP-W2","grade":"2학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W2 내용 생성하기 (글감·감각/비유·사실/근거 자료 수집)","sub_skill_name":"내용 생성하기 (다중 출처 자료 수집·정확성/신뢰성 검증·시각자료 기획)","curriculum_basis":"`[2국03-02]`, `CCSS W.2.7 & W.2.8`(관찰 기록 및 정보 수집).","dc_step1":"동식물이나 만드는 과정을 직접 관찰하거나 책을 찾아보며 시간·순서에 따른 사실을 메모한다.","dc_step2":"내 기분이나 상상이 아닌 실제로 관찰·확인한 사실 정보만 골라낸다(`V3-2` 연계).","dc_step3":"글에 넣을 핵심 사실 메모와 순서 그림 자료를 완성한다.","mager_reading":"[조건] 관찰 메모 카드들(실제 관찰 사실 vs 개인적 기분·상상)이 주어졌을 때, [준거] 설명글에 넣기에 알맞은 정확한 사실 메모만을 100% 정확히, [행동] 선별할 수 있다.","mager_writing":"[조건] 관찰 대상(또는 만들기 주제)과 관찰 기록장이 주어졌을 때, [준거] 시간이나 단계에 따른 실제 사실 정보 3가지 이상과 보조 그림을, [행동] 기록장에 수집·정리할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-W2 ➔ G2-EXP-W2 ➔ G3-EXP-W2","horizontal_link":"[공통기초 결합] A1·A2(감각어·복합어·비유·관용어 생성) + 읽기 V1-1/V2-1/V3-1 전이 | ⬅ [읽기 V1-1·V2-1·V3-1 수용] 읽은 모델 텍스트의 소재·어휘·근거 기준을 활용하여 풍부한 글감과 자료 생성"},{"code":"G2-EXP-W3","grade":"2학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W3 내용 조직하기 (읽기 구조 미러링 개요·도해 설계)","sub_skill_name":"내용 조직하기 (6대 설명 구조 선택·처음-가운데-끝 개요·담화표지 배치)","curriculum_basis":"`[2국03-02]`, `[2국03-03]`(순서에 맞게 내용을 정리하여 글쓰기 준비), `CCSS W.2.2`.","dc_step1":"수집한 관찰 메모나 만들기 과정 메모들을 시간이나 행동 순서에 따라 살펴본다.","dc_step2":"각 단계 앞에 붙일 순서를 나타내는 말(‘첫째, 둘째, 셋째’ 또는 ‘먼저, 다음으로, 마지막으로’)을 짝짓는다.","dc_step3":"화살표 순서 틀에 쓸 내용과 순서 말을 배치한다.","mager_reading":"[조건] 뒤섞인 관찰·만들기 과정 메모와 순서 이어 주는 말 카드가 주어졌을 때, [준거] 시간·과정의 흐름에 맞게 메모 순서와 이어 주는 말을 100% 정확히, [행동] 연결할 수 있다.","mager_writing":"[조건] 수집한 관찰·안내 자료와 3~4칸의 순서 계획 틀이 주어졌을 때, [준거] ‘먼저 - 다음으로 - 그다음에 - 마지막으로’의 순서 표지와 함께 각 단계의 핵심 내용을 차례대로, [행동] 조직하여 채워 넣을 수 있다.","vertical_link":"[학년 나선형] G1-EXP-W3 ➔ G2-EXP-W3 ➔ G3-EXP-W3","horizontal_link":"[공통기초 결합] A4(담화표지 배치)·A6(개요 위계) + 읽기 V1-2/V1-3(텍스트 구조 도해조직자 미러링) 전이 | ⬅ [읽기 V1-2·V1-3 수용] 읽기 단계의 텍스트 구조 도해조직자를 내 글의 문단·연·플롯 개요 틀로 전환하여 조직"},{"code":"G2-EXP-W4","grade":"2학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W4 초고 집필하기 (갈래별 핵심 표현 전략·문장화)","sub_skill_name":"집필하기 (중심-뒷받침 위계·학술 어휘 뜻풀이·객관적 어조·시각자료 통합 집필)","curriculum_basis":"`[2국03-02]`(관찰한 내용을 글로 쓴다), `[2국03-03]`(일이나 과정의 순서가 드러나게 짧은 글을 쓴다), `CCSS W.2.2`(주제를 소개하고 사실과 정의를 사용하여 요점을 전개하며 맺음말 제시하기).","dc_step1":"첫 문장에 관찰한 대상이나 만들 것을 소개하는 문장을 쓴다.","dc_step2":"순서 계획 틀을 보며 ‘먼저, 다음으로, 그다음에, 마지막으로’(또는 날짜·시간 말)를 넣어 각 단계의 사실을 차례대로 이어 쓴다.","dc_step3":"글 끝에 정리하는 한 문장을 덧붙여 5~7문장의 관찰 기록문 또는 만드는 순서 안내글을 완성한다.","mager_reading":"[조건] 순서 이어 주는 말이 들어갈 빈칸이 있는 관찰·안내글 초안이 주어졌을 때, [준거] 앞뒤 과정과 문장 끝맺음(‘~합니다/~습니다’)에 어울리는 표현을 100% 정확히, [행동] 선택할 수 있다.","mager_writing":"[조건] 작성한 순서 계획 틀과 관찰·만들기 자료가 주어졌을 때, [준거] 순서를 나타내는 말(‘먼저, 다음에, 마지막으로’ 등)을 3개 이상 사용하고 실제 사실을 바탕으로 5~7문장 분량의 관찰 기록문 또는 순서 안내글을, [행동] 차례대로 집필할 수 있다.","vertical_link":"[학년 나선형] G1-EXP-W4 ➔ G2-EXP-W4 ➔ G3-EXP-W4","horizontal_link":"[공통기초 결합] A2·A3(문장 확장·장르별 표현 전략 구사) + 읽기 V1~V3 통합 전이 | ⬅ [읽기 전 과정 수용] 계획·생성·조직한 개요와 갈래별 핵심 표현 전략을 결합하여 완결된 초고 집필"},{"code":"G2-EXP-W5","grade":"2학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W5 고쳐쓰기 (내용·조직·표현[주술호응·교정부호] 3단계 퇴고)","sub_skill_name":"고쳐쓰기 (내용 정확성/객관성·조직 응집성·표현 주술/부사어 호응 `[6국04-05]` 3단계 교정부호 퇴고)","curriculum_basis":"`[2국03-03]`, `[2국04-02]`, `CCSS W.2.5`(필요에 따라 내용을 수정·편집하여 글을 보강하기), 영국 NC Year 2(작성한 비문학 글의 의미·문장 끝맺음·철자 재검토).","dc_step1":"자신이 쓴 관찰·안내글을 읽으며 순서가 뒤바뀐 문장이나 개인적 감정 표현이 섞인 곳을 찾는다.","dc_step2":"순서를 나타내는 말(‘먼저, 다음에’)이 알맞게 들어갔는지, 문장 끝맺음(‘~합니다/~습니다’)이 자연스러운지 연결해 본다.","dc_step3":"순서와 문장 표현, 띄어쓰기를 고쳐 글을 완성한다.","mager_reading":"[조건] 순서가 뒤바뀌거나 끝맺음이 어색한 5~6문장의 관찰·안내글이 주어졌을 때, [준거] 고쳐야 할 순서 오류 1곳과 문장 표현 오류 1곳 이상을 정확히, [행동] 찾아낼 수 있다.","mager_writing":"[조건] 자신이 쓴 관찰·안내글 초안과 점검표가 주어졌을 때, [준거] (1) 일의 순서, (2) 실제 사실 여부, (3) 문장 끝맺음과 띄어쓰기를 점검하여 2곳 이상을, [행동] 더 알기 쉽게 고쳐 쓸 수 있다.","vertical_link":"[학년 나선형] G1-EXP-W5 ➔ G2-EXP-W5 ➔ G3-EXP-W5","horizontal_link":"[공통기초 결합] A3(주술·목서·부사어·시제·높임 호응 및 문장부호 교정), A4(응집성 교정) | ⬅ [공통 A3·A4 및 읽기 V3-1·V3-2 수용] 내용·조직·표현(주술/부사어 호응, 시제, 맞춤법, 교정부호) 3단계 메타인지 퇴고"},{"code":"G3-EXP-V1-1","grade":"3학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-1 내용 확인 (명시적 정보·대상·사실 식별)","sub_skill_name":"내용 확인 (대상과 특징·세부 정보 식별)","curriculum_basis":"`[4국02-01]`(문단의 중심 생각을 파악한다), `[4국02-02]`(글의 세부 내용을 정확하게 확인한다), `CCSS RI.3.1`(텍스트를 명시적으로 근거로 삼아 질문에 답하기).","dc_step1":"2~3문단으로 이루어진 설명문에서 각 문단이 다루는 설명 대상의 하위 항목(예: 생김새, 먹이, 사는 곳)을 나타내는 핵심 어휘를 찾는다.","dc_step2":"각 하위 항목별로 제시된 구체적 사실, 뜻풀이, 예시 정보를 문단 단위로 묶어 본문의 문장 근거(위치)와 연결한다.","dc_step3":"문단별 핵심 질문에 대해 본문의 명시적 문장을 근거로 들어 세부 사실 정보를 빠짐없이 추출한다.","mager_reading":"[조건] 2~3문단 분량의 자연·문화 소재 설명문이 주어졌을 때, [준거] 각 문단에서 설명하는 대상의 주요 특징과 세부 사실 정보를 문단별로 2가지 이상(본문 근거 문장 위치 포함) 정확히, [행동] 찾아 밑줄을 긋고 내용 일치 여부를 판별할 수 있다.","mager_writing":"[조건] 읽은 설명문의 문단별 세부 정보 질문지가 주어졌을 때, [준거] 본문에 명시된 핵심 낱말을 포함하여 각 문단의 세부 특징 2가지 이상을 사실 왜곡 없이, [행동] 완결된 문장으로 작성하여 답할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V1-1 ➔ G3-EXP-V1-1 ➔ G4-EXP-V1-1","horizontal_link":"[공통기초 결합] A1(해독·어휘·형태소), A2(감각어·기초어휘) | ➔ [쓰기 W2 전이] 읽기에서 포착한 장르별 필수 요소(대상/인물/경험/개념/주장·근거)를 내 글의 내용 생성 항목으로 전환"},{"code":"G3-EXP-V1-2","grade":"3학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-2 관계 확인 (지시·인과·문장골격·비유·중심세부 관계)","sub_skill_name":"관계 확인 (문단 내 중심-세부, 어휘 위계, 문장 골격, 지시·인과 관계)","curriculum_basis":"`[4국02-01]`(문단의 중심 생각과 뒷받침 내용을 파악한다), `[4국04-02]`(낱말 사이의 의미 관계를 파악한다), `CCSS RI.3.8`(문단 내 문장들의 논리적 연결: 비교, 원인/결과, 순서).","dc_step1":"한 문단(4~6문장) 안에서 문단 전체의 내용을 대표하는 포괄적 문장(주로 첫 문장 또는 마지막 문장)과 ‘예를 들어, 왜냐하면, 또한’으로 시작하는 세부 문장을 찾는다.","dc_step2":"문단 내 문장들을 [중심문장(1개) ↔ 뒷받침문장(3~4개)]으로 구분하고, 어휘들의 상하위 관계(포함하는 말: 악기 ↔ 포함되는 말: 피아노, 북, 바이올린)와 연결한다.","dc_step3":"뒷받침문장이 중심문장을 어떻게 도와주는지(예시 제시, 자세한 설명, 이유 설명) 확인하고 문단 구조 틀에 배치한다.","mager_reading":"[조건] 2~3문단으로 된 설명문이 주어졌을 때, [준거] 각 문단의 중심문장 1개와 뒷받침문장들을 100% 정확히 구분하고, 본문 어휘의 상하위(포함하는 말-포함되는 말) 관계 2쌍 이상을, [행동] 찾아 분류할 수 있다.","mager_writing":"[조건] 문단의 중심문장과 뒤섞인 뒷받침문장 및 어휘 카드들이 주어졌을 때, [준거] 중심문장에 어울리는 뒷받침문장 3개를 골라 논리적 순서로 배열하고 상하위 어휘 관계를, [행동] 도식(중심-뒷받침 표)으로 완성해 쓸 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V1-2 ➔ G3-EXP-V1-2 ➔ G4-EXP-V1-2","horizontal_link":"[공통기초 결합] A1(상하위·단어관계), A3(문장골격 주·목·서), A4(지시어·접속어), A5(명시적 인과) | ➔ [쓰기 W3·W4 전이] 텍스트 내 관계(비유/인과/경험-감상/중심-뒷받침/주장-근거) 원리를 내 문단 연결 및 문장 구성에 적용"},{"code":"G3-EXP-V1-3","grade":"3학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-3 구조 확인 (갈래별 미시·거시 텍스트 구조 도해)","sub_skill_name":"구조 확인 (설명 방법 및 거시적 텍스트 구조 도해)","curriculum_basis":"`[4국02-01]`(문단의 짜임 파악), `[4국02-02]`(글의 기본 구조 고려하며 읽기), `CCSS RI.3.5 & RI.3.8`(시간, 순서, 원인/결과, 비교 등 문단 및 문장 간 논리적 구조 파악).","dc_step1":"2~3문단 설명문에서 뜻풀이 표현(‘~란 ~을 말합니다’), 예시 표현(‘예를 들면 ~이 있습니다’), 나열·시간·장소 이동 표현을 찾는다.","dc_step2":"각 문단이 대상을 설명하기 위해 사용한 기초 설명 방법(뜻풀이[정의], 예시, 열거, 시간·공간 순서)을 문단별로 연결한다.","dc_step3":"문단별 짜임을 확인하고 표나 기초 구조 틀에 대상의 뜻, 예시, 특징들을 정리한다.","mager_reading":"[조건] 정의·예시·열거·시간 순서가 사용된 2~3문단의 설명문이 주어졌을 때, [준거] 담화표지(‘~란 ~이다, 예를 들어, 첫째~둘째’)를 단서로 각 문단에 쓰인 설명 방법과 문단 짜임을 3개 중 2개 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 읽은 설명문과 문단 짜임 정리표가 주어졌을 때, [준거] 대상의 ‘뜻(정의) - 구체적 예(예시) - 주요 특징(열거)’을 항목별로 구분하여, [행동] 구조 정리표를 완결된 어구·문장으로 완성할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V1-3 ➔ G3-EXP-V1-3 ➔ G4-EXP-V1-3","horizontal_link":"[공통기초 결합] A4(담화 전환 표지), A5(선후·인과·구조), A6(문단 짜임) | ➔ [쓰기 W3 직결] 읽기에서 완성한 \'갈래별 구조 도해조직자\'를 내 글의 \'개요 설계 틀(Graphic Organizer)\'로 1:1 미러링"},{"code":"G3-EXP-V1-4","grade":"3학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-4 요약 및 주제 확인 (핵심 골격 간추리기·주제·제목)","sub_skill_name":"요약 및 주제 확인 (중심 내용 간추리기 & 제목 붙이기)","curriculum_basis":"`[4국02-01]`(문단의 중심 생각을 파악한다), `[4국02-02]`(글의 중심 내용을 간추린다), `CCSS RI.3.2`(텍스트의 중심 생각[Main idea]을 결정하고 핵심 세부사항이 어떻게 중심 생각을 뒷받침하는지 설명하기).","dc_step1":"2~3문단 설명문에서 각 문단의 중심문장을 찾아 밑줄을 긋고, 뒷받침문장(구체적 예시·부연 설명)을 괄호로 묶는다.","dc_step2":"각 문단의 중심문장에서 꾸미는 말을 줄여 문단별 중심 생각을 짧은 문장으로 만든다.","dc_step3":"문단별 중심 생각을 자연스럽게 이어 글 전체의 요약문을 만들고 글 전체를 아우르는 제목을 붙인다.","mager_reading":"[조건] 2~3문단 분량의 설명문이 주어졌을 때, [준거] 세부 예시만 담긴 지엽적 제목이나 문장을 배제하고, 각 문단의 중심 생각과 글 전체의 주제를 포괄하는 제목을 100% 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 2~3문단 분량의 설명문이 주어졌을 때, [준거] 각 문단의 중심문장을 찾아 불필요한 예시를 빼고 2~3문장으로 간추려 쓴 뒤, 글 전체 내용을 대표하는 제목을, [행동] 생성하여 쓸 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V1-4 ➔ G3-EXP-V1-4 ➔ G4-EXP-V1-4","horizontal_link":"[공통기초 결합] A3(수식어 삭제·문장골격 추출), A6(중심-세부 위계 및 삭제·선택·일반화·구성 요약) | ➔ [쓰기 W1·W4 전이] 요약한 중심 명제와 제목 짓기 원리를 내 글의 핵심 주제문(Topic Sentence) 및 제목 설정에 적용"},{"code":"G3-EXP-V2-1","grade":"3학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-1 어휘·비유·관용표현·형태소 문맥 추론","sub_skill_name":"학술 어휘·형태소 및 다의어 문맥 추론","curriculum_basis":"`[4국02-02]`(문맥을 고려하여 낱말의 의미를 파악하며 읽는다), `[4국04-01]`(국어사전에서 낱말을 찾는 방법을 알고 뜻을 확인한다), `CCSS RI.3.4 & L.3.4a-d`(문맥 단서, 접사·어근, 사전을 활용한 일반 학술 어휘 및 교과 어휘 의미 파악).","dc_step1":"2~3문단 설명문에서 모르는 개념어나 소리·모양은 같지만 뜻이 여러 개인 낱말(다의어·동음이의어)의 앞뒤 문장 단서(예시, 비슷한 말, 반대말)를 찾는다.","dc_step2":"앞뒤 문맥 단서로 낱말의 뜻을 먼저 추론한 뒤, 기본형을 파악하여 국어사전의 여러 뜻풀이(①, ②, ③) 중 본문 문맥에 딱 맞는 번호를 연결한다.","dc_step3":"추론한 뜻과 사전적 의미를 대조하여 본문 속 어휘의 정확한 의미를 확정한다.","mager_reading":"[조건] 2~3문단의 설명문과 국어사전의 다의어·동음이의어 뜻풀이 항목(①~③)이 주어졌을 때, [준거] 앞뒤 문장의 예시·설명 단서를 바탕으로 본문 어휘의 의미를 추론하고 사전에서 문맥에 맞는 뜻풀이 번호를 100% 정확히, [행동] 선택할 수 있다.","mager_writing":"[조건] 본문 속 낯선 개념어나 다의어가 주어졌을 때, [준거] (1) 문맥 단서로 짐작한 뜻과 (2) 국어사전에서 확인한 문맥적 의미를 비교하여, [행동] 어휘 뜻풀이 기록표에 완결된 문장으로 작성할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V2-1 ➔ G3-EXP-V2-1 ➔ G4-EXP-V2-1","horizontal_link":"[공통기초 결합] A1(합성어·파생어 어근·접사 분석), A2(다의어·동형어·속담·관용표현 문맥 추론) | ➔ [쓰기 W2·W4 전이] 문맥으로 추론한 비유·다의어·관용표현·학술어를 내 글의 생생하고 설득력 있는 표현 재료로 활용"},{"code":"G3-EXP-V2-2","grade":"3학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-2 생략된 상황·인과·숨은 전제·거시지시어 추론","sub_skill_name":"문단 간 응집성(거시 지시어) 및 생략된 인과·과정 추론","curriculum_basis":"`[4국02-02]`, `[4국02-03]`(글에서 생략된 내용을 추론하며 읽는다), `CCSS RI.3.3`(일련의 사건, 과학적 개념·절차 간의 시간·인과 관계 추론).","dc_step1":"2~3문단 설명문에서 앞 문단의 내용을 받아 이어 주는 지시 표현(‘이처럼, 이러한 까닭으로’)과 원인과 결과 사이의 빈틈을 찾는다.","dc_step2":"‘이처럼/이러한 까닭으로’가 앞 문단의 어떤 문장들을 가리키는지 묶어 보고, 배경지식을 더해 생략된 설명 내용을 연결한다.","dc_step3":"글에 직접 드러나지 않은 이유나 현상의 결과를 추론하여 설명의 빈틈을 메운다.","mager_reading":"[조건] 2~3문단의 설명문이 주어졌을 때, [준거] 문단 시작 부분의 지시 표현(‘이처럼, 이러한 특징 때문에’)이 가리키는 앞 문단의 중심 내용과 생략된 이유·결과를 85% 이상 정확히, [행동] 추론하여 연결할 수 있다.","mager_writing":"[조건] 읽은 설명문과 추론 질문지가 주어졌을 때, [준거] 본문의 단서 문장과 자신의 배경지식을 결합하여 생략된 까닭이나 이어질 결과를 완결된 1~2문장으로, [행동] 추론해 쓸 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V2-2 ➔ G3-EXP-V2-2 ➔ G4-EXP-V2-2","horizontal_link":"[공통기초 결합] A4(생략 성분 복원·거시 지시어 역추적), A5(생략된 매개 인과·숨은 전제 추론) | ➔ [쓰기 W3·W5 전이] 생략된 맥락·인과·전제 추론 원리를 통해 내 글의 논리적 비약이나 사건 빈틈을 메우며 조직·퇴고"},{"code":"G3-EXP-V2-3","grade":"3학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-3 인물 심리·화자 정서·시각자료·독자반응 추론","sub_skill_name":"텍스트와 시각 매체 자료 간 통합 추론","curriculum_basis":"`[4국02-04]`(사진, 그림, 도표 등의 자료를 활용하며 읽기), `CCSS RI.3.7`(삽화·지도·사진에서 얻은 정보와 텍스트의 단어를 결합하여 사건·장소·과정 이해하기).","dc_step1":"2~3문단 설명문에 포함된 표나 막대그래프에서 가장 높은/낮은 항목과 눈에 띄는 차이를 찾는다.","dc_step2":"표·그래프에서 발견한 차이를 본문 문단에서 설명하는 이유(까닭)와 연결한다.","dc_step3":"왜 표·그래프에서 그런 차이가 나타났는지 본문과 도표를 결합하여 추론한다.","mager_reading":"[조건] 표나 막대그래프가 포함된 2~3문단 설명문이 주어졌을 때, [준거] 표·그래프의 수치 차이와 본문의 설명 내용을 연결하여 특정 항목이 가장 높거나 낮게 나타난 까닭을 85% 이상 정확히, [행동] 추론할 수 있다.","mager_writing":"[조건] 설명문과 표·막대그래프가 주어졌을 때, [준거] 도표에서 드러난 특징 1가지와 본문에서 찾은 그 까닭을 결합하여 2문장으로, [행동] 설명할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V2-3 ➔ G3-EXP-V2-3 ➔ G4-EXP-V2-3","horizontal_link":"[공통기초 결합] A2(감정·태도 어휘), A5(상황-반응 내적 인과 연결) | ➔ [쓰기 W1·W4 전이] 화자/인물 심리·시각자료·예상 독자 반응 추론을 바탕으로 독자 맞춤형 표현·시각자료·반론 대응 구사"},{"code":"G3-EXP-V2-4","grade":"3학년","genre":"설명문","domain":"2. 추론적 이해","layer":"V2-4 작가(필자) 의도·관점·시점·맥락 추론","sub_skill_name":"필자의 집필 목적·예상 독자·관점 추론","curriculum_basis":"`[4국02-03]`(글쓴이의 생각이나 글 쓴 목적을 추론하며 읽는다), `CCSS RI.3.6`(텍스트에 드러난 필자의 관점 파악).","dc_step1":"2~3문단 설명문에서 글쓴이가 특히 자세하게 설명하거나 반복하여 강조한 어휘·문장을 찾는다.","dc_step2":"설득하려는 글(주장하는 글)이나 감동을 주는 글(시·이야기)과 비교하여, 설명문 필자가 독자에게 전달하려는 정보 제공 목적을 연결한다.","dc_step3":"글쓴이가 이 글을 통해 독자가 무엇을 이해하기를 바라는지 집필 목적을 추론한다.","mager_reading":"[조건] 2~3문단의 설명문이 주어졌을 때, [준거] 주장하는 글의 목적(설득)과 구별하여 설명문 글쓴이의 구체적인 집필 목적과 중심 생각을 85% 이상 정확히, [행동] 추론하여 판별할 수 있다.","mager_writing":"[조건] 2~3문단 설명문이 주어졌을 때, [준거] 본문에서 강조된 내용을 근거로 들어 글쓴이가 독자에게 알려 주고자 한 집필 목적을 1~2문장으로, [행동] 서술할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V2-4 ➔ G3-EXP-V2-4 ➔ G4-EXP-V2-4","horizontal_link":"[공통기초 결합] A6(전체 주제 의식 도출), A2(어조·어감 분석) | ➔ [쓰기 W1 직결] 필자의 집필 의도·관점·맥락 추론을 역적용하여 내 글의 집필 목적·서술 시점·관점 수립"},{"code":"G3-EXP-V3-1","grade":"3학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-1 표현·서술 방식 및 근거·시각자료 적절성 평가","sub_skill_name":"설명 방법·표현 및 시각 자료의 적절성 평가","curriculum_basis":"`[4국02-04]`(사진, 그림, 도표 등의 자료가 글의 내용에 알맞은지 생각하며 읽기), `CCSS RI.3.7 & RI.3.8`.","dc_step1":"2~3문단 설명문에서 어려운 낱말에 뜻풀이나 예시가 있는지, 그리고 함께 실린 사진·표가 본문 내용과 관련이 있는지 확인한다.","dc_step2":"독자(3학년 학생) 입장에서 예시와 사진·표가 내용을 이해하는 데 실제로 도움이 되는지 연결하여 따져 본다.","dc_step3":"설명 표현과 시각 자료의 알맞음을 평가하고 더 나은 예시나 자료를 제안한다.","mager_reading":"[조건] 2~3문단 설명문과 첨부된 사진·표 자료가 주어졌을 때, [준거] 어려운 개념에 대한 예시의 적절성과 사진·표 자료가 본문 내용에 부합하는지 여부를 85% 이상 정확히, [행동] 평가하여 판별할 수 있다.","mager_writing":"[조건] 예시가 없거나 본문과 맞지 않는 사진이 들어간 2~3문단 설명문이 주어졌을 때, [준거] 독자가 더 쉽게 이해할 수 있도록 알맞은 예시 1개와 교체할 시각 자료를 구체적으로, [행동] 제안하여 쓸 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V3-1 ➔ G3-EXP-V3-1 ➔ G4-EXP-V3-1","horizontal_link":"[공통기초 결합] A1·A2(어휘·비유·표현 효과 비교), A3(문장 명료성) | ➔ [쓰기 W4·W5 직결] 좋은 표현·시각자료·근거 적절성 평가 준거를 내 초고 집필 및 표현 퇴고 루브릭으로 적용"},{"code":"G3-EXP-V3-2","grade":"3학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-2 작품 공감·인물선택·내용 정확성·논리 타당성 평가","sub_skill_name":"정보의 정확성·객관성·출처 신뢰성 및 관점 공정성 평가","curriculum_basis":"`[4국02-03]`(사실과 의견을 구별하며 읽는다), `CCSS RI.3.8`, 호주 ACARA Y3(정보 텍스트의 사실성과 주관적 평가 언어 구분).","dc_step1":"2~3문단 설명문에서 정보가 어디에서 나왔는지 알려 주는 말(출처)과 ‘카더라, 아마 ~일 것이다’ 같은 불확실한 추측 표현을 찾는다.","dc_step2":"백과사전·책 등 믿을 만한 곳에서 확인한 사실인지, 근거 없는 소문이나 글쓴이의 추측인지 대조한다.","dc_step3":"설명문 속 정보의 사실 여부를 판단하고 확인이 필요한 문장을 골라낸다.","mager_reading":"[조건] 2~3문단 설명문이 주어졌을 때, [준거] 검증된 사실 진술과 불확실한 추측·주관적 의견이 섞인 진술을 85% 이상 정확히, [행동] 구분하고 사실 확인이 필요한 정보를 찾을 수 있다.","mager_writing":"[조건] 출처가 없거나 추측 표현이 섞인 2~3문단 설명문이 주어졌을 때, [준거] 왜 그 정보를 그대로 믿기 어려운지 이유(출처 누락/추측 표현)를 1~2문장으로, [행동] 설명할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V3-2 ➔ G3-EXP-V3-2 ➔ G4-EXP-V3-2","horizontal_link":"[공통기초 결합] A5(근거-주장 논리적 타당성·인과 오류 점검) | ➔ [쓰기 W2·W5 직결] 인물의 선택·정보 객관성·논리 타당성 평가 준거를 내 글의 내용 타당성·공정성 자기점검 기준으로 적용"},{"code":"G3-EXP-V3-3","grade":"3학년","genre":"설명문","domain":"3. 평가적 이해","layer":"V3-3 내 삶 연결·내면화 및 다매체 비교·팩트체크","sub_skill_name":"다중 설명 자료 교차 검증 및 지식 재구성","curriculum_basis":"`[4국02-04]`, `CCSS RI.3.9`(동일 주제에 관한 두 텍스트에서 제시된 가장 중요한 점들과 핵심 세부사항을 비교·대조하기).","dc_step1":"같은 대상을 다룬 2개의 설명문(예: 생김새·습성을 다룬 글 vs 보호 방법을 다룬 글)에서 각 글의 중심 내용을 찾는다.","dc_step2":"두 글이 같은 대상을 각각 어떤 측면에서 설명하고 있는지 비교하고, 서로 겹치는 정보와 보충되는 정보를 연결한다.","dc_step3":"두 글의 정보를 모아 대상에 대한 종합 설명 카드를 만든다.","mager_reading":"[조건] 동일 대상을 서로 다른 측면에서 설명한 2~3문단의 글 두 편이 주어졌을 때, [준거] 각 글의 설명 초점 차이와 공통점·차이점을 85% 이상 정확히, [행동] 비교하여 파악할 수 있다.","mager_writing":"[조건] 동일 대상에 대한 두 편의 설명문이 주어졌을 때, [준거] 두 글의 핵심 정보를 빠짐없이 통합하여 3~4문장의 종합 소개글로, [행동] 재구성하여 쓸 수 있다.","vertical_link":"[학년 나선형] G2-EXP-V3-3 ➔ G3-EXP-V3-3 ➔ G4-EXP-V3-3","horizontal_link":"[공통기초 결합] A6(다중 텍스트 통합·재구성) | ➔ [쓰기 W1·W2 직결] 텍스트와 내 삶·다중 매체를 연결·검증한 성찰 결과를 내 글쓰기의 직접적 글감·주제로 채택"},{"code":"G3-EXP-W1","grade":"3학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W1 계획하기 (목적·독자·주제·갈래 설정)","sub_skill_name":"계획하기 (설명 목적·독자 분석·대상 및 주제 좁히기)","curriculum_basis":"`[4국03-01]`(중심문장과 뒷받침문장을 갖추어 문단을 쓸 계획을 세운다), `CCSS W.3.2a & W.3.4`(과제와 목적에 맞는 글쓰기 계획).","dc_step1":"생활 주변이나 교과 학습 소재 중에서 한 문단 이상으로 자세히 설명할 대상을 탐색한다.","dc_step2":"설득이나 감상 표현이 아닌 ‘정확한 정보 전달’이라는 설명 목적에 맞게 대상의 어떤 점(생김새, 쓰임새, 유래 등)을 설명할지 연결한다.","dc_step3":"설명 대상, 설명 목적, 중심 생각을 계획서에 정리한다.","mager_reading":"[조건] 여러 가지 글쓰기 주제와 목적 진술문이 주어졌을 때, [준거] 주장·감상 목적과 구별하여 ‘대상의 정보를 객관적으로 알려 주는 설명문 계획’을 100% 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 설명하는 문단 쓰기 계획 양식이 주어졌을 때, [준거] [설명할 대상], [설명할 목적], [가장 중심이 되는 생각 1문장]을 명확하게, [행동] 작성할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-W1 ➔ G3-EXP-W1 ➔ G4-EXP-W1","horizontal_link":"[공통기초 결합] A6(주제 설정) + 읽기 V1-4/V2-4(작가 의도·목적)·V3-3(삶 연결 글감) 전이 | ⬅ [읽기 V2-4·V3-3 수용] 필자 의도 추론과 내 삶 연결 성찰에서 도출한 글감·주제·독자를 글쓰기 계획으로 확정"},{"code":"G3-EXP-W2","grade":"3학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W2 내용 생성하기 (글감·감각/비유·사실/근거 자료 수집)","sub_skill_name":"내용 생성하기 (다중 출처 자료 수집·정확성/신뢰성 검증·시각자료 기획)","curriculum_basis":"`[4국03-01]`, `CCSS W.3.7 & W.3.8`(인쇄·디지털 자료에서 정보를 수집하고 메모하기).","dc_step1":"설명할 대상에 대해 국어사전, 어린이 백과사전, 관련 도서에서 뜻(정의), 구체적 예시, 주요 특징 정보를 찾아 메모한다.","dc_step2":"수집한 정보들이 내가 세운 문단의 중심 생각을 잘 뒷받침하는지 점검하고 관련 없는 세부 내용을 뺀다.","dc_step3":"중심문장을 뒷받침할 사실·정의·예시 정보 3~4가지와 사진 자료를 확정한다.","mager_reading":"[조건] 문단의 중심 생각과 여러 개의 수집 자료 카드가 주어졌을 때, [준거] 중심 생각과 직접 관련이 있고 사실에 부합하는 뒷받침 자료 카드를 85% 이상 정확히, [행동] 골라낼 수 있다.","mager_writing":"[조건] 설명할 주제와 참고 도서·사전 자료가 주어졌을 때, [준거] 중심 생각을 뒷받침할 대상의 뜻(정의), 구체적 예시, 사실 특징을 3가지 이상 찾아, [행동] 자료 수집 카드에 메모할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-W2 ➔ G3-EXP-W2 ➔ G4-EXP-W2","horizontal_link":"[공통기초 결합] A1·A2(감각어·복합어·비유·관용어 생성) + 읽기 V1-1/V2-1/V3-1 전이 | ⬅ [읽기 V1-1·V2-1·V3-1 수용] 읽은 모델 텍스트의 소재·어휘·근거 기준을 활용하여 풍부한 글감과 자료 생성"},{"code":"G3-EXP-W3","grade":"3학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W3 내용 조직하기 (읽기 구조 미러링 개요·도해 설계)","sub_skill_name":"내용 조직하기 (6대 설명 구조 선택·처음-가운데-끝 개요·담화표지 배치)","curriculum_basis":"`[4국03-01]`(중심문장과 뒷받침문장의 관계를 생각하며 문단 내용 조직하기), `CCSS W.3.2a & W.3.2c`(관련 정보를 함께 묶고 연결어로 아이디어 이어주기).","dc_step1":"수집한 자료 중에서 문단 맨 앞에 놓을 ‘중심문장’ 감과 그 뒤에 놓을 ‘뒷받침 내용(정의, 특징, 예시)’을 구분한다.","dc_step2":"뒷받침 내용들을 비슷한 것끼리 묶고 그사이에 들어갈 이어 주는 말(‘예를 들어, 또한, 그리고’)을 연결한다.","dc_step3":"[중심문장 ➔ 뒷받침 내용 1·2·3]의 문단 개요 틀을 완성한다.","mager_reading":"[조건] 중심 생각과 여러 뒷받침 자료 조각이 주어졌을 때, [준거] 중심문장의 위치(두괄식)와 뒷받침 내용의 논리적 배열 및 연결어를 85% 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 수집한 설명 자료와 문단 구성 틀이 주어졌을 때, [준거] [중심문장 1개]와 이를 뒷받침하는 [세부 내용 3개 이상] 및 사용할 [이어 주는 말]을 구분하여, [행동] 한 문단 개요표를 완성할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-W3 ➔ G3-EXP-W3 ➔ G4-EXP-W3","horizontal_link":"[공통기초 결합] A4(담화표지 배치)·A6(개요 위계) + 읽기 V1-2/V1-3(텍스트 구조 도해조직자 미러링) 전이 | ⬅ [읽기 V1-2·V1-3 수용] 읽기 단계의 텍스트 구조 도해조직자를 내 글의 문단·연·플롯 개요 틀로 전환하여 조직"},{"code":"G3-EXP-W4","grade":"3학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W4 초고 집필하기 (갈래별 핵심 표현 전략·문장화)","sub_skill_name":"집필하기 (중심-뒷받침 위계·학술 어휘 뜻풀이·객관적 어조·시각자료 통합 집필)","curriculum_basis":"`[4국03-01]`(중심문장과 뒷받침문장을 갖추어 문단을 쓴다), `CCSS W.3.2a-d`(사실, 정의, 세부사항으로 주제를 전개하고 연결어를 사용하여 문단 구성하기).","dc_step1":"문단 시작할 때 첫 칸을 비우고(들여쓰기), 문단 전체를 대표하는 ‘중심문장’ 1개를 맨 앞에 명확하게 쓴다.","dc_step2":"중심문장 뒤에 뜻풀이(‘~란 ~을 말합니다’), 구체적 예시(‘예를 들어 ~가 있습니다’), 세부 특징 문장 3~4개를 이어 주는 말과 함께 연결하여 쓴다.","dc_step3":"중심 생각에서 벗어나는 문장 없이 통일성을 갖춘 한 문단(또는 2문단) 설명글을 완성한다.","mager_reading":"[조건] 여러 학생이 쓴 설명 문단 예시들이 주어졌을 때, [준거] 들여쓰기 규칙, 중심문장의 명확성, 그리고 뒷받침문장들이 중심문장과 긴밀히 연결되었는지를 85% 이상 정확히, [행동] 판별할 수 있다.","mager_writing":"[조건] 작성한 한 문단 개요표가 주어졌을 때, [준거] (1) 문단 첫 칸 들여쓰기를 지킬 것, (2) 중심문장 1개와 이를 구체화하는 뒷받침문장(정의·예시·특징) 3~4개를 갖출 것, (3) 알맞은 이어 주는 말을 1개 이상 사용할 것의 준거를 모두 충족하여 4~6문장의 완결된 설명 문단을, [행동] 집필할 수 있다.","vertical_link":"[학년 나선형] G2-EXP-W4 ➔ G3-EXP-W4 ➔ G4-EXP-W4","horizontal_link":"[공통기초 결합] A2·A3(문장 확장·장르별 표현 전략 구사) + 읽기 V1~V3 통합 전이 | ⬅ [읽기 전 과정 수용] 계획·생성·조직한 개요와 갈래별 핵심 표현 전략을 결합하여 완결된 초고 집필"},{"code":"G3-EXP-W5","grade":"3학년","genre":"설명문","domain":"4. 표현하기(과정중심 쓰기)","layer":"W5 고쳐쓰기 (내용·조직·표현[주술호응·교정부호] 3단계 퇴고)","sub_skill_name":"고쳐쓰기 (내용 정확성/객관성·조직 응집성·표현 주술/부사어 호응 `[6국04-05]` 3단계 교정부호 퇴고)","curriculum_basis":"`[4국03-01]`, `[4국03-04]`(쓴 글을 읽으며 문단과 문장을 고쳐 쓴다), `CCSS W.3.5`(계획, 수정, 편집을 통해 글 발전시키기).","dc_step1":"작성한 설명 문단에서 중심문장과 관련 없는 엉뚱한 문장(통일성 위배)이나 빠져서 설명이 부족한 곳을 찾는다.","dc_step2":"문장과 문장 사이의 이어 주는 말이 맞는지, 그리고 더 알맞은 어휘로 바꿀 곳은 없는지 점검한다.","dc_step3":"중심 생각에서 벗어난 문장을 지우고 부족한 예시·설명을 보충하여 문단을 고쳐 쓴다.","mager_reading":"[조건] 중심 생각에서 벗어난 문장 1개와 잘못 쓰인 이어 주는 말 1개가 포함된 설명 문단이 주어졌을 때, [준거] 삭제해야 할 문장과 고쳐야 할 이어 주는 말을 100% 정확히, [행동] 식별할 수 있다.","mager_writing":"[조건] 자신이 쓴 설명 문단 초안(또는 오류 포함 예시 문단)이 주어졌을 때, [준거] 중심 생각과 어울리지 않는 문장을 삭제하고 알맞은 이어 주는 말과 뒷받침 문장을 보충하여, [행동] 통일성 있는 문단으로 고쳐 쓸 수 있다.","vertical_link":"[학년 나선형] G2-EXP-W5 ➔ G3-EXP-W5 ➔ G4-EXP-W5","horizontal_link":"[공통기초 결합] A3(주술·목서·부사어·시제·높임 호응 및 문장부호 교정), A4(응집성 교정) | ⬅ [공통 A3·A4 및 읽기 V3-1·V3-2 수용] 내용·조직·표현(주술/부사어 호응, 시제, 맞춤법, 교정부호) 3단계 메타인지 퇴고"},{"code":"G4-EXP-V1-1","grade":"4학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-1 내용 확인 (명시적 정보·대상·사실 식별)","sub_skill_name":"내용 확인 (대상과 특징·세부 정보 식별)","curriculum_basis":"`[4국02-04]`(글에 사용된 사진이나 그림, 도표 등의 자료를 활용하며 읽는다), `CCSS RI.4.1 & RI.4.7`(텍스트의 명시적 세부사항 및 도표·그래프의 정보 확인), `PIRLS`(명시적 사실 및 시각 자료 수치 확인).","dc_step1":"3~4문단 설명문 본문의 세부 수치·사례 정보와 함께 제시된 표·막대그래프·꺾은선그래프의 제목, 가로·세로축 항목, 단위를 찾는다.","dc_step2":"본문에서 설명하는 세부 사실(최댓값, 최솟값, 특정 항목의 특징)과 표·그래프에 나타난 명시적 수치를 1:1로 대응시킨다.","dc_step3":"본문 텍스트와 기초 도표에서 확인한 명시적 사실 정보를 항목별로 추출·대조하여 정확성을 확인한다.","mager_reading":"[조건] 표나 막대·꺾은선그래프가 포함된 3~4문단의 설명문이 주어졌을 때, [준거] 본문에 명시된 세부 사실 3가지와 표·그래프의 항목별 수치(단위 포함) 2가지 이상을 오차 없이 정확히, [행동] 찾아내어 본문-도표 간 사실 일치 여부를 식별할 수 있다.","mager_writing":"[조건] 읽은 설명문과 도표의 핵심 정보를 정리하는 요약 카드가 주어졌을 때, [준거] 설명 대상의 주요 특징과 도표에서 확인한 구체적 수치·사례를 단위를 포함해 3문장 이상 정확히, [행동] 사실 정보 확인문으로 서술할 수 있다.","vertical_link":"[학년 나선형] G3-EXP-V1-1 ➔ G4-EXP-V1-1 ➔ G5-EXP-V1-1","horizontal_link":"[공통기초 결합] A1(해독·어휘·형태소), A2(감각어·기초어휘) | ➔ [쓰기 W2 전이] 읽기에서 포착한 장르별 필수 요소(대상/인물/경험/개념/주장·근거)를 내 글의 내용 생성 항목으로 전환"},{"code":"G4-EXP-V1-2","grade":"4학년","genre":"설명문","domain":"1. 사실적 이해","layer":"V1-2 관계 확인 (지시·인과·문장골격·비유·중심세부 관계)","sub_skill_name":"관계 확인 (문단 내 중심-세부, 어휘 위계, 문장 골격, 지시·인과 관계)","curriculum_basis":"`[4국02-01]`(중심문장과 뒷받침문장의 관계), `[4국02-02]`(문단 간의 관계 파악), `CCSS RI.4.5 & RI.4.8`(문단 내·문단 간 인과, 비교, 순서 관계와 세부 근거 연결).","dc_step1":"3~4문단 설명문에서 문단 내 접속부사(‘즉, 다시 말해, 예를 들어, 반면에, 따라서’)와 지시 표현(‘이처럼, 이러한 특징은’)을 모두 찾아 표시한다.","dc_step2":"접속부사와 지시 표현을 단서로 중심문장과 뒷받침문장의 세부 기능(재진술·예시·대조·결과)을 연결하고, 문장 내 주어(무엇이)와 서술어(어찌하다/무엇이다)의 기본 뼈대를 확인한다.","dc_step3":"문단 내부의 [중심문장 - 세부 뒷받침문장] 관계와 문단 사이의 연결 관계를 계층적 가지 그림으로 구조화한다.","mager_reading":"[조건] 3~4문단 분량의 설명문이 주어졌을 때, [준거] 각 문단의 중심문장과 뒷받침문장의 기능(예시·부
