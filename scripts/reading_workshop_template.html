<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교과 읽기 수업자료 2차</title>
<style>
:root{font-family:"Malgun Gothic",sans-serif;color:#233c3d;background:#f2f4ef;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:30px max(24px,calc((100vw - 1240px)/2));background:#183f43;color:white}header p{color:#d7e6df;line-height:1.8;max-width:900px}h1{font-size:29px;margin:12px 0}h2{font-size:25px;line-height:1.6}h3{font-size:19px}a{color:#276c63}header a{color:#d7e6df}.kicker{font-size:12px;letter-spacing:2px}.metrics{display:flex;gap:32px}.metrics strong{font-size:26px}.metrics span{font-size:13px;margin-left:8px}.controls{max-width:1288px;margin:auto;padding:20px 24px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}select,button,textarea,input{font:inherit;border:1px solid #b8c9c2;border-radius:8px;background:white;padding:10px}button{cursor:pointer}button.active{background:#183f43;color:white}#pair{min-width:300px;max-width:100%;flex:1}.status{max-width:1240px;margin:12px auto;font-size:13px;padding:0 24px;color:#5f706b}.layout{max-width:1288px;padding:14px 24px 48px;margin:auto;display:grid;grid-template-columns:minmax(360px,.94fr) minmax(400px,1.06fr);gap:20px;align-items:start}.paper,.lesson{background:white;border:1px solid #d9e2dc;border-radius:15px;padding:27px}.paper{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.meta{font-size:13px;color:#55766c}.body{font-size:17px;line-height:1.95;word-break:keep-all}.pno{font-size:12px;color:#7b9990;border:1px solid #d7e4dd;border-radius:4px;padding:1px 5px;margin-right:8px;white-space:nowrap}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border-bottom:1px solid #dbe6df;text-align:left;line-height:1.6}th{background:#edf4ef}caption{text-align:left;padding:10px 0;font-size:12px;color:#61716c}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.note{padding:14px;background:#fff4da;border-left:3px solid #c69a45;line-height:1.8;font-size:13px}.question{border-top:1px solid #dce5df;padding:20px 0}.question h4{font-size:16px;line-height:1.7;margin:7px 0 12px}.tag{font-size:12px;color:#376d61;background:#edf5ef;padding:4px 7px;border-radius:4px}textarea{width:100%;min-height:82px;resize:vertical;line-height:1.7;margin:7px 0}label{display:block;font-size:13px;line-height:1.7}details{border-top:1px solid #dce5df;margin-top:16px;padding-top:14px;font-size:14px;line-height:1.85}summary{cursor:pointer;font-weight:bold}.small{font-size:12px;line-height:1.8;color:#677871}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row select{max-width:100%}.rubric{background:#f0f5f1;padding:14px;border-radius:8px;margin:14px 0}.step{padding:12px 0;border-top:1px solid #e1e8e2}.step strong{color:#2c6d61}blockquote{border-left:3px solid #a4bcae;margin:12px 0;padding:8px 12px;background:#f6f8f4}.source{overflow-wrap:anywhere}.hidden,[hidden]{display:none!important}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d4a343;outline-offset:2px}footer{max-width:1240px;margin:auto;padding:0 24px 30px;line-height:1.8;font-size:13px;color:#66796f}@media(max-width:920px){.layout{grid-template-columns:1fr}.paper{position:static;max-height:none}.controls{padding:16px}.layout{padding:16px}.status{margin:10px}.paper,.lesson{padding:20px}header{padding:25px 20px}.metrics{gap:20px}.metrics span{display:block;margin:5px 0}}@media print{header,.controls,.status,.tabs,footer,.no-print{display:none}.layout{display:block;padding:0}.paper,.lesson{position:static;max-height:none;overflow:visible;border:none;padding:10px}.question{break-inside:avoid}textarea{min-height:65px}.lesson details:not([open]){display:none}}
</style></head><body>
<header><div class="kicker">READX-RAY · 교사용 검토 자료</div><h1>교과 개념을 읽고, 근거로 설명하기</h1><p>먼저 혼자 읽은 기록을 남기고, 교사의 생각을 따라 연습합니다. 다른 개념을 다룬 짝 지문에서 같은 읽기 목표를 다시 확인합니다.</p><div class="metrics"><div><strong>24</strong><span>이번에 추가한 글</span></div><div><strong>12</strong><span>목표별 수업 묶음</span></div><div><strong>108</strong><span>진단 문항</span></div></div></header>
<div class="controls"><label for="pair">수업 묶음</label><select id="pair"></select><button id="guided" class="active">함께 배우기</button><button id="transfer">새 글에서 확인</button><button id="download">기록 내려받기</button><button id="print">현재 글 인쇄</button></div>
<div id="saveState" class="status" aria-live="polite">응답과 교사 관찰은 이 브라우저에만 저장됩니다.</div>
<div class="layout"><article class="paper" id="passage"></article><section class="lesson" id="activity"></section></div>
<footer>집필자 자체 검토 후 교사 검수와 학생 난도 보정을 기다리는 자료입니다. 점수나 해설 열람만으로 숙달을 자동 판정하지 않습니다. <a href="curriculum-library.html">전체 개념·지문 원장</a></footer>
<script>
const passages=__LESSON_DATA__;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pairs=[...new Set(passages.map(p=>p.pairId))];
const key='readxray-batch02-observations-v1';let records={},saveAvailable=true;
try{records=JSON.parse(localStorage.getItem(key)||'{}');if(!records||Array.isArray(records)||typeof records!=='object')records={};}catch{records={};saveAvailable=false;}
let current=passages[0],panel='diagnostic';
function rec(){if(!records[current.id])records[current.id]={passageId:current.id,version:current.version,goalId:current.goalIds[0],priorExposure:'unknown',items:{},practice:{},exposures:{}};return records[current.id];}
function save(){try{localStorage.setItem(key,JSON.stringify(records));saveAvailable=true;}catch{saveAvailable=false;}$('saveState').textContent=saveAvailable?'이 브라우저에 저장됨 · 서버 전송 없음 · 기록 내려받기로 별도 보관할 수 있습니다.':'브라우저 저장을 사용할 수 없습니다. 창을 닫기 전에 기록을 내려받으세요.';}
function field(k,label,val,cls=''){return `<label>${esc(label)}<textarea data-field="${esc(k)}" class="${cls}">${esc(val||'')}</textarea></label>`;}
function supports(value){return ['independent|도움 없이','word_explanation|낱말 설명 후','location_hint|문단 위치 힌트 후','evidence_hint|근거 문장 힌트 후','teacher_model|교사 시범 후'].map(x=>{const[v,l]=x.split('|');return `<option value="${v}"${v===value?' selected':''}>${l}</option>`}).join('');}
function renderPassage(){const p=current;let tab=p.table?`<table><caption>${esc(p.table.caption)}</caption><thead><tr>${p.table.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${p.table.rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')}</tbody></table>`:'';
 $('passage').innerHTML=`<div class="meta">${p.grade}학년 ${p.semester}학기 · ${esc(p.subject)} · ${p.purpose==='guided_practice'?'함께 배우기':'새 글에서 확인'}</div><h2>${esc(p.title)}</h2><div class="small">교과 개념: ${esc(p.conceptNames.join(', '))} · ${p.charCount}자 · ${p.paragraphs.length}문단</div>${p.paragraphs.map((s,i)=>`<p class="body"><span class="pno">${i+1}</span>${esc(s)}</p>`).join('')}${tab}<details id="vocabulary"><summary>낱말 도움</summary>${p.readabilityReview.vocabularySupport.map(w=>`<p><b>${esc(w.word)}</b> ${esc(w.definition)}</p>`).join('')}<p class="small">뜻을 확인한 뒤 풀면 낱말 지원을 받은 수행으로 기록합니다.</p></details><details><summary>교육과정 연결과 집필 검토</summary><p>${esc(p.curriculumAlignment.standardId)} ${esc(p.curriculumAlignment.statement)}</p><p>${esc(p.readabilityReview.editorialNote)}</p><p class="small">${esc(p.curriculumAlignment.note)} 사회 각론 일부개정 대조는 남아 있습니다.</p>${p.provenance.sources.map(s=>`<p class="source"><a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title)}</a> — ${esc(s.role)}</p>`).join('')}</details>`;
 $('vocabulary').addEventListener('toggle',e=>{if(e.target.open){rec().exposures.vocabularyViewedAt=new Date().toISOString();save();}});
}
function renderActivity(){const p=current,r=rec(),isTransfer=p.purpose==='transfer_check';
 let head=`<div class="meta">읽기 세부목표 · ${esc(p.goalIds[0])}</div><h3>${esc(p.operationalGoal.behavior)}</h3><p class="small">${esc(p.operationalGoal.condition)}</p><div class="tabs"><button data-panel="diagnostic" class="${panel==='diagnostic'?'active':''}">먼저 혼자 읽기</button><button data-panel="process" class="${panel==='process'?'active':''}">${isTransfer?'응답 후 사고 과정 확인':'읽기 사고 과정 따라가기'}</button><button data-panel="writing" class="${panel==='writing'?'active':''}">자기 말로 쓰기</button></div>`;
 if(panel==='diagnostic'){
  head+=`<p class="note">${isTransfer?'처음 읽는 글인지 확인하고, 해설과 힌트를 보기 전에 답하세요. 이미 본 글의 재응답은 새 글의 독립 수행과 구분합니다.':'처음 답과 근거를 먼저 남기세요. 그 뒤 사고 시범을 보며 연습합니다. 연습 뒤 기록은 다른 칸에 남깁니다.'}</p><label>이 글을 전에 읽었나요?<select id="exposure"><option value="unknown">아직 확인하지 않음</option><option value="new">처음 읽음</option><option value="seen">전에 읽음</option></select></label>`;
  head+=p.diagnostic.items.map((it,i)=>{const a=r.items[it.id]||{};return `<div class="question"><span class="tag">${esc(it.stage)} 관찰</span><h4>${i+1}. ${esc(it.prompt)}</h4>${field(it.id+':answer','내 답',a.answer)}${field(it.id+':evidence','내 답의 근거: 문단 번호·문장 또는 표의 항목',a.evidence)}<label>받은 도움<select data-support="${it.id}"><option value="unknown">아직 기록하지 않음</option>${supports(a.support)}</select></label><details class="no-print" data-hint="${it.id}:1"><summary>위치 힌트</summary>${esc(it.hints[0].text)}</details><details class="no-print" data-hint="${it.id}:2"><summary>근거 힌트</summary>${esc(it.hints[1].text)}</details><details data-answer="${it.id}"><summary>교사용 채점·지도 기준 — 독립 응답 후 열기</summary><div class="rubric"><b>기대 응답</b><p>${esc(it.expectedAnswer)}</p><b>본문 근거</b>${it.evidenceLocations.map(e=>`<blockquote>${e.paragraph}문단: ${esc(e.quote)}</blockquote>`).join('')}<b>확인할 오해</b><p>${esc(it.misconceptionToCheck)}</p><b>다음 지도</b><p>${esc(it.prescription.action)}</p></div><label>답의 내용<select data-rating="${it.id}:answerStatus">${ratings(a.answerStatus)}</select></label><label>근거의 적절성<select data-rating="${it.id}:evidenceStatus">${ratings(a.evidenceStatus)}</select></label>${field(it.id+':teacherNote','교사 관찰 메모',a.teacherNote)}<p class="small">${esc(it.acceptedResponse)} 미응답을 오답으로 바꾸지 않습니다.</p></details></div>`}).join('');
 }else if(panel==='process'){
  const steps=p.readingProcess.filter(x=>!['initial','transfer','post_transfer_review'].includes(x.phase));
  head+=`<p class="note">${isTransfer?'독립 응답을 마친 뒤 보는 복습입니다. 이 안내를 먼저 열었다면 이후 답은 시범을 본 뒤의 수행으로 기록하세요.':'첫 문항을 시범으로 보고 다음 문항을 함께 해결한 뒤, 마지막 문항은 도움을 줄여 다시 설명합니다.'}</p><details id="model"><summary>교사의 사고 시범 펼치기</summary><blockquote>${esc(p.teacherThinkingModel.evidenceQuote)}</blockquote><p>${esc(p.teacherThinkingModel.reasoning)}</p></details>${steps.map((s,i)=>`<div class="step"><strong>${i+1}. ${esc(s.title)}</strong><p>${esc(s.prompt)}</p>${s.phase!=='model'?field('practice:'+s.phase,'연습 후 내 설명',r.practice[s.phase]):''}</div>`).join('')}<div class="step"><strong>${isTransfer?'연습 글과 수행 비교':'새 글에서 확인하기'}</strong><p>${isTransfer?'연습 글에서 받은 도움과 이번 글에서 받은 도움을 구분해 보세요.':'교과 개념이 다른 짝 지문을 열어 같은 읽기 목표를 적용하세요.'}</p><button id="paired">${isTransfer?'앞의 연습 글로 돌아가기':'짝 지문 열기'}</button></div>`;
 }else{
  head+=`<p>${esc(p.writingPrompt)}</p>${field('practice:writing','나의 설명',r.practice.writing)}<h4>내 글을 다시 읽으며 확인하기</h4><ul>${p.writingRubric.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${field('practice:reflection','내 답을 바꾸거나 확신하게 만든 근거와 받은 도움',r.practice.reflection)}`;
 }
 $('activity').innerHTML=head;
 document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{panel=b.dataset.panel;renderActivity();}));
 const exposure=$('exposure');if(exposure){exposure.value=r.priorExposure;exposure.addEventListener('change',()=>{rec().priorExposure=exposure.value;save();});}
 document.querySelectorAll('[data-field]').forEach(f=>f.addEventListener('input',()=>{const[id,k]=f.dataset.field.split(':');const r=rec();if(id==='practice')r.practice[k]=f.value;else{const a=r.items[id]??={};a[k]=f.value;a.lastEditedAt=new Date().toISOString();a.exposureAtLastEdit={...r.exposures};}save();}));
 document.querySelectorAll('[data-support]').forEach(f=>{const a=r.items[f.dataset.support]||{};f.value=a.support||'unknown';f.addEventListener('change',()=>{(rec().items[f.dataset.support]??={}).support=f.value;save();});});
 document.querySelectorAll('[data-rating]').forEach(f=>f.addEventListener('change',()=>{const[id,k]=f.dataset.rating.split(':');(rec().items[id]??={})[k]=f.value;save();}));
 document.querySelectorAll('[data-hint]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){const[id,l]=d.dataset.hint.split(':');const a=rec().items[id]??={};a.hintsViewed??=[];if(!a.hintsViewed.includes(Number(l)))a.hintsViewed.push(Number(l));a.lastHintAt=new Date().toISOString();save();}}));
 document.querySelectorAll('[data-answer]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){rec().exposures['answerViewed:'+d.dataset.answer]=new Date().toISOString();save();}}));
 const model=$('model');if(model)model.addEventListener('toggle',()=>{if(model.open){rec().exposures.modelViewedAt=new Date().toISOString();save();}});
 const paired=$('paired');if(paired)paired.addEventListener('click',()=>choose(passages.find(x=>x.pairId===p.pairId&&x.id!==p.id)));
}
function ratings(v){return ['unobserved|미관찰','met|충족','partial|일부 충족','not_met|미충족'].map(x=>{const[k,l]=x.split('|');return `<option value="${k}"${(v||'unobserved')===k?' selected':''}>${l}</option>`}).join('');}
function choose(p){current=p;panel='diagnostic';$('pair').value=p.pairId;location.hash=p.id;$('guided').classList.toggle('active',p.purpose==='guided_practice');$('transfer').classList.toggle('active',p.purpose==='transfer_check');renderPassage();renderActivity();}
$('pair').innerHTML=pairs.map(id=>{const p=passages.find(x=>x.pairId===id);return `<option value="${esc(id)}">${p.grade}학년 ${p.semester}학기 ${esc(p.subject)} · ${esc(p.conceptNames[0])} 외</option>`}).join('');
$('pair').addEventListener('change',()=>choose(passages.find(p=>p.pairId===$('pair').value&&p.purpose==='guided_practice')));
$('guided').addEventListener('click',()=>choose(passages.find(p=>p.pairId===current.pairId&&p.purpose==='guided_practice')));
$('transfer').addEventListener('click',()=>choose(passages.find(p=>p.pairId===current.pairId&&p.purpose==='transfer_check')));
$('download').addEventListener('click',()=>{const payload={schemaVersion:'1',exportedAt:new Date().toISOString(),scope:'교사 검토용 응답·도움 기록; 자동 진단 결과 아님',records};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='읽기활동_관찰기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
$('print').addEventListener('click',()=>window.print());
choose(passages.find(p=>p.id===decodeURIComponent(location.hash.slice(1)))||passages[0]);
if(!saveAvailable)$('saveState').textContent='브라우저 저장을 사용할 수 없습니다. 기록 내려받기로 보관하세요.';
</script></body></html>
