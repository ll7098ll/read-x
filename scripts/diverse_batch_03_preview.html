<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>리드엑스 다양한 주제 읽기와 쓰기</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#183049;background:#f3f6fa;font-size:17px}*{box-sizing:border-box}body{margin:0}header{background:#183049;color:white;padding:26px max(24px,calc((100vw - 1200px)/2))}h1{font-size:27px;margin:0 0 8px}header p{margin:6px 0;color:#d7e5ee;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap;max-width:1200px;margin:20px auto;padding:0 16px}button,select,input,textarea{font:inherit}button,select{padding:10px 14px;border:1px solid #bac9d5;border-radius:10px;background:white;color:#183049;cursor:pointer}button[aria-pressed=true],button.primary{background:#12685e;color:white;border-color:#12685e}button:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #db7a00;outline-offset:3px}#layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:260px 1fr;gap:20px;padding:0 16px 40px}aside{max-height:80vh;overflow:auto;position:sticky;top:15px}aside button{width:100%;text-align:left;margin-bottom:8px;line-height:1.6}small,.meta{font-size:14px;color:#4d6375}main{min-width:0}.card{background:white;border:1px solid #dce3e9;border-radius:16px;padding:24px;margin-bottom:18px}h2{font-size:25px;margin:0 0 8px}h3{font-size:20px}p{line-height:1.95}#passage{background:#fffdf6}.passage p{font-size:20px;line-height:2.05;margin:16px 0}.pno{font-size:13px;color:#617481;display:block}textarea{width:100%;min-height:100px;padding:13px;border:1px solid #b3c2ce;border-radius:10px;line-height:1.8;margin:6px 0 15px}label.option{display:block;border:1px solid #dce3e9;padding:12px;border-radius:10px;margin:8px 0;line-height:1.65;cursor:pointer}label.option:has(input:checked){background:#e7f4f0;border-color:#12685e}label input{margin-right:8px}.status{font-size:15px;color:#12685e;line-height:1.7}.help{background:#eef6ff;padding:14px;margin:12px 0;border-radius:10px}details{line-height:1.8;margin-top:15px}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}th,td{border:1px solid #ccd7e0;padding:10px;text-align:left;vertical-align:top}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#notice{max-width:1200px;margin:0 auto 15px;padding:0 16px;color:#994b00}ol li,ul li{line-height:1.9}footer{padding:15px;text-align:center;color:#5b6c78;font-size:14px}@media(max-width:750px){#layout{grid-template-columns:1fr}aside{position:static;max-height:240px}header{padding:24px}.card{padding:18px}.passage p{font-size:19px}}@media print{header,nav,aside,.tools,button,#notice,footer{display:none}#layout{display:block;max-width:none}.card{break-inside:avoid;border:0}textarea{min-height:100px}.solution:not([open])>*:not(summary){display:none}}
</style>
<header><h1>다양한 주제 읽기와 쓰기</h1><p>초1~6 · 24개 수업 · 72개 독립 자료 계열 · 168문항 · 도움 / 기본 / 도전</p><p>자체 창작 학습 상황과 가상 기록을 활용한 검토용 문제집입니다. 교사 검토와 학생 난도 보정은 대기 중입니다.</p></header>
<nav><label>학년 <select id="grade"><option value="">전체</option></select></label><label>영역 <select id="subject"><option value="">전체</option></select></label><button id="export">내 답안 내려받기</button><button onclick="window.print()">현재 자료 인쇄</button></nav>
<div id="notice" role="status"></div><div id="layout"><aside id="list" aria-label="수업 목록"></aside><main id="main"></main></div><footer>답안은 이 브라우저에 저장됩니다. 서술·쓰기·구조화 답안은 자동 정답 처리하지 않습니다.</footer>
<script>
const DATA=__CONTENT__;const units=DATA.units;const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records={};try{records=JSON.parse(localStorage.getItem('readx-b03-answers-v1')||'{}')}catch{$('notice').textContent='이 브라우저에서는 이전 답안을 불러오지 못했습니다. 답안 내려받기를 이용하세요.'}
let selected=units[0].id,mode='standard';
function save(){try{localStorage.setItem('readx-b03-answers-v1',JSON.stringify(records))}catch{$('notice').textContent='브라우저 저장이 제한되어 있습니다. 닫기 전에 답안을 내려받으세요.'}}
function rec(id){return records[id]??={draft:'',plan:'',revision:'',reason:'',help:[],firstResponse:null,submitted:false}}
for(let g=1;g<=6;g++)$('grade').add(new Option('초'+g,g));for(const s of [...new Set(units.map(u=>u.subject))])$('subject').add(new Option(s,s));
function filtered(){return units.filter(u=>(!$('grade').value||u.grade===$('grade').value*1)&&(!$('subject').value||u.subject===$('subject').value))}
function filters(){const us=filtered();if(!us.some(u=>u.id===selected)){selected=us[0]?.id;mode='standard'}render()}
$('grade').onchange=filters;$('subject').onchange=filters;
function bindField(node,q,key){node.value=rec(q.id)[key]||'';node.oninput=()=>{rec(q.id)[key]=node.value;save()}}
function question(q,purpose){const r=rec(q.id),el=document.createElement('section');el.className='card';el.innerHTML=`<div class="meta">${esc(q.id)} · ${{single_choice:'선택형',explanation:'설명하기',classification:'분류하기',ordering:'순서 배열',matching:'짝짓기',table_completion:'표 완성',writing:'쓰기'}[q.kind]}</div><h3>${esc(q.prompt)}</h3>`;
if(q.items){const ol=document.createElement('ol');q.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;ol.append(li)});el.append(ol)}
if(q.kind==='single_choice'){q.options.forEach((o,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name=q.id;input.checked=r.draft===String(i);input.onchange=()=>{r.draft=String(i);save()};label.append(input,document.createTextNode((i+1)+'. '+o.text));el.append(label)})}
else{if(q.kind==='writing'){const l=document.createElement('label');l.textContent='1. 계획 — '+q.planningPrompt;const a=document.createElement('textarea');a.setAttribute('aria-label','글의 계획');bindField(a,q,'plan');el.append(l,a)}const l=document.createElement('label');l.textContent=q.kind==='writing'?'2. 초고':'내 답과 근거';const a=document.createElement('textarea');a.setAttribute('aria-label',l.textContent);bindField(a,q,'draft');el.append(l,a);if(q.kind==='writing'){const criteria=document.createElement('p');criteria.textContent='검토 기준: '+q.rubric.map(x=>x.criterion).join(' / ');el.append(criteria);for(const [key,label] of [['revision','3. 기준에 따라 고친 글'],['reason','4. 고친 이유']]){const l=document.createElement('label');l.textContent=label;const a=document.createElement('textarea');a.setAttribute('aria-label',label);bindField(a,q,key);el.append(l,a)}}}
if(purpose==='practice'&&mode==='supported'&&q.hints?.length){const b=document.createElement('button');b.textContent='단계별 도움';const help=document.createElement('div');el.append(b,help);let h=0;b.onclick=()=>{if(h<q.hints.length){const p=document.createElement('p');p.className='help';p.textContent='도움 '+(h+1)+': '+q.hints[h];help.append(p);r.help.push({step:++h,at:new Date().toISOString()});save()}if(h===q.hints.length)b.disabled=true}}
const tools=document.createElement('div');tools.className='tools';const submit=document.createElement('button');submit.className='primary';submit.textContent=r.submitted?'답안 다시 제출':'답안 제출';tools.append(submit);const status=document.createElement('p');status.className='status';status.setAttribute('role','status');el.append(tools,status);const solution=document.createElement('details');solution.className='solution';solution.innerHTML='<summary>제출 뒤 해설과 검토 기준 보기</summary>';
function reveal(){status.textContent=q.kind==='single_choice'?(r.firstResponse?.response===String(q.correctIndex)?'첫 제출: 정답':'첫 제출: 오답')+' · 현재 답은 별도로 저장됩니다.':'제출됨 · 예시 답과 준거를 비교하세요. 최종 평가는 교사 검토가 필요합니다.';solution.hidden=false;if(solution.children.length===1){let body=q.kind==='single_choice'?`<p>정답 ${q.correctIndex+1}번 · ${esc(q.explanation)}</p><ol>${q.options.map(o=>'<li>'+esc(o.reason)+'</li>').join('')}</ol>`:`<p><strong>예시 답</strong> ${esc(q.expectedAnswer)}</p><table><tr><th>준거</th><th>0</th><th>1</th><th>2</th></tr>${q.rubric.map(x=>'<tr><td>'+esc(x.criterion)+'</td>'+[0,1,2].map(n=>'<td>'+esc(x.levels[n])+'</td>').join('')+'</tr>').join('')}</table>`;body+='<p>본문 근거: '+q.evidence.map(e=>esc(e.quote)).join(' / ')+'</p>';const d=document.createElement('div');d.innerHTML=body;solution.append(d)}}
solution.hidden=!r.submitted;el.append(solution);if(r.submitted)reveal();submit.onclick=()=>{if(!r.draft.trim()){status.textContent='먼저 답을 작성하거나 선택하세요.';return}if(q.kind==='writing'&&(!r.plan.trim()||!r.revision.trim()||!r.reason.trim())){status.textContent='계획·초고·수정고·고친 이유를 모두 작성하세요.';return}if(!r.firstResponse)r.firstResponse={response:r.draft,plan:r.plan,revision:r.revision,reason:r.reason,at:new Date().toISOString(),help:[...r.help],purpose,materialExposure:'offline_practice_not_verified'};r.submitted=true;r.lastSubmittedAt=new Date().toISOString();save();reveal();submit.textContent='답안 다시 제출'};return el}
function render(){const list=$('list');list.innerHTML='';for(const u of filtered()){const b=document.createElement('button');b.setAttribute('aria-pressed',u.id===selected);b.textContent=`초${u.grade} · ${u.subject}\n${u.title}`;b.onclick=()=>{selected=u.id;mode='standard';render()};list.append(b)}const main=$('main');main.innerHTML='';const u=units.find(x=>x.id===selected);if(!u){main.innerHTML='<p>해당 조건의 자료가 없습니다.</p>';return}const head=document.createElement('section');head.className='card';head.innerHTML=`<div class="meta">초${u.grade} · ${esc(u.subject)} · ${esc(u.genre)}</div><h2>${esc(u.title)}</h2><p class="meta">참고 목표 ${esc(u.goalId)} · 짧은 자료 집중 수업 · 공식 성취기준 연결 검토 대기</p>`;const tabs=document.createElement('div');tabs.className='tools';for(const [id,label]of[['supported','도움'],['standard','기본'],['challenge','도전'],['independent','새 자료 B'],['transfer','새 자료 C']]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',mode===id);b.onclick=()=>{mode=id;render()};tabs.append(b)}head.append(tabs);main.append(head);
let mat=u.material,questions=u.questions,purpose='practice';if(mode==='supported')questions=u.questions.slice(0,3);if(mode==='challenge'){mat=u.challenge.material;questions=[u.challenge.question]}if(mode==='independent'||mode==='transfer'){const c=u.checks[mode==='independent'?0:1];mat=c.material;questions=[c.question];purpose=mat.purpose}
const passage=document.createElement('section');passage.className='card passage';passage.id='passage';passage.innerHTML='<h3>'+esc(mat.title)+'</h3><p class="meta">'+(purpose==='practice'?'연습 자료':'새 자료 확인 · 응답 전 힌트와 해설 없음')+' · '+mat.charCount+'자</p>'+mat.paragraphs.map((p,i)=>'<p><span class="pno">'+(i+1)+'문단</span>'+esc(p.text)+'</p>').join('');for(const t of mat.tables||[]){const box=document.createElement('div');box.style.overflowX='auto';box.innerHTML='<table><caption>'+esc(t.caption)+'</caption><thead><tr>'+t.headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';passage.append(box)}main.append(passage);
if(mode==='supported'){const support=document.createElement('section');support.className='card';support.innerHTML='<h3>핵심어와 생각 시범</h3><p>'+u.vocabulary.map(v=>'<strong>'+esc(v.word)+'</strong>: '+esc(v.meaning)).join('<br>')+'</p><p>'+esc(u.model[0].thought)+'</p>';main.append(support)}
questions.forEach(q=>main.append(question(q,purpose)));const guide=document.createElement('details');guide.className='card';guide.innerHTML='<summary>지도와 보충 활동</summary><p>'+esc(u.teacherGuide.discussion)+'</p><p>보충 질문: '+esc(u.clinic.prompt)+'</p><details><summary>보충 예시 답</summary><p>'+esc(u.clinic.expectedAnswer)+'</p></details><p class="meta">B·C는 검토용 파일에 포함되어 있어 정식 비공개 평가 자료로 사용할 수 없습니다. 재노출 여부는 실제 운영에서 별도 확인해야 합니다.</p>';main.append(guide)}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({batch:'03',exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='readx-b03-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></html>
